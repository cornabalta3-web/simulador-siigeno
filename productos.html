<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIIGENO · Productos nuevos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: cáscara de SIIGENO (barra con las dos caras: Requirentes e Interno, menú lateral con los módulos)
   y el producto en el centro; a la derecha, el panel «Para desarrollo» con estados, reglas y dependencias.
   Identidad del design system de SIIGENO: navy, dorado, celeste, hueso, Montserrat. */
:root{
  --navy:#1B2F5E; --navy-d:#0F1C3A; --gold:#C9A84C; --cel:#A8C8E8; --cel-s:#E8F0F9; --bone:#EEF2F5;
  --bg:#EEF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB; --fg:#1E2634; --muted:#5F6E85; --line:#D8E0EA;
  --accent:#1B2F5E; --on-accent:#FFFFFF;
  --ok:#1F6B3C; --ok-bg:#E4F2E9; --warn:#8A6A12; --warn-bg:#FBF3DC; --bad:#A3271F; --bad-bg:#FBEAE8; --info:#2E5C8A; --info-bg:#E8F0F9;
  --nuevo:#C9A84C; --reest:#7FA6CF;
  --font:Montserrat,"Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1524; --surface:#162036; --surface-2:#1A2640; --fg:#E4EAF3; --muted:#9AA9C0; --line:#2A3854; --cel-s:#1E2D4B;
    --accent:#9FBDE6; --on-accent:#0E1524; --ok:#7FCB9C; --ok-bg:#16301F; --warn:#E3C26A; --warn-bg:#33290F; --bad:#F0928A; --bad-bg:#3A1A18; --info:#9FBDE6; --info-bg:#1E2D4B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1524; --surface:#162036; --surface-2:#1A2640; --fg:#E4EAF3; --muted:#9AA9C0; --line:#2A3854; --cel-s:#1E2D4B;
  --accent:#9FBDE6; --on-accent:#0E1524; --ok:#7FCB9C; --ok-bg:#16301F; --warn:#E3C26A; --warn-bg:#33290F; --bad:#F0928A; --bad-bg:#3A1A18; --info:#9FBDE6; --info-bg:#1E2D4B; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--fg);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* barra superior */
.top{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
.top .in{display:flex;align-items:center;gap:18px;padding:10px 20px;flex-wrap:wrap}
.marca{display:flex;align-items:baseline;gap:10px}
.marca b{letter-spacing:.22em;font-size:17px}
.marca span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
.caras{display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.caras button{background:none;border:0;color:#C9D7EA;font-weight:600;font-size:13px;padding:7px 16px;border-radius:999px;cursor:pointer}
.caras button[aria-pressed=true]{background:#fff;color:var(--navy)}
.top .der{margin-left:auto;display:flex;align-items:center;gap:12px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:#C9D7EA;cursor:pointer;user-select:none}
.toggle input{width:16px;height:16px;accent-color:var(--gold)}

/* cuerpo */
.cuerpo{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 56px)}
.cuerpo.dev{grid-template-columns:250px minmax(0,1fr) 330px}
@media(max-width:1100px){.cuerpo.dev{grid-template-columns:220px minmax(0,1fr)} .cuerpo.dev aside.dev{grid-column:1/-1}}
@media(max-width:760px){.cuerpo,.cuerpo.dev{grid-template-columns:1fr}}
nav.menu{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:3px}
nav.menu .grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:14px 10px 6px}
nav.menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;font-size:13.5px;color:var(--fg)}
nav.menu button:hover{background:var(--surface-2)}
nav.menu button[aria-current=true]{background:var(--cel-s);color:var(--accent);font-weight:600}
nav.menu .num{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:0 0 auto;background:var(--nuevo);color:#1B2F5E}
nav.menu .num.r{background:var(--reest)}
nav.menu .num.x{background:var(--line);color:var(--muted)}
nav.menu .tag{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
main{padding:22px 26px 60px;min-width:0}
aside.dev{background:var(--surface);border-left:1px solid var(--line);padding:18px 18px 40px;min-width:0}

.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1.t{font-size:24px;font-weight:700;color:var(--accent);letter-spacing:-.01em}
h2.t{font-size:17px;font-weight:700;color:var(--accent)}
.hint{color:var(--muted);font-size:13.5px;margin:4px 0 0}
.lead{font-size:15px;max-width:72ch;margin:6px 0 0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:8px;cursor:pointer;text-decoration:none}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1B2F5E}
.btn.sm{font-size:12.5px;padding:5px 10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
input[type=text],select,textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:7px;background:var(--surface);color:var(--fg)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)} .c-bad{background:var(--bad-bg);color:var(--bad)} .c-info{background:var(--info-bg);color:var(--info)} .c-mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.box{border-radius:8px;padding:11px 14px;font-size:13.5px}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)} .b-bad{background:var(--bad-bg);color:var(--bad)} .b-info{background:var(--info-bg);color:var(--info)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{font-size:12px;color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;letter-spacing:.04em}
.legend{font-size:12px;color:var(--muted);margin:6px 0 0}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* estados como flujo */
.flujo{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flujo span{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.flujo span.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.flujo i{font-style:normal;color:var(--muted);font-size:11px}
.dev h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.dev h3:first-of-type{margin-top:6px}
.dev ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13px}
.dev .blk{border-left:3px solid var(--bad);padding:6px 10px;background:var(--bad-bg);color:var(--bad);border-radius:0 6px 6px 0;font-size:12.5px;margin-top:6px}

/* mapa del sistema (inicio) */
.sistema{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.sistema{grid-template-columns:1fr}}
.cara{border-radius:12px;padding:14px;border:1px solid var(--line);background:var(--surface)}
.cara > .eyebrow{display:block;margin-bottom:10px}
.prod{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.prod:hover{border-color:var(--accent)}
.prod b{display:block;font-size:13.5px}
.prod span.d{font-size:12px;color:var(--muted)}
.prod .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:0 0 auto;background:var(--nuevo);color:#1B2F5E}
.prod .n.r{background:var(--reest)}
.prod .n.x{background:var(--line);color:var(--muted)}
.ext{display:flex;gap:8px;flex-wrap:wrap}
.ext span{font-size:12px;font-weight:600;border:1px dashed var(--muted);border-radius:7px;padding:5px 10px;color:var(--muted)}
.vinc{counter-reset:v;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.vinc li{counter-increment:v;display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:13.5px;align-items:start}
.vinc li::before{content:counter(v);width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}

/* turnero */
.semanas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dia{border:1px solid var(--line);border-radius:9px;padding:9px;background:var(--surface)}
.dia.off{opacity:.45}
.dia .dt{font-weight:700;font-size:12.5px;margin-bottom:6px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.slots button{font-size:11.5px;padding:5px 0;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer}
.slots button:disabled{text-decoration:line-through;opacity:.4;cursor:not-allowed}
.slots button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}

/* mapa de cobertura */
.mapa{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(260px,1fr);gap:16px;align-items:start}
@media(max-width:900px){.mapa{grid-template-columns:1fr}}
.mapa svg{width:100%;height:auto;max-height:78vh;display:block}
.mapa path{stroke:var(--surface);stroke-width:1.2;cursor:pointer;transition:opacity .15s}
.mapa path:hover{opacity:.8}
.mapa path.sel{stroke:var(--fg);stroke-width:2.4}
.esc{display:flex;flex-direction:column;gap:5px}
.esc button{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px;cursor:pointer;font-size:12.5px;text-align:left}
.esc button[aria-pressed=true]{border-color:var(--fg);font-weight:700}
.esc i{width:18px;height:14px;border-radius:3px;flex:0 0 auto;border:1px solid rgba(0,0,0,.12)}

/* verificador */
.verif{max-width:620px}
.resultado{border-radius:12px;padding:16px 18px;border:2px solid}
.resultado.ok{border-color:var(--ok);background:var(--ok-bg)}
.resultado.anu{border-color:var(--warn);background:var(--warn-bg)}
.resultado.no{border-color:var(--bad);background:var(--bad-bg)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;margin-top:10px}
.kv .l{font-size:11.5px;color:var(--muted)} .kv .v{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}

.costline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.costline .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px}
.total .v{font-size:26px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:70px;z-index:70;background:var(--navy-d);color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;font-weight:600;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="marca"><b>SIIGENO</b><span>Productos nuevos · demo para desarrollo</span></div>
  <div class="caras" role="group" aria-label="Cara de SIIGENO">
    <button type="button" data-cara="mapa">Cómo se vincula</button>
    <button type="button" data-cara="req">SIIGENO Requirentes</button>
    <button type="button" data-cara="int">SIIGENO interno</button>
  </div>
  <div class="der"><label class="toggle"><input type="checkbox" id="devToggle" checked> Para desarrollo</label></div>
</div></header>
<div class="cuerpo dev" id="cuerpo">
  <nav class="menu" id="menu" aria-label="Módulos"></nav>
  <main id="main"></main>
  <aside class="dev" id="dev" aria-label="Para desarrollo"></aside>
</div>

/* ---------- 4 · Verificador ---------- */
function verificar(cod){
  const c=cod.trim().toUpperCase(); if(!c) return null;
  const r=S.registro.find(x=>x.codigo===c);
  if(r) return {tipo:r.estado==="anulado"?"anu":"ok", r};
  const conO=c.replace(/0/g,"O"), con0=c.replace(/O/g,"0");
  const casi=S.registro.find(x=>x.codigo===conO||x.codigo===con0);
  return {tipo:"no", casi};
}

  const e=S.escSel!=null?ESCRITURAS[S.escSel]:null, c=S.costo;
  let lineas=[], total=0;
  if(e){ lineas.push(["Derecho fijo","",TABLA.fijo]); if(c.foja) lineas.push(["Por foja",`${e.fojas} fojas × ${pesos(TABLA.foja)}`,e.fojas*TABLA.foja]);
    lineas.push(["Por firma",`${c.firmas} × ${pesos(TABLA.firma)}`,c.firmas*TABLA.firma]); lineas.push(["Por año de búsqueda",`${c.anios} × ${pesos(TABLA.anio)}`,c.anios*TABLA.anio]);
    let base=lineas.reduce((a,l)=>a+l[2],0); if(c.ej>1){ lineas.push(["Ejemplares adicionales",`${c.ej-1} al 50 %`,base*0.5*(c.ej-1)]); }
    let sub=lineas.reduce((a,l)=>a+l[2],0); if(c.urgencia){ lineas.push(["Recargo por urgencia","50 %",sub*0.5]); }
    total=lineas.reduce((a,l)=>a+l[2],0); if(c.exencion){ lineas.push(["Exención: "+c.exencion,"sin la exención habría salido "+pesos(total),-total]); total=0; } }
  const main=`${cab("buscador","Superbuscador y simulador de costos","Herramienta local y hermética: busca en el protocolo digitalizado por número de cuenta, nomenclatura catastral u otros datos, y calcula el costo aproximado.","SIIGENO interno")}
    <div class="g2" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)"><div class="stack">
      <div class="card"><label class="f" for="bq">Buscar escritura</label><input type="text" id="bq" value="${esc(S.busq)}" placeholder="Cuenta, nomenclatura, matrícula, número, partes…" autocomplete="off">
        <p class="legend">Probá: 1101-2345678 · 13-04-21 · LEDESMA · 1.204.558</p></div>
      <div class="tablewrap"><table><thead><tr><th>Escritura</th><th>Acto y partes</th><th>Cuenta / nomenclatura</th></tr></thead><tbody id="res">
        ${res.map(x=>{ const i=ESCRITURAS.indexOf(x); return `<tr style="cursor:pointer;${S.escSel===i?"background:var(--cel-s)":""}" data-esc="${i}"><td class="num"><b>N.º ${x.n} · ${x.sec} · ${x.anio}</b><div class="sub">${x.fecha} · ${x.fojas} fojas</div></td><td>${esc(x.acto)}<div class="sub">${esc(x.partes)}</div></td><td class="mono" style="font-size:12px">${esc(x.cuenta)}<div class="sub">${esc(x.nom)}</div></td></tr>`; }).join("")||`<tr><td colspan="3" class="sub">Sin resultados.</td></tr>`}
      </tbody></table></div></div>
    <div class="card stack"><div class="eyebrow">Simulador de costos</div>
      ${!e?`<p class="sub" style="margin:0">Elegí una escritura de la lista: la cantidad de fojas sale del protocolo.</p>`:`
      <div><b>N.º ${e.n} · ${e.sec} · ${e.anio}</b> — ${esc(e.acto)}<div class="sub">Matrícula ${e.matricula} · ${esc(e.loc)}</div></div>
      <div class="g2"><div><label class="f" for="cEj">Ejemplares</label><select id="cEj">${[1,2,3,4].map(n=>`<option ${c.ej===n?"selected":""}>${n}</option>`).join("")}</select></div>
        <div><label class="f" for="cAn">Años de búsqueda</label><select id="cAn">${[0,1,2,3,5,10].map(n=>`<option ${c.anios===n?"selected":""}>${n}</option>`).join("")}</select></div>
        <div><label class="f" for="cFi">Firmas</label><select id="cFi">${[0,1,2,3].map(n=>`<option ${c.firmas===n?"selected":""}>${n}</option>`).join("")}</select></div>
        <div><label class="f" for="cEx">Exención</label><select id="cEx"><option value="">Ninguna</option>${["Organismo público","Judicial","Beneficiario Ley 9811"].map(x=>`<option ${c.exencion===x?"selected":""}>${x}</option>`).join("")}</select></div></div>
      <label class="row" style="gap:7px;cursor:pointer"><input type="checkbox" id="cUr" ${c.urgencia?"checked":""}> Urgente</label>
      <div>${lineas.map(l=>`<div class="costline"><span>${esc(l[0])}${l[1]?`<div class="sub">${esc(l[1])}</div>`:""}</span><span class="v">${l[2]<0?"− "+pesos(-l[2]):pesos(l[2])}</span></div>`).join("")}
        <div class="total"><span class="eyebrow">Total aproximado</span><span class="v">${pesos(total)}</span></div></div>
      <div class="box b-warn">Valores <b>de ejemplo</b>. Faltan los vigentes de la Ley Impositiva 11.090 y el valor actual de la Unidad Tributaria.</div>`}</div></div>`;
  return {main, dev:devPanel({
    reglas:["Derecho fijo, por foja, por firma, por año de búsqueda.","Ejemplares adicionales al 50 %; recargo por urgencia.","Exenciones con fundamento (organismo público, judicial, Ley 9811) van a cero mostrando cuánto habría salido."],
    depende:["Protocolo digitalizado (miles de escrituras) y el relevamiento de datos.","El armador (producto 5) usa la misma cotización antes de enviar."],
    abierto:["¿Es interno o del requirente? ¿Sobre qué base busca?","¿El simulador vive en el armador, en el superbuscador o en los dos?","Valores vigentes de la Ley 11.090 y de la UT."]
  }), after(){
    const bq=$("#bq"); bq.oninput=()=>{ S.busq=bq.value; const pos=bq.selectionStart; render(); const n=$("#bq"); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} };
    document.querySelectorAll("[data-esc]").forEach(r=>r.onclick=()=>{ S.escSel=+r.dataset.esc; render(); });
    const on=(id,k,f)=>{ const el=$(id); if(el) el.onchange=()=>{ c[k]=f(el); render(); }; };
    on("#cEj","ej",el=>+el.value); on("#cAn","anios",el=>+el.value); on("#cFi","firmas",el=>+el.value); on("#cEx","exencion",el=>el.value); on("#cUr","urgencia",el=>el.checked);
  }};
};
