<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIIGENO · el nuevo portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* El nuevo SIIGENO: el portal externo de hoy (cabecera blanca, menú lateral azul, cuadros) con los productos
   nuevos puestos donde entran, y la gestión interna con la misma cáscara. Un archivo, sin librerías. */
:root{
  --navy:#1B2F5E; --navy-d:#0F1C3A; --azul:#1F6FB2; --naranja:#E8722A; --gold:#C9A84C; --cel:#A8C8E8; --cel-s:#E8F0F9;
  --bg:#EEF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB; --fg:#1E2634; --muted:#5F6E85; --line:#D8E0EA;
  --accent:#1B2F5E; --on-accent:#FFFFFF;
  --ok:#1F6B3C; --ok-bg:#E4F2E9; --warn:#8A6A12; --warn-bg:#FBF3DC; --bad:#A3271F; --bad-bg:#FBEAE8; --info:#2E5C8A; --info-bg:#E8F0F9;
  --nuevo:#C9A84C; --reest:#7FA6CF;
  --font:Montserrat,"Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0E1524; --surface:#162036; --surface-2:#1A2640; --fg:#E4EAF3; --muted:#9AA9C0; --line:#2A3854; --cel-s:#1E2D4B; --accent:#9FBDE6; --on-accent:#0E1524; --ok:#7FCB9C; --ok-bg:#16301F; --warn:#E3C26A; --warn-bg:#33290F; --bad:#F0928A; --bad-bg:#3A1A18; --info:#9FBDE6; --info-bg:#1E2D4B; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0E1524; --surface:#162036; --surface-2:#1A2640; --fg:#E4EAF3; --muted:#9AA9C0; --line:#2A3854; --cel-s:#1E2D4B; --accent:#9FBDE6; --on-accent:#0E1524; --ok:#7FCB9C; --ok-bg:#16301F; --warn:#E3C26A; --warn-bg:#33290F; --bad:#F0928A; --bad-bg:#3A1A18; --info:#9FBDE6; --info-bg:#1E2D4B; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--fg);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--naranja);outline-offset:2px}

/* cabecera blanca como SIIGENO Requirente */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.top .in{display:flex;align-items:center;gap:14px;padding:8px 18px;flex-wrap:wrap}
.logo{display:flex;flex-direction:column;line-height:1;margin-right:8px}
.logo b{font-size:26px;letter-spacing:.04em;color:var(--navy);font-weight:700}
.logo b i{font-style:normal;color:var(--naranja)}
.logo span{font-size:10px;letter-spacing:.22em;color:var(--azul);font-weight:600;align-self:flex-end;margin-top:-2px}
.quien{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.quien select{background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;font-weight:600;font-size:13px;min-width:250px}
.top .der{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.user{display:flex;align-items:center;gap:9px;font-size:12.5px;line-height:1.2}
.user b{display:block;font-size:13px}
.user .av{width:34px;height:34px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-weight:700}
.tbtn{background:var(--surface);border:1.5px solid var(--line);color:var(--fg);font-weight:600;font-size:12.5px;padding:6px 12px;border-radius:8px;cursor:pointer}
.tbtn[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}

/* cuerpo: menú lateral azul angosto + contenido */
.cuerpo{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 52px)}
nav.menu{background:var(--navy);color:#C9D7EA;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
nav.menu .grp{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8FA6C8;font-weight:700;padding:14px 10px 6px}
nav.menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:13px;color:#DCE6F3}
nav.menu button:hover:not(:disabled){background:rgba(255,255,255,.08)}
nav.menu button[aria-current=true]{background:#fff;color:var(--navy);font-weight:600}
nav.menu .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:transparent}
nav.menu .dot.n{background:var(--nuevo)} nav.menu .dot.r{background:var(--reest)}
nav.menu .leg{padding:16px 10px 0;font-size:11px;color:#8FA6C8;display:flex;flex-direction:column;gap:4px}
nav.menu .leg span{display:flex;align-items:center;gap:7px}
nav.menu .leg i{display:inline-block;width:8px;height:8px;border-radius:50%}
main{padding:20px 26px 70px;min-width:0}
/* pantalla angosta (celular): el menú pasa a ser una tira horizontal arriba del contenido. Va después de las reglas del menú para ganarles. */
@media(max-width:760px){.cuerpo{grid-template-columns:1fr} nav.menu{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:4px;padding:8px 10px;-webkit-overflow-scrolling:touch} nav.menu .grp,nav.menu .leg{display:none} nav.menu button{white-space:nowrap;width:auto;flex:0 0 auto;padding:7px 10px;font-size:12.5px} main{padding:14px 16px 60px} .quien select{min-width:0;max-width:62vw} .top .in{gap:8px;padding:8px 12px}}

.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1.t{font-size:22px;font-weight:600;color:var(--navy)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) h1.t,:root:not([data-theme="light"]) h2.t{color:var(--fg)} }
:root[data-theme="dark"] h1.t,:root[data-theme="dark"] h2.t{color:var(--fg)}
h2.t{font-size:16px;font-weight:700;color:var(--navy)}
.hint{color:var(--muted);font-size:13px}
.lead{font-size:14.5px;max-width:76ch;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 17px;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:8px;cursor:pointer;text-decoration:none}
.btn:hover:not(:disabled){border-color:var(--azul)}
.btn.pri{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{font-size:12.5px;padding:5px 10px}
.btn.lg{font-size:15px;padding:12px 22px}
.btn.peligro{color:var(--bad);border-color:var(--bad-bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.acciones{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;flex-wrap:wrap}
label.f{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
input[type=text],input[type=number],select,textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:7px;background:var(--surface);color:var(--fg)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azul)}
input:read-only{background:var(--surface-2)}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)} .c-bad{background:var(--bad-bg);color:var(--bad)} .c-info{background:var(--info-bg);color:var(--info)} .c-mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)} .c-gold{background:var(--gold);color:#1B2F5E}
.box{border-radius:8px;padding:11px 14px;font-size:13.5px}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)} .b-bad{background:var(--bad-bg);color:var(--bad)} .b-info{background:var(--info-bg);color:var(--info)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#fff;font-weight:700;padding:10px 12px;background:var(--navy);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{font-size:12px;color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;letter-spacing:.04em}
.legend{font-size:12px;color:var(--muted)}
.link{background:none;border:0;padding:0;color:var(--azul);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpis.dos{grid-template-columns:1fr 1fr}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.kpi b{display:block;font-size:22px;color:var(--navy);line-height:1.2}
.kpi b.w{color:var(--warn)} .kpi b.g{color:var(--ok)} .kpi b.b{color:var(--bad)} .kpi b.x{color:var(--gris)}
/* la bandeja de Pedidos: tres tonos de fila (acaba de llegar · en trámite · espera al requirente) y terminados plegados */
:root{--gris:#8A95A8;--gris-bg:#F1F3F6;--fin-bg:#F7F8FA}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--gris:#7F8CA3;--gris-bg:#131B2D;--fin-bg:#111929} }
:root[data-theme="dark"]{--gris:#7F8CA3;--gris-bg:#131B2D;--fin-bg:#111929}
tr.ped{cursor:pointer} tr.ped:hover td{background:var(--cel-s)}
tr.ped.nuevo td{background:var(--warn-bg)} tr.ped.nuevo td:first-child{box-shadow:inset 4px 0 0 var(--gold)} tr.ped.nuevo td b{color:var(--navy)}
tr.ped.ciu td{background:var(--gris-bg);color:var(--gris)} tr.ped.ciu td b{color:var(--gris);font-weight:600} tr.ped.ciu .sub{color:var(--gris);opacity:.8} tr.ped.ciu .chip{background:var(--surface-2);color:var(--gris);border:1px solid var(--line)}
tr.ped.fin td{background:var(--fin-bg);color:var(--gris)} tr.ped.fin td b{color:var(--gris);font-weight:600} tr.ped.fin .sub{color:var(--gris);opacity:.8} tr.ped.fin .chip{background:var(--surface-2);color:var(--gris);border:1px solid var(--line)}
tr.ped.nuevo:hover td,tr.ped.ciu:hover td,tr.ped.fin:hover td{filter:brightness(.97)}
tr.plegado td{background:var(--surface-2);color:var(--gris);font-size:12.5px;padding:9px 12px}
tr.archs td{background:var(--surface-2);padding:8px 12px 12px 28px;border-bottom:1px solid var(--line)}
th[data-orden]{cursor:pointer;user-select:none} th .s{opacity:.45;font-size:9px;margin-left:4px} th.on{box-shadow:inset 0 -3px 0 var(--naranja)} th.on .s{opacity:1}
.tonos{display:flex;gap:14px;font-size:11.5px;color:var(--muted);align-items:center;flex-wrap:wrap} .tonos i{display:inline-block;width:13px;height:13px;border-radius:3px;border:1px solid var(--line);vertical-align:-2px;margin-right:5px}
/* visor de archivos */
.visor{background:var(--bg);padding:14px;border-radius:8px;display:grid;place-items:center} .visor .pag{background:#fff;color:#1E2634;width:100%;max-width:520px;min-height:300px;padding:22px 26px;box-shadow:0 6px 20px rgba(0,0,0,.18)} .visor .lin{height:9px;border-radius:4px;background:#E3E8EF;margin:9px 0}
.kpi span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--navy);border-bottom-color:var(--naranja)}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.filtros button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.filtros button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.etiq{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px}
.etiq.n{background:var(--nuevo);color:#1B2F5E} .etiq.r{background:var(--reest);color:#0F1C3A} .etiq.x{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* inicio del portal: título y cuadros como SIIGENO */
.bienvenida{text-align:center;padding:26px 10px 6px}
.bienvenida h1{font-size:24px;font-weight:500;color:var(--navy);line-height:1.3}
.bienvenida h1 i{font-style:normal;color:var(--naranja);font-weight:600}
.bienvenida .sub{margin-top:6px}
.cuadros{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px;margin-top:22px}
.cuadro{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:150px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;box-shadow:0 2px 6px rgba(27,47,94,.08)}
.cuadro:hover:not(:disabled){border-color:var(--azul);box-shadow:0 4px 14px rgba(27,47,94,.16)}
.cuadro:disabled{cursor:default;opacity:.6}
.cuadro b{font-size:15px;font-weight:600;color:var(--navy);line-height:1.3}
.cuadro .ic{align-self:flex-end;font-size:30px;color:var(--navy);line-height:1}
.cuadro .et{display:block;margin-bottom:8px}
.cuadro .d{font-size:11.5px;color:var(--muted);margin-top:4px}
.ahora{display:flex;gap:10px;align-items:flex-start;background:var(--cel-s);border:1px solid var(--cel);border-radius:10px;padding:10px 14px;margin-top:18px;font-size:13px}

/* tarjetas de Nuevos Trámites como SIIGENO */
.tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tarj{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 16px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:150px;justify-content:space-between;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.tarj .info{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--surface);color:var(--muted);cursor:pointer}
.tarj .ex{position:absolute;top:10px;left:10px}
.tarj h3{font-size:14px;font-weight:600;color:var(--azul);letter-spacing:.02em;text-transform:uppercase;margin-top:8px}
.tarj .ir{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--azul);color:var(--azul);background:var(--surface);border-radius:999px;padding:7px 18px;font-weight:600;cursor:pointer}
.tarj .ir:hover{background:var(--azul);color:#fff}
.tarj.n{border-top:4px solid var(--nuevo)}
.pasos{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.pasos div{flex:1;padding:9px 12px;font-size:12px;border-right:1px solid var(--line);color:var(--muted)}
.pasos div:last-child{border-right:0}
.pasos div b{display:block;font-size:12.5px;color:var(--fg)}
.pasos div.on{background:var(--cel-s)} .pasos div.on b{color:var(--azul)}
.pasos div.ok{color:var(--ok)} .pasos div.ok b{color:var(--ok)}
.pasos div[data-paso]{cursor:pointer} .pasos div[data-paso]:hover b{text-decoration:underline} .pasos div[data-paso]:focus-visible{outline:2px solid var(--azul);outline-offset:-2px}
/* Jerarquía por color en los asistentes por pasos (armador y habilitación de organismo).
   Significados fijos:
     navy (--arm-paso / --accent) = estructura: el paso en el que estás y la pregunta de ese paso
     naranja                      = la marca de "acá": base del paso actual y barra del título
     azul (--arm-sel)             = lo que elegiste y el botón para seguir
     verde (--ok)                 = lo que ya está hecho
     ámbar (--warn)               = lo que falta hacer
   Las notas informativas pasan a gris neutro para no competir con el azul de "elegido". */
:root{ --arm-paso-bg:#1B2F5E; --arm-paso-fg:#FFFFFF; --arm-paso-sub:#C9D7EA; --arm-sel:#1F6FB2; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --arm-paso-bg:#24477A; --arm-paso-fg:#FFFFFF; --arm-paso-sub:#D6E2F2; --arm-sel:#7FB2EE; } }
:root[data-theme="dark"]{ --arm-paso-bg:#24477A; --arm-paso-fg:#FFFFFF; --arm-paso-sub:#D6E2F2; --arm-sel:#7FB2EE; }

/* ---- 1. Dónde estoy: el indicador de pasos ---- */
.pasos div{color:var(--muted)}
.pasos div b{color:var(--muted);font-weight:600}
.pasos div.on{background:var(--arm-paso-bg);color:var(--arm-paso-sub);box-shadow:inset 0 -3px 0 var(--naranja)}
.pasos div.on b{color:var(--arm-paso-fg);font-weight:700}
.pasos div.ok{background:var(--ok-bg);color:var(--ok);font-weight:700}
.pasos div.ok b{color:var(--ok);font-weight:700}

/* ---- 2. La pregunta de este paso: más grande, en navy, con la barra naranja pegada al borde de la tarjeta
        (el margen negativo compensa el relleno: el texto queda exactamente donde estaba) ---- */
.pasos + .card.stack > div:first-child{border-left:4px solid var(--naranja);margin-left:-17px;padding-left:13px}
.pasos + .card.stack > div:first-child > b{font-size:16px;color:var(--accent)}

/* ---- 3. Lo que elegí: borde izquierdo grueso azul (el relleno compensa el borde: el texto no se corre) ---- */
.pasos + .card.stack .opc[aria-pressed=true]{border-color:var(--arm-sel);border-left-width:5px;padding-left:9.5px;background:var(--cel-s)}
.pasos + .card.stack .opc[aria-pressed=true] b{color:var(--arm-sel)}
.pasos + .card.stack .opc[aria-pressed=true] .d{color:var(--fg)}

/* ---- 4. Lo que falta (ámbar) y lo que ya está (verde) ---- */
.pasos + .card.stack .docs .doc:not(.ok){border-color:var(--warn);background:var(--warn-bg)}
.pasos + .card.stack .doc.ok{color:var(--ok);font-weight:600}
.pasos + .card.stack .doc.ok .btn{background:transparent;border-color:transparent;color:var(--ok)}
.pasos + .card.stack .docs .doc:not(.ok) .btn{color:var(--arm-sel);border-color:var(--arm-sel);background:var(--surface);font-weight:700}
.pasos + .card.stack label.row:has(> input[type=checkbox]){padding:7px 10px;margin:-7px -10px;border-radius:7px;background:var(--warn-bg)}
.pasos + .card.stack label.row:has(> input[type=checkbox]:checked){background:var(--ok-bg)}
.pasos + .card.stack label.row > input[type=checkbox]{accent-color:var(--azul)}

/* ---- 5. Notas informativas: neutras ---- */
.pasos + .card.stack .box.b-info{background:var(--surface-2);color:var(--fg);box-shadow:inset 3px 0 0 var(--muted);border-radius:2px 8px 8px 2px}
.pasos + .card.stack .card .box.b-info{background:var(--surface)}

/* ---- 6. El total ---- */
.pasos + .card.stack .total .v{color:var(--accent)}

/* ---- 7. El botón para seguir: azul con sombra; deshabilitado, gris lleno (se lee como el botón de seguir, apagado) ---- */
.pasos + .card.stack .acciones .btn.pri{font-weight:700;box-shadow:0 2px 8px rgba(31,111,178,.35)}
.pasos + .card.stack .acciones .btn.pri:disabled{background:var(--line);border-color:var(--line);color:var(--muted);box-shadow:none;opacity:1}
.opc{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:11px 13px;cursor:pointer}
.opc:hover:not(:disabled){border-color:var(--azul)}
.opc[aria-pressed=true]{border-color:var(--azul);background:var(--cel-s)}
.opc:disabled{opacity:.5;cursor:not-allowed}
.opc b{display:block;font-size:13.5px} .opc .d{display:block;font-size:12px;color:var(--muted)}
.docs{display:flex;flex-direction:column;gap:8px}
.doc{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
.doc.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.tarjeta{border:1.5px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px;min-height:100%}
.tarjeta.toca{border-color:var(--azul)}
.hoja{border:1px solid var(--line);border-radius:6px;padding:16px 18px;background:var(--surface);font-family:Cambria,Georgia,serif;font-size:13px;line-height:1.7;max-width:64ch}
.hoja .qr{display:inline-block;width:46px;height:46px;background:repeating-linear-gradient(90deg,#1E2634 0 3px,transparent 3px 6px),repeating-linear-gradient(0deg,#1E2634 0 3px,transparent 3px 6px);opacity:.85;vertical-align:middle;margin-right:10px}
.modal{position:fixed;inset:0;background:rgba(15,28,58,.45);display:grid;place-items:center;z-index:60;padding:16px}
.modal .caja{background:var(--surface);border-radius:12px;max-width:860px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .cab{background:var(--azul);color:#fff;padding:12px 18px;font-weight:600;border-radius:12px 12px 0 0}
.modal .cu{padding:18px}

/* flujo de estados */
.flujo{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flujo span{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.flujo span.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.flujo i{font-style:normal;color:var(--muted);font-size:11px}

/* turnero DDJJ */
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cal .h{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center}
.cal button{border:1.5px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 4px;text-align:center;cursor:pointer;min-height:52px}
.cal button:disabled{opacity:.4;cursor:default;background:var(--surface-2)}
.cal button b{display:block;font-size:14px}
.cal button small{font-size:10.5px;color:var(--muted)}
.cal button.pocos{border-color:var(--gold);background:var(--warn-bg)}
.cal button[aria-pressed=true]{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy) inset}
.horas{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.horas button{border:1.5px solid var(--line);border-radius:7px;background:var(--surface);padding:8px 0;font-weight:600;cursor:pointer}
.horas button:disabled{opacity:.4;cursor:default;background:var(--surface-2);font-weight:400}
.horas button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.cita{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:10px 12px;background:var(--surface)}
.cita.ok{border-left-color:var(--ok);background:var(--ok-bg)} .cita.no{border-left-color:var(--bad);background:var(--bad-bg)} .cita.pasa{border-left-color:var(--gold)} .cita.esp{border-left-color:var(--cel)}
.cita .h{font-weight:700;color:var(--navy)}
/* agenda interna: la semana con horarios */
.semana-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.semana{display:grid;grid-template-columns:58px repeat(5,minmax(130px,1fr));min-width:720px}
.semana .hd{background:var(--navy);color:#fff;padding:8px 6px;font-size:12px;font-weight:700;text-align:center;letter-spacing:.02em}
.semana .hd small{display:block;font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.semana .hd.hoy{background:var(--azul)}
button.hd{border:0;font-family:inherit;cursor:pointer} button.hd:hover:not(:disabled){background:var(--azul)} button.hd:disabled{cursor:default;opacity:.85}
.semana .hr{font-size:11.5px;color:var(--muted);padding:6px 8px 0 0;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.semana .cel{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:3px;min-height:38px;display:flex;flex-direction:column;gap:3px}
.semana .cel.hoy{background:var(--cel-s)}
.semana .cel.fer{background:repeating-linear-gradient(45deg,var(--surface-2) 0 6px,transparent 6px 12px)}
.turno-b{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:4px solid #8A95A8;border-radius:6px;background:var(--surface);padding:3px 6px;line-height:1.25;cursor:pointer;color:var(--fg);font-family:inherit}
.turno-b:hover{border-color:var(--azul)}
.turno-b b{display:block;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turno-b small{font-size:10.5px;color:var(--muted)}
.turno-b.ddjj{border-left-color:var(--azul)} .turno-b.firma{border-left-color:var(--gold)} .turno-b.retiro{border-left-color:#8A95A8} .turno-b.estudio{border-left-color:#7FA6CF}
.turno-b.ok{background:var(--ok-bg)} .turno-b.ok small{color:var(--ok)}
.turno-b.novino{background:var(--bad-bg)} .turno-b.novino small{color:var(--bad)}
.turno-b.anulada{opacity:.6} .turno-b.anulada b{text-decoration:line-through}
.barra{height:8px;border-radius:999px;background:var(--line);overflow:hidden} .barra i{display:block;height:100%;background:var(--ok)}

/* mapa */
.mapa{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(280px,1fr);gap:16px;align-items:start}
@media(max-width:900px){.mapa{grid-template-columns:1fr}}
.mapa svg{width:100%;height:auto;max-height:74vh;display:block}
.mapa path{stroke:var(--surface);stroke-width:1.2;cursor:pointer;transition:opacity .15s}
.mapa path:hover{opacity:.8}
.mapa path.sel{stroke:var(--fg);stroke-width:2.4}
.mapa circle{cursor:pointer;transition:r .15s}
.mapa circle:hover{r:4}
.mapa circle.sel{r:4.6;stroke:#1E2634;stroke-width:1.4}
.leyenda{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;margin-top:8px}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:16px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.12)}

/* verificador */
.verif{max-width:660px}
.resultado{border-radius:12px;padding:16px 18px;border:2px solid}
.resultado.ok{border-color:var(--ok);background:var(--ok-bg)}
.resultado.anu{border-color:var(--warn);background:var(--warn-bg)}
.resultado.no{border-color:var(--bad);background:var(--bad-bg)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;margin-top:10px}
.kv .l{font-size:11.5px;color:var(--muted)} .kv .v{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.costline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.costline .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px}
.total .v{font-size:26px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:62px;z-index:70;background:var(--navy-d);color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;font-weight:600;max-width:calc(100% - 32px)}
.resp td input,.resp td select,.resp td textarea{padding:6px 8px;font-size:13px}
.resp td{vertical-align:top}
@media print{.top,nav.menu{display:none} .cuerpo{display:block} main{padding:0}}

function cotizarSim(){ const c=S.costo, t=TJ[c.tramite]; const L=[]; if(t.tipo==="estudio"){ L.push(["Sin tasa para escribanos en ejercicio","",0]); return {L,total:0}; } if(t.exento){ L.push(["Exento: organismo público","",0]); return {L,total:0}; }
  L.push(["Derecho fijo del trámite",`${t.fijo} unidades tributarias`,t.fijo*UT]); if(t.foja) L.push(["Por foja",`${c.fojas} fojas × ${t.foja} UT`,c.fojas*t.foja*UT]);
  let sub=L.reduce((a,l)=>a+l[2],0); if(c.ej>1) L.push(["Ejemplares adicionales",`${c.ej-1} al 50 %`,sub*0.5*(c.ej-1)]); if(t.soporte==="digital") L.push(["Emisión digital","Se descarga del portal",0]);
  let total=L.reduce((a,l)=>a+l[2],0); if(c.quien!=="particular"){ L.push([QUIEN[c.quien],"Sin la exención habría salido "+pesos(total),-total]); total=0; } return {L,total}; }

function verificar(cod){ const c=cod.trim().toUpperCase().replace(/\s/g,""); if(!c) return null;
  const todos=[...S.registro.map(r=>({...r,tipo:"Certificación de copia",asiento:"Registro de certificaciones de copia"})),...S.testimonios.map(t=>({...t,org:"Escribanía General de Gobierno",asiento:"Protocolo · Sección A",estado:"valido",tipo:"Testimonio"})),...S.constancias.map(k=>({n:k.n,fecha:k.firmado,tipo:"Constancia de declaración jurada",doc:`Constancia de cumplimiento · período ${k.periodo}`,org:"Obligada Ley 8198",para:"Repartición / organismo de control",escribana:"FELICIOTTI, E. M.",codigo:k.codigo,asiento:"Protocolo B · escritura",estado:"valido"}))];
  const r=todos.find(x=>x.codigo===c); if(r) return {tipo:r.estado==="anulado"?"anu":"ok", r}; const casi=todos.find(x=>x.codigo===c.replace(/0/g,"O")||x.codigo===c.replace(/O/g,"0")); return {tipo:"no", casi}; }
const kvReg=r=>`<div class="kv"><div><div class="l">Tipo</div><div class="v">${esc(r.tipo)}</div></div><div><div class="l">Número</div><div class="v mono">${esc(r.n)}</div></div><div><div class="l">Fecha</div><div class="v">${esc(r.fecha)}</div></div><div><div class="l">Escribana</div><div class="v">${esc(r.escribana)}</div></div><div><div class="l">Organismo / comparece</div><div class="v">${esc(r.org||r.comp||"")}</div></div><div><div class="l">Se expidió para</div><div class="v">${esc(r.para||"")}</div></div><div><div class="l">Asiento</div><div class="v">${esc(r.asiento)}</div></div></div>`;
VISTAS.verif=()=>{ const R=S.verRes;
  const main=`${cab("r","Validar documento","Ya existe; se reordena. ¿Te presentaron una certificación o un testimonio de la Escribanía? Ingresá el código que figura al pie, junto al QR, y el sistema muestra lo que la Escribanía registró al emitirlo.","SIIGENO Requirente")}
    <div class="verif stack"><div class="card stack"><div><label class="f" for="cod">Código de verificación</label><div class="row" style="flex-wrap:nowrap"><input type="text" id="cod" class="mono" value="${esc(S.verCodigo)}" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off"><button class="btn pri" type="button" id="verBtn">Verificar</button></div></div>
      <div class="row sub">Para probar: <button class="link" type="button" data-prueba="${S.registro.find(r=>r.estado==="valido").codigo}">Certificación válida</button> · <button class="link" type="button" data-prueba="${S.testimonios[0].codigo}">Testimonio válido</button> · <button class="link" type="button" data-prueba="${S.registro.find(r=>r.estado==="anulado").codigo}">Documento anulado</button> · <button class="link" type="button" data-prueba="EGG7-0000-0000-0000">Código inexistente</button></div></div>
    ${!R?"":R.tipo==="ok"?`<div class="resultado ok"><span class="chip c-ok">Válido</span><h2 class="t" style="margin-top:6px">${esc(R.r.doc)}</h2>${kvReg(R.r)}</div>`:R.tipo==="anu"?`<div class="resultado anu"><span class="chip c-warn">Anulado</span><h2 class="t" style="margin-top:6px">${esc(R.r.doc)}</h2><p style="margin-top:6px"><b>Motivo:</b> ${esc(R.r.motivo)}. Lo reemplazó la certificación <b>${esc(R.r.reemplazo)}</b>.</p>${kvReg(R.r)}</div>`:`<div class="resultado no"><span class="chip c-bad">Inexistente</span><p style="margin-top:6px">No hay ningún documento emitido con ese código.${R.casi?` ¿Quisiste decir <button class="link" type="button" data-prueba="${R.casi.codigo}">${R.casi.codigo}</button>? Es común confundir el cero con la letra O.`:" Revisá que no hayas confundido el cero con la letra O."}</p></div>`}
    <div class="card"><b>Así se ve el código en el documento</b><div class="sub" style="margin-bottom:8px">Todo documento emitido desde SIIGENO lleva este bloque al pie: certificaciones, testimonios y constancias.</div><div class="hoja" style="display:flex;align-items:center;gap:6px"><span class="qr"></span><span><span class="eyebrow">Verificación</span><br><b class="mono">EGG7-4K2P-9XZM-0B13</b><br><span class="sub">Verificá la autenticidad de este documento en siigeno.cba.gov.ar/verificar</span></span></div></div></div>`;
  return {main, after(){ const go=()=>{ S.verCodigo=$("#cod").value; S.verRes=verificar(S.verCodigo); render(); }; $("#verBtn").onclick=go; $("#cod").onkeydown=e=>{ if(e.key==="Enter") go(); }; document.querySelectorAll("[data-prueba]").forEach(b=>b.onclick=()=>{ S.verCodigo=b.dataset.prueba; S.verRes=verificar(S.verCodigo); render(); }); }}; };
/* ==================================================================
   EL ARMADOR DE CUATRO PASOS (reemplaza al wizard actual de siete)
   Escritura → Carácter (la documentación va adentro) → Costo → Envío
   Para certificaciones de funcionarios: Documentos → Quién firma → Para quién → Enviar
   ================================================================== */
function cotizarN(N){ const t=TJ[N.tipo]; const L=[]; if(t.exento||t.tipo==="estudio"){ L.push([t.exento?"Exento: organismo público":"Sin tasa para escribanos en ejercicio","",0]); return {L,total:0}; }
  const car=CAR[N.caracter]; const fojas=N.nose?null:(ESCRITURAS.find(e=>String(e.n)===String(N.num))||{}).fojas;
  L.push(["Derecho fijo del trámite",`${t.fijo} UT`,t.fijo*UT]);
  if(t.foja) L.push(["Por foja",fojas?`${fojas} fojas × ${t.foja} UT — contadas del protocolo`:`se tasa cuando la Escribanía ubique la escritura`,fojas?fojas*t.foja*UT:0]);
  let sub=L.reduce((a,l)=>a+l[2],0); if(N.ej>1) L.push(["Ejemplares adicionales",`${N.ej-1} al 50 %`,sub*0.5*(N.ej-1)]);
  if(t.soporte==="digital") L.push(["Emisión digital","Se descarga del portal",0]);
  let total=L.reduce((a,l)=>a+l[2],0); if(car&&car.exento){ L.push(["Exento: juez u organismo público","Sin la exención habría salido "+pesos(total),-total]); total=0; }
  return {L,total,fojas}; }
const lineasHTML=(L,total,nota)=>`<div>${L.map(l=>`<div class="costline"><span>${esc(l[0])}${l[1]?`<div class="sub">${esc(l[1])}</div>`:""}</span><span class="v">${l[2]<0?"− "+pesos(-l[2]):l[2]===0?"sin cargo":pesos(l[2])}</span></div>`).join("")}<div class="total"><span class="eyebrow">Total</span><span class="v">${pesos(total)}</span></div>${nota?`<div class="sub">${nota}</div>`:""}</div>`;

/* Indicador de pasos: tocás un paso y te lleva ahí. Hacia atrás, siempre; hacia adelante,
   hasta el primer paso que falte completar (y avisa cuál). */
const pasosHTML=(pasos,P)=>`<div class="pasos">${pasos.map((p,i)=>`<div class="${P===i+1?"on":P>i+1?"ok":""}" ${P===i+1?'aria-current="step"':`data-paso="${i+1}" role="button" tabindex="0" title="Ir a ${esc(p)}"`}>${P>i+1?"✓":"Paso "+(i+1)}<b>${esc(p)}</b></div>`).join("")}</div>`;
function pasosClic(N,pasos,valido){ document.querySelectorAll(".pasos [data-paso]").forEach(el=>{ const ir1=()=>{ const j=+el.dataset.paso; let k=N.paso; if(j<k) k=j; else while(k<j&&valido(k)) k++;
    if(k===N.paso){ toast(`Primero completá «${pasos[k-1]}».`); return; } if(k<j) toast(`Antes de «${pasos[j-1]}» falta completar «${pasos[k-1]}».`); N.paso=k; render(); window.scrollTo(0,0); };
  el.onclick=ir1; el.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); ir1(); } }; }); }

VISTAS.armador=()=>{ const N=S.nuevo; if(!N) return VISTAS.nuevos(); const t=TJ[N.tipo]; const esCert=t.tipo==="cert", esEst=t.tipo==="estudio", esTest=t.tipo==="testimonio";
  const pasos=esCert?["Los documentos","Quién firma","Para quién","Enviar"]:["Escritura","Carácter","Costo","Envío"]; const P=N.paso; const car=CAR[N.caracter];
  const valido=p=>{ const c=CAR[N.caracter]; const dOk=c?c.docs.every((d,i)=>N.docs[i]):true;
    return !!(p===1?(esCert?N.vdocs.some(d=>d.n.trim()):(N.nose||(N.anio&&N.num))):p===2?(esCert?!!N.firmante:(esEst||(N.caracter&&dOk&&(!c.fundamento||N.fundamento.trim())&&(!esTest||N.motivoT)))):p===3?true:N.dj||esCert); };
  const puede=valido(P);
  const cuerpo=
    P===1&&esCert?`<div><b>Los documentos</b><div class="sub">Agregá todos los que necesites en este mismo pedido. De cada uno decinos si nació digital o está en papel: eso es lo único que define si hay que acercarse.</div></div>
      <div class="docs">${N.vdocs.map((d,i)=>`<div class="card" style="background:var(--surface-2)"><div class="row"><input type="text" data-vd="${i}" value="${esc(d.n)}" placeholder="Ej.: Resolución 512-2026.pdf" style="flex:1"><button class="btn sm" type="button">Subir archivo</button><button class="btn sm" type="button" data-vq="${i}" ${N.vdocs.length<2?"disabled":""}>Quitar</button></div><div class="g2" style="margin-top:8px"><button class="opc" type="button" data-vo="${i}|digital" aria-pressed="${d.o==="digital"}"><span><b>Nació digital</b><span class="d">Tiene firma digital o salió de un sistema. Se resuelve entero por el portal.</span></span></button><button class="opc" type="button" data-vo="${i}|papel" aria-pressed="${d.o==="papel"}"><span><b>Está en papel</b><span class="d">Hay que confrontarlo con el original antes de entregar la certificación.</span></span></button></div></div>`).join("")}</div>
      <div><button class="btn sm" type="button" id="vmas">Agregar otro documento</button></div>
      ${N.tipo==="cert_firma"||N.vdocs.some(d=>d.o==="papel")?`<div class="box b-warn">${N.tipo==="cert_firma"?"La certificación de firma es presencial: el firmante firma ante la escribana. Se asigna turno.":"Hay documentos en papel: hay que acercarse a confrontar el original. El resto sigue por el portal y la certificación puede salir digital."}</div>`:`<div class="box b-ok">Todo nació digital: el circuito se resuelve entero por el portal.</div>`}`
    :P===1?`<div><b>Datos de la escritura</b><div class="sub">Los datos que identifican la escritura. Están en la escritura misma; si no los tenés, la Escribanía la busca por vos.</div></div>

      <p class="legend">Probá con el número 62 (año 2026) o 402 (año 2011): están en el protocolo de ejemplo y las fojas se cuentan solas.</p>
      <button class="opc" type="button" id="aNose" aria-pressed="${N.nose}"><span><b>No sé los datos de mi escritura</b><span class="d">Contá lo que sepas (quiénes firmaron, el inmueble, el año aproximado) y la Escribanía la busca en el protocolo con el superbuscador. El costo se calcula cuando la encuentre.</span></span></button>
      ${N.nose?`<textarea id="aPista" rows="3" placeholder="Ej.: compraventa de un lote en Colonia Tirolesa, alrededor de 2012, a nombre de Ramón Luque">${esc(N.pista||"")}</textarea>`:""}`
    :P===2&&esCert?`<div><b>Quién firma</b><div class="sub">${N.tipo==="cert_firma"?"El funcionario que va a firmar ante la escribana.":"El funcionario que pide la certificación en nombre del organismo."} Solo se puede elegir a quien tiene la vigencia al día.</div></div>
      ${miOrg().func.map(f=>`<button class="opc" type="button" data-firm="${esc(f.cuil)}" aria-pressed="${N.firmante&&N.firmante.cuil===f.cuil}" ${f.vig?"":"disabled"}><span><b>${esc(f.n)}</b><span class="d">${esc(f.cargo)} · ${esc(f.res||"sin resolución")} · vigente hasta ${f.hasta}${f.vig?"":" · vencida: no se puede elegir"}</span></span></button>`).join("")}`
    :P===2&&esEst?`<div><b>Escribano en ejercicio</b><div class="sub">La consulta de antecedentes no usa la pantalla de carácter: tu CiDi y tu matrícula ya te habilitan.</div></div><div class="box b-ok">Esc. ${esc(ROLES[S.rol].n)} · ${esc(ROLES[S.rol].rol)} · habilitada</div>`
    :P===2?`<div><b>¿En qué carácter lo pedís?</b><div class="sub">Lo que hay que adjuntar aparece adentro del carácter que elijas. Elegí uno.</div></div>
      ${CARACTERES.map(c=>`<button class="opc" type="button" data-car="${c.k}" aria-pressed="${N.caracter===c.k}"><span><b>${esc(c.t)}</b><span class="d">${esc(c.d)}</span></span></button>`).join("")}
      ${car?`<div class="card" style="background:var(--surface-2)">${car.docs.length?`<b>Lo que tenés que adjuntar</b><div class="docs" style="margin-top:8px">${car.docs.map((d,i)=>`<div class="doc ${N.docs[i]?"ok":""}"><span style="flex:1">${esc(d)}</span><button class="btn sm" type="button" data-adj="${i}">${N.docs[i]?"✓ cargado":"Subir"}</button></div>`).join("")}</div>${car.aviso?`<div class="box b-info" style="margin-top:8px">${esc(car.aviso)}</div>`:""}`:`<div class="box b-ok">No adjuntás nada: tu CiDi ya te identifica y la escritura dice que estuviste. Pasás directo al costo.</div>`}
        ${car.fundamento?`<div style="margin-top:10px"><label class="f" for="aFund">Fundamentá para qué la necesitás</label><textarea id="aFund" rows="3" placeholder="Lo lee una persona de la Escribanía, así que escribilo completo">${esc(N.fundamento)}</textarea></div>`:""}
        ${esTest?`<div style="margin-top:10px"><label class="f" for="aMot">Motivo del segundo testimonio *</label><select id="aMot"><option value="">Elegí</option>${MOTIVOS_TEST.map(m=>`<option ${N.motivoT===m?"selected":""}>${m}</option>`).join("")}</select></div><div class="box b-info" style="margin-top:8px"><b>La nota de solicitud la genera el sistema</b> con tus datos y los de la escritura: se imprime, se firma, se escanea y se sube acá. ${car.k==="sucesor_u"?"Firman todos los herederos declarados.":""}<div class="row" style="margin-top:6px"><button class="btn sm" type="button" id="aNota">Descargar la nota precargada</button><button class="btn sm" type="button" data-adj="99">${N.docs[99]?"✓ nota firmada cargada":"Subir la nota firmada"}</button></div></div>`:""}</div>`:""}`
    :P===3&&esCert?`<div><b>Para qué se pide</b><div class="sub">Sirve para saber ante quién se presenta. No cambia el trámite.</div></div><div class="g2"><div><label class="f" for="aPara">Se expide para <span class="sub">(opcional)</span></label><input type="text" id="aPara" value="${esc(N.para)}" placeholder="Ej.: Registro General, IPJ, juzgado, licitación…"></div><div><label class="f" for="aRef">Referencia interna <span class="sub">(opcional)</span></label><input type="text" id="aRef" value="${esc(N.ref||"")}" placeholder="N° de expediente o nota del organismo"></div></div><div class="box b-info">Exento de pago: no hay pantalla de costos para organismos públicos.</div>`
    :P===3?(()=>{ const {L,total,fojas}=cotizarN(N); return `<div><b>Cuánto sale</b><div class="sub">${N.nose?"Todavía no se puede tasar: la Escribanía tiene que ubicar la escritura. Te avisamos y pagás después.":fojas?"Las fojas salen del protocolo: no hay que contarlas a mano.":"La Escribanía cuenta las fojas al dar el alta y te avisa el monto."}</div></div>
      <div class="g2"><div><label class="f" for="aEj">Ejemplares</label><select id="aEj">${[1,2,3].map(n=>`<option ${N.ej===n?"selected":""}>${n}</option>`).join("")}</select></div><div><label class="f">Carácter</label><input type="text" value="${esc(car?car.t:"")}" readonly></div></div>
      ${lineasHTML(L,total,`UT de ejemplo: ${pesos(UT)}. Faltan los valores vigentes de la Ley 11.090.`)}
      ${car&&car.directo&&!N.nose?`<div class="box b-ok"><b>Carril directo.</b> Como fuiste parte, no hay control de documentación: pagás al enviar y entra directo en preparación.</div>`:`<div class="box b-info">Se paga después de que la Escribanía controle la documentación. Te llega la boleta por correo y lo ves en Tasas.</div>`}`; })()
    :esCert?`<div><b>Enviar</b><div class="sub">Revisá y mandalo. Entra directo a los pedidos de la Escribanía.</div></div><div class="kv"><div><div class="l">Trámite</div><div class="v">${esc(t.n)}</div></div><div><div class="l">Organismo</div><div class="v">${esc(miOrg().n)}</div></div><div><div class="l">Documentos</div><div class="v">${N.vdocs.filter(d=>d.n).map(d=>esc(d.n)+" ("+d.o+")").join(" · ")}</div></div><div><div class="l">Quién firma</div><div class="v">${esc(N.firmante.n)}</div></div><div><div class="l">Se expide para</div><div class="v">${esc(N.para||"—")}</div></div><div><div class="l">Costo</div><div class="v">Exento</div></div></div><div class="box b-info"><b>Qué se certifica.</b> La copia o la firma, no el contenido ni la legalidad del documento. Los datos del firmante salen del legajo confirmado por la Escribanía.</div>`
    :`<div><b>Envío</b><div class="sub">Para qué lo pedís y la declaración jurada. Un solo botón para enviar.</div></div>
      <div class="g2"><div><label class="f" for="aObj">Para qué lo necesitás</label><select id="aObj"><option value="">Elegí</option>${["Archivo personal","Trámite bancario o crediticio","Trámite sucesorio","Trámite judicial","Gestión ante organismo público","Venta del inmueble","Otro"].map(o=>`<option ${N.objeto===o?"selected":""}>${o}</option>`).join("")}</select></div><div><label class="f" for="aMotivo">Motivo <span class="sub">(breve)</span></label><input type="text" id="aMotivo" value="${esc(N.motivo)}" placeholder="Ej.: acreditación de titularidad"></div></div>
      <div class="kv"><div><div class="l">Trámite</div><div class="v">${esc(t.n)}</div></div><div><div class="l">Escritura</div><div class="v">${N.nose?"La busca la Escribanía":`${esc(N.num)} · ${esc(N.sec.replace("Sección ",""))} · ${esc(N.anio)}`}</div></div><div><div class="l">Carácter</div><div class="v">${esc(car?car.t:(esEst?"Escribano en ejercicio":"—"))}</div></div><div><div class="l">Total</div><div class="v">${N.nose?"se tasa después":pesos(cotizarN(N).total)}</div></div></div>
      <label class="row" style="gap:8px;cursor:pointer;align-items:flex-start"><input type="checkbox" id="aDj" ${N.dj?"checked":""} style="margin-top:3px"> <span>Declaro bajo juramento que los datos y la documentación son auténticos y que el carácter que invoco es verdadero.</span></label>`;
  const main=`${cab("r",t.n,"","Carga de información · armador de cuatro pasos")}
    ${pasosHTML(pasos,P)}
    <div class="card stack" style="margin-top:12px">${cuerpo}
      <div class="acciones">${P>1?`<button class="btn" type="button" id="aAtras">Anterior</button>`:`<button class="btn" type="button" id="aCancel">Cancelar</button>`}<button class="btn sm" type="button" id="aGuardar" title="Queda en Trámites en proceso como Pendiente">Guardar y seguir después</button>${P<4?`<button class="btn pri lg" type="button" id="aSig" ${puede?"":"disabled"}>Continuar</button>`:`<button class="btn pri lg" type="button" id="aEnviar" ${puede?"":"disabled"}>${car&&car.directo&&!N.nose?"Pagar y enviar":"Enviar a la Escribanía"}</button>`}</div></div>`;
  return {main, after(){ pasosClic(N,pasos,valido); const on=(id,fn)=>{ const el=$(id); if(el) el.oninput=()=>fn(el); }; on("#aAnio",el=>{N.anio=el.value; chk();}); on("#aNum",el=>{N.num=el.value; chk();}); on("#aFecha",el=>N.fecha=el.value); on("#aPista",el=>N.pista=el.value); on("#aFund",el=>{N.fundamento=el.value; chk();}); on("#aMotivo",el=>N.motivo=el.value); on("#aPara",el=>N.para=el.value); on("#aRef",el=>N.ref=el.value);
    const sel=(id,fn)=>{ const el=$(id); if(el) el.onchange=()=>{ fn(el); render(); }; }; sel("#aSec",el=>N.sec=el.value); sel("#aMot",el=>N.motivoT=el.value); sel("#aEj",el=>N.ej=+el.value); sel("#aObj",el=>N.objeto=el.value);
    function chk(){ const s=$("#aSig"); if(s) s.disabled=!(N.nose||(N.anio&&N.num)); }
    const ns=$("#aNose"); if(ns) ns.onclick=()=>{ N.nose=!N.nose; render(); };
    document.querySelectorAll("[data-car]").forEach(b=>b.onclick=()=>{ N.caracter=b.dataset.car; N.docs={}; render(); }); document.querySelectorAll("[data-adj]").forEach(b=>b.onclick=()=>{ N.docs[b.dataset.adj]=true; render(); }); const nt=$("#aNota"); if(nt) nt.onclick=()=>toast("Nota de solicitud generada con tus datos y los de la escritura. Imprimila, firmala y subila.");
    document.querySelectorAll("[data-vd]").forEach(i=>i.oninput=()=>{ N.vdocs[+i.dataset.vd].n=i.value; const s=$("#aSig"); if(s) s.disabled=!N.vdocs.some(d=>d.n.trim()); }); document.querySelectorAll("[data-vo]").forEach(b=>b.onclick=()=>{ const [i,o]=b.dataset.vo.split("|"); N.vdocs[+i].o=o; render(); }); document.querySelectorAll("[data-vq]").forEach(b=>b.onclick=()=>{ N.vdocs.splice(+b.dataset.vq,1); render(); }); const vm=$("#vmas"); if(vm) vm.onclick=()=>{ N.vdocs.push({n:"",o:"digital"}); render(); };
    document.querySelectorAll("[data-firm]").forEach(b=>b.onclick=()=>{ N.firmante=miOrg().func.find(f=>f.cuil===b.dataset.firm); render(); });
    const dj=$("#aDj"); if(dj) dj.onchange=()=>{ N.dj=dj.checked; $("#aEnviar").disabled=!N.dj; };

function trazaHist(t){ const orden=["revision","observado","pago","preparacion","turno","listo","entregado"]; const k=orden.indexOf(t.estado);

  if(t.estado==="entregado") t.hist.push({f:t.entregadoEl+" 11:10",q:"Peralta, L. · auxiliar",e:"Entregado en mostrador"}); }
function trazaRuta(t){ t.ruta=[]; (t.docs||[]).forEach(d=>{ const nom=typeof d==="string"?d:d.n; t.ruta.push({n:pad(t.ruta.length+1),doc:nom,quien:"Requirente",fecha:t.ingreso,formato:"PDF"}); });

  if(esAltaT(t)) return [{d:"Resolución o decreto de designación, o nota del organismo",adj:!!(t.docs||[]).length},{d:"CUIT: corresponde a un organismo público",adj:!!t.cuit},{d:"Cargo del solicitante: puede pedir certificaciones por el organismo",adj:!!t.cargo}]; if(car&&car.docs.length) return car.docs.map(d=>({d,adj:(t.docs||[]).includes(d)})); if(car&&car.directo) return [{d:"Identidad acreditada por CiDi",adj:true},{d:"Figura como parte en la escritura",adj:!!t.escN}]; if(TJ[t.tipo].tipo==="estudio") return [{d:"Matrícula de escribano vigente",adj:true}]; return [{d:"Fundamento del interés",adj:!!(t.docs||[]).length}]; }

const diasDesde=f=>{ const [d,m,a]=String(f||"").split("/").map(Number); const n=Math.round((hoy-new Date(a,m-1,d))/864e5); return n<=0?"hoy":n===1?"ayer":`hace ${n} días`; };

function verArchivo(t,r){ S.modal={titulo:r.doc,html:`<div class="row sub" style="margin-bottom:10px;gap:6px"><span>Orden ${r.n}</span>·<span>cargó ${esc(r.quien)}</span>·<span>${r.fecha}</span>·<span>${esc(r.formato)}</span>·<span>pedido ${esc(t.id)}</span></div>

function docsHandlers(){ const buscar=v=>{ const [id,n]=v.split("|"); const t=S.tramites.find(x=>x.id===id); return [t,t&&(t.ruta||[]).find(x=>x.n===n)]; };

VISTAS.pedidos=()=>{ const F=S.filtroPed; const todos=S.tramites.filter(t=>t.estado!=="pendiente"); todos.forEach(traza);
  const enF=todos.filter(t=>F==="todos"||(F==="ciu"&&!esCertT(t)&&!esAltaT(t))||(F==="fun"&&esCertT(t))||(F==="altas"&&esAltaT(t))||(F==="nuevos"&&t.estado==="enviado")||(F==="obs"&&t.estado==="observado")||(F==="fin"&&TONO(t)==="fin"));
  const O=S.pedOrden; const clave={tramite:t=>nombreT(t),iniciador:t=>iniciadorT(t),ingreso:t=>fNum(t.ingreso),estado:t=>(ESTADOS[t.estado]||{}).egg||t.estado,asig:t=>t.asig||"~"}[O.k]||(t=>fNum(t.ingreso));
  const cmp=(a,b)=>{ const x=clave(a),y=clave(b); return (typeof x==="number"?x-y:String(x).localeCompare(String(y),"es"))*O.dir; };

  const fila=t=>{ const cert=esCertT(t); const tono=TONO(t); const R=ROLES[t.rol]; return `<tr class="ped ${tono}" data-abrir="${esc(t.id)}" title="Abrir la ficha"><td><b>${esc(nombreT(t))}</b><div class="sub">${t.id}${cert?"":esAltaT(t)?" · "+esc(t.org):" · escritura "+esc(t.esc)}${t.cargadoPor?" · <b>cargada por la Escribanía</b>":""}</div></td><td><b>${esc(iniciadorT(t))}</b><div>${cert?`<span class="chip c-gold">funcionario · ${esc(t.org)}</span>`:esAltaT(t)?`<span class="chip c-gold">pide habilitación · ${esc(t.cargo||"")}</span>`:`<span class="chip ${t.rol==="esc"?"c-info":"c-mute"}">${esc(R?R.rol:"")}</span>`}</div></td><td class="num">${t.ingreso}${tono==="nuevo"?`<div class="sub">${diasDesde(t.ingreso)}</div>`:""}</td><td>${chipT(t,"egg")}${t.estado==="cancelado"?`<div class="sub">${esc(t.motivoCancel||"")}</div>`:""}</td><td>${esc(queSigueEgg(t))}</td><td class="sub">${esc(t.asig||"sin asignar")}</td><td><button class="btn sm" type="button" data-arch="${esc(t.id)}" aria-expanded="${S.archAbierto===t.id}" title="Ver los archivos">📎 ${t.ruta.length}</button></td></tr>${S.archAbierto===t.id?`<tr class="archs"><td colspan="7">${archivosHTML(t)}</td></tr>`:""}`; };
  const main=`${cab("n","Pedidos","Lo que entra por el portal: ciudadanos, escribanos y funcionarios, y las habilitaciones de organismo. El color dice de quién es la pelota: resaltado lo que acaba de llegar, normal lo que está en trámite acá, gris lo que espera al requirente. Lo terminado no aparece: queda en el filtro «Terminados». Tocá una fila para abrir la ficha.","Gestión interna · "+(S.eggComo==="esc"?"escribana":"auxiliar"))}
    <div class="kpis"><div class="kpi"><b>${cnt("nuevo")}</b><span>acaban de llegar</span></div><div class="kpi"><b>${cnt("proc")}</b><span>en trámite</span></div><div class="kpi"><b class="w">${cnt("ciu")}</b><span>esperan al requirente</span></div><div class="kpi"><b class="x">${cnt("fin")}</b><span>terminados</span></div></div>
    <div class="spread" style="margin:14px 0 6px"><div class="filtros">${[["todos","Todos"],["ciu","Ciudadanos y escribanos"],["fun","Funcionarios"],["altas","Habilitaciones"],["nuevos","Nuevos"],["obs","Observados"],["fin","Terminados"]].map(f=>`<button type="button" data-fp="${f[0]}" aria-pressed="${F===f[0]}">${f[1]}</button>`).join("")}</div><button class="btn sm" type="button" id="cargarCert">Cargar una certificación por interno</button></div>
    <div class="tonos" style="margin-bottom:8px"><span><i style="background:var(--warn-bg);border-color:var(--gold)"></i>acaba de llegar</span><span><i style="background:var(--surface)"></i>en trámite</span><span><i style="background:var(--gris-bg)"></i>espera al requirente</span><span class="sub" style="margin-left:auto">Las columnas se ordenan tocando el encabezado · lo terminado está en su filtro</span></div>
    <div class="tablewrap"><table><thead><tr>${th("tramite","Trámite")}${th("iniciador","Iniciador")}${th("ingreso","Ingresó")}${th("estado","Estado")}${th("","Qué sigue")}${th("asig","A cargo")}${th("","Archivos")}</tr></thead><tbody>
      ${activos.map(fila).join("")||(F==="fin"?"":`<tr><td colspan="7" class="sub">Nada en curso acá.</td></tr>`)}
      ${verFin?fin.map(fila).join("")||`<tr><td colspan="7" class="sub">Nada terminado todavía.</td></tr>`:""}</tbody></table></div>
    ${!verFin&&fin.length?`<p class="legend" style="margin-top:6px">Lo terminado no aparece acá: ${fin.length} ${fin.length===1?"pedido":"pedidos"} en el filtro «Terminados» (listos, entregados, cancelados y no corresponde). Siguen en la ficha y en el buscador; no se borran.</p>`:""}
    ${S.fichaAbierta?ficha(S.tramites.find(t=>t.id===S.fichaAbierta)):""}

function fichaAfter(){ const t=S.tramites.find(x=>x.id===S.fichaAbierta); if(!t) return; const car=CAR[t.caracter]; const items=esCertT(t)?[]:itemsCtrl(t);
  const c=$("#cerrarFicha"); if(c) c.onclick=()=>{ S.fichaAbierta=null; render(); };
  document.querySelectorAll("[data-ftab]").forEach(b=>b.onclick=()=>{ S.fichaTab=b.dataset.ftab; render(); });
  document.querySelectorAll("#ficha [data-q]").forEach(i=>i.oninput=()=>{ S.fichaQ[i.dataset.q]=i.value; }); const fb=$("#fqBuscar"); if(fb) fb.onclick=()=>render(); document.querySelectorAll("#ficha [data-q]").forEach(i=>i.onkeydown=e=>{ if(e.key==="Enter") render(); }); const fl=$("#fqLimpiar"); if(fl) fl.onclick=()=>{ S.fichaQ={}; render(); };
  /* demo: «encontrarla» sin tipear la búsqueda — usa los datos que cargó el requirente, la pista, o una escritura de ejemplo */
  const fd=$("#fqDemo"); if(fd) fd.onclick=()=>{ const e=(t.escN&&ESCRITURAS.find(x=>x.n===t.escN))||(t.pista&&ESCRITURAS.find(x=>matchLibre(x,t.pista)))||ESCRITURAS.find(x=>TJ[t.tipo].tipo!=="testimonio"&&x.n===14)||ESCRITURAS[0]; ubicarEsc(t,e); };
  document.querySelectorAll("[data-ubica]").forEach(b=>b.onclick=()=>ubicarEsc(t,ESCRITURAS.find(x=>x.n===+b.dataset.ubica)));
  document.querySelectorAll("[data-ver]").forEach(b=>b.onclick=()=>{ const [i,v]=b.dataset.ver.split("|"); t.ctrl[i]=t.ctrl[i]===v?"":v; if(t.estado==="enviado") t.estado="revision"; render(); });
  const a=$("#fAsignar"); if(a) a.onclick=()=>{ const q=S.eggComo==="esc"?(t.asig==="Micucci, G."?"Corna Fantin, B.":"Micucci, G."):"Corna Fantin, B."; t.asig=q; if(t.estado==="enviado") t.estado="revision"; hist(t,"Asignado a "+q); render(); };
  const na=$("#fNotaAdd"); if(na) na.onclick=()=>{ const v=$("#fNota").value.trim(); if(!v){ toast("Escribí la nota."); return; } t.notas.push({f:fF(hoy)+" "+horaF(),q:quienEgg(),t:v}); render(); };
  const o=$("#fObs"); if(o) o.onclick=()=>{ const sug=items.filter((_,i)=>t.ctrl[i]==="corregir").map(it=>it.d).join("; "); const m=prompt("Qué hay que corregir (lo ve el requirente):",sug||(esAltaT(t)?"Falta la resolución o el decreto de designación: subilo o indicá el número":"Falta la última foja de la declaratoria con la firma del juez")); if(m===null) return; t.obs=m; t.estado="observado"; hist(t,"Observado: "+m); toast("Observado. El requirente lo ve en Trámites en proceso con lo que falta."); render(); };
  const k=$("#fCotizar"); if(k) k.onclick=()=>{ const e=ESCRITURAS.find(x=>x.n===t.escN); t.total=car&&car.exento?0:(TJ[t.tipo].fijo+e.fojas*TJ[t.tipo].foja)*UT; t.estado=t.total?"pago":"preparacion"; if(!t.total) t.pagado=true; hist(t,"Carácter controlado: todo ok"); hist(t,t.total?`Alta y tasación: ${pesos(t.total)} · ${e.fojas} fojas`:"Alta: exento, pasa a preparación"); toast(t.total?`Tasado ${pesos(t.total)}: el requirente ve «Pendiente de pago» y recibe la boleta.`:"Exento: pasa directo a preparación."); render(); };
  const em=$("#fEmitir"); if(em) em.onclick=()=>{ t.estado="listo"; t.codigo=codigoNuevo(); ruta(t,nombreT(t)+" · escritura "+t.esc+" · código "+t.codigo,"Escribanía","PDF firmado"); hist(t,"Emitido con firma digital · código "+t.codigo); if(TJ[t.tipo].tipo==="testimonio") S.testimonios.unshift({n:`Esc. ${t.esc}`,doc:`Segundo testimonio — ${nombreT(t)}`,fecha:fF(hoy),escribana:"ASSAAD, M. A.",para:"Registro General de la Provincia",codigo:t.codigo}); toast(`Emitido con firma digital y código ${t.codigo}.`); render(); };
  const en=$("#fEntregar"); if(en) en.onclick=()=>{ entregarMostrador(t); render(); };
  document.querySelectorAll("[data-okdoc]").forEach(b=>b.onclick=()=>{ const d=t.docs[+b.dataset.okdoc]; d.ok=true; delete d.obs; if(t.estado==="enviado") t.estado="revision"; if(t.estado==="observado"&&!t.docs.some(x=>x.obs)) t.estado="revision"; hist(t,"Documento controlado: "+d.n); render(); });
  document.querySelectorAll("[data-obsdoc]").forEach(b=>b.onclick=()=>{ const d=t.docs[+b.dataset.obsdoc]; const m=prompt("Qué tiene ese documento:","No se lee completo: reemplazar el archivo"); if(m===null) return; d.obs=m; d.ok=false; t.estado="observado"; hist(t,"Observado el documento «"+d.n+"»: "+m); toast("Observado solo ese documento. El funcionario lo reemplaza desde el portal."); render(); });
  /* certificación de firma: presencial, se certifica en el acto; la constancia queda en el libro de intervenciones físico (el sistema no lleva libro) */
  const ff=$("#fFirmo"); if(ff) ff.onclick=()=>{ certificarFirma(t); render(); };
  const hb=$("#fHabilitar"); if(hb) hb.onclick=()=>{ let o=S.organismos.find(x=>norm(x.cuit)===norm(t.cuit)&&t.cuit); if(!o){ o={cuit:t.cuit||"30-00000000-0",n:t.org,tipo:t.tipoOrg||"central",func:[]}; S.organismos.push(o); } const hasta=t.hasta||"31/12/2027";
    [{n:t.solicitante,cuil:t.cuilSol,cargo:t.cargo},...(t.otros||[])].forEach(f=>{ if(!f||!f.n) return; const ya=f.cuil?o.func.find(x=>x.cuil===f.cuil):null; if(ya){ ya.vig=true; ya.hasta=hasta; ya.cargo=f.cargo||ya.cargo; } else o.func.push({n:f.n,cuil:f.cuil||"20-00000000-0",cargo:f.cargo||"(cargo)",res:t.res||"",hasta,vig:true}); });
    t.estado="listo"; t.hasta=hasta; S.orgSel=o.cuit; ruta(t,"Constancia de habilitación · "+o.n,"Escribanía","PDF firmado"); hist(t,`Organismo habilitado: ${o.n} · ${t.solicitante} (${t.cargo}) vigente hasta ${hasta}`); toast(`${o.n} habilitado. ${t.solicitante} ya ve las tres tarjetas de certificación con su CiDi.`); render(); };
  const ce=$("#fCert"); if(ce) ce.onclick=()=>{ const f=fF(hoy); t.registro=[]; t.docs.forEach(d=>{ const n=`2026-${++seqR}`; S.registro.unshift({n,fecha:f,org:t.org,doc:d.n,origen:d.o==="papel"?"Papel":"Digital",para:t.para,escribana:"ASSAAD, M. A.",codigo:codigoNuevo(),estado:"valido",fojas:3+(d.n.length%5)}); t.registro.push(n); }); t.estado="listo"; ruta(t,"Certificación emitida · "+t.registro.join(", "),"Escribanía","PDF firmado"); hist(t,"Certificado y asentado: "+t.registro.join(", ")); toast(`Asentado: ${t.registro.join(", ")}. El funcionario lo descarga del portal y cualquiera lo verifica con el código.`); render(); };
  const bo=$("#fBorrar"); if(bo) bo.onclick=()=>{ const m=prompt("Motivo del borrado (queda registrado):","Cargado por error, duplicado del "+t.id); if(m===null) return; S.borrados.push({id:t.id,motivo:m,quien:quienEgg(),fecha:fF(hoy)}); S.tramites=S.tramites.filter(x=>x.id!==t.id); S.fichaAbierta=null; toast("Borrado con motivo. Queda en el registro de borrados."); render(); };
  const nc=$("#fNoCorr"); if(nc) nc.onclick=()=>{ const sug=items.filter((_,i)=>t.ctrl[i]==="impide").map(it=>it.d).join("; "); const m=prompt("Fundamento (lo ve el requirente):",sug?"Impide: "+sug:esAltaT(t)?"El CUIT no corresponde a un organismo público, o el cargo no habilita a pedir certificaciones por el organismo":"No acredita el carácter invocado: la declaratoria no lo incluye como heredero"); if(m===null) return; t.estado="nocorresponde"; t.fund=m; hist(t,(esAltaT(t)?"Rechazado: ":"No corresponde: ")+m); toast(esAltaT(t)?"Rechazado, con fundamento. El funcionario lo ve en Trámites en proceso.":"No corresponde, con fundamento. El requirente lo ve."); render(); }; }

/* certificación presencial y entrega en mostrador: las usan la ficha y la Agenda */
function certificarFirma(t){ t.docs.forEach(d=>{ d.ok=true; delete d.obs; }); t.estado="entregado"; t.entregadoEl=fF(hoy); t.firmo=true; t.noVino=false; ruta(t,"Documento con la firma certificada · se lo llevó el funcionario","Escribanía","papel"); hist(t,"Firmó ante la escribana · firma certificada en el acto · asentada en el libro de intervenciones (físico)"); toast("Firma certificada en el acto. Queda asentada en el libro de intervenciones físico; el sistema no lleva libro."); }
function entregarMostrador(t){ t.estado="entregado"; t.entregadoEl=fF(hoy); t.noVinoAg=false; hist(t,"Entregado en mostrador"); toast("Entregado en mostrador."); }

function ubicarEsc(t,e){ t.escN=e.n; t.esc=`${e.n} · ${e.sec} · ${e.anio}`; t.fojas=e.fojas; t.nose=false; S.fichaQ={}; hist(t,`Escritura ubicada en el protocolo: N.º ${e.n} · Sección ${e.sec} · ${e.anio} · ${e.fojas} fojas`); toast(`Escritura ubicada: N.º ${e.n}, ${e.fojas} fojas.`); render(); }

const TIPO_CORTO={ddjj:"DDJJ",firma:"Certificación",retiro:"Retiro",estudio:"Estudio"};

/* todos los turnos, de todas las fuentes, en una sola lista */
function turnosTodos(){ const L=[];
  S.actas.forEach(a=>{ const p=diaDe(a.turno); if(!p) return; L.push({key:"a"+a.id,tipo:"ddjj",d:p.d,hora:p.hora,quien:a.nombre,det:"Escritura de declaración jurada · "+a.cargo,atiende:"Esc. FELICIOTTI",estado:a.estadoT||"por venir",motivo:a.motivo||"",src:{acta:a.id}}); });
  S.tramites.forEach(t=>{

const okEst=e=>["firmó","retiró","vino","vino y firmó"].includes(e);

/* lo que se hace con un turno: vino/firmó, no vino, anular, reprogramar. Toca la fuente (escritura de DDJJ, pedido o turno suelto) */
function accionTurno(key,acc,valor){ const T=turnosTodos().find(x=>x.key===key); if(!T) return; const s=T.src;
  const a=s.acta!=null?S.actas.find(x=>x.id===s.acta):null, t=s.tramite?S.tramites.find(x=>x.id===s.tramite):null, x=s.extra?S.turnosExtra.find(y=>y.id===s.extra):null;
  if(acc==="ok"){
    if(a){ a.estadoT="firmó"; if(a.nuevo&&!S.constancias.some(c=>c.periodo===2026)){ const n=440+S.actas.length; S.constancias.unshift({periodo:2026,n:"2026-0"+n,cargada:"28/06/2026",firmado:fF(T.d),codigo:"EGG7-2026-0"+n+"-C1"}); } toast("Firmó la escritura. La constancia queda disponible para el obligado."); }
    else if(t&&!s.ret) certificarFirma(t); else if(t&&s.ret) entregarMostrador(t);
    else if(x){ x.estado=EST_OK[x.tipo]; toast("Listo: "+x.estado+"."); } }
  if(acc==="novino"){
    if(a) a.estadoT="no vino"; else if(t&&!s.ret){ t.noVino=true; hist(t,"No vino al turno del "+t.turno); } else if(t&&s.ret){ t.noVinoAg=true; hist(t,"No vino a retirar el "+t.turnoAg); } else if(x) x.estado="no vino";
    toast("Marcado: no vino. Se puede reprogramar."); }
  if(acc==="anular"){ const m=valor; if(!m) return;
    if(a){ a.estadoT="anulada"; a.motivo=m; } else if(x){ x.estado="anulada"; x.motivo=m; } toast("Anulado, con el motivo."); }
  if(acc==="reprog"){ const n=valor; if(!n) return;
    if(a){ a.turno=n; a.estadoT="por venir"; delete a.motivo; } else if(t&&!s.ret){ t.turno=n; t.noVino=false; hist(t,"Turno reprogramado: "+n); } else if(t&&s.ret){ t.turnoAg=n; t.noVinoAg=false; hist(t,"Turno para retirar reprogramado: "+n); } else if(x){ x.turno=n; x.estado="por venir"; }
    toast("Reprogramado: "+n+"."); } }
