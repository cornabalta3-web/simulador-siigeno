VISTAS.registros=()=>({main:`${cab("n","Registros","El registro de certificaciones de copia, que hoy no existe: lo que se asienta acá es lo que responde «Validar documento». Las certificaciones de firma no entran: son presenciales y quedan en el libro de intervenciones físico, que el sistema no reemplaza.","Gestión interna")}
  <div class="card stack"><div><b>Registro de certificaciones de copia</b><div class="sub">Hoy la copia certificada se emite y no queda asentada en ningún lado. Acá queda: número, fecha, organismo, documento, destino y el archivo firmado guardado.</div></div>
    <div class="tablewrap"><table><thead><tr><th>N°</th><th>Fecha</th><th>Organismo</th><th>Documento</th><th>Origen</th><th>Se expidió para</th><th>Archivo</th></tr></thead><tbody>${S.registro.map(r=>`<tr><td class="mono"><b>${r.n}</b></td><td class="num">${r.fecha}</td><td>${esc(r.org)}</td><td>${esc(r.doc)}${r.estado==="anulado"?` <span class="chip c-bad">anulada</span>`:""}<div class="sub"><button class="link mono" type="button" data-verif="${r.codigo}">${r.codigo}</button></div></td><td>${r.origen}</td><td>${esc(r.para)}</td><td><button class="btn sm" type="button" data-hoja="${r.codigo}">Ver</button></td></tr>`).join("")}</tbody></table></div><div id="hojaBox"></div></div>
  <div class="card" style="margin-top:12px"><b>Certificaciones de firma</b><p class="sub" style="margin-top:4px">Se hacen en el acto, ante la escribana, sobre el documento en papel. La constancia es la del libro de intervenciones físico: el sistema registra el pedido, el turno y que se certificó (Pedidos → historial), pero no lleva un libro digital ni emite código para estas.</p></div>`,
  after(){ document.querySelectorAll("[data-verif]").forEach(b=>b.onclick=()=>{ S.verCodigo=b.dataset.verif; S.verRes=verificar(S.verCodigo); S.rol="ciu"; ir("verif"); }); document.querySelectorAll("[data-hoja]").forEach(b=>b.onclick=()=>{ const r=S.registro.find(x=>x.codigo===b.dataset.hoja); $("#hojaBox").innerHTML=`<div style="margin-top:10px"><b>Hoja de certificación digital</b><div class="sub" style="margin-bottom:6px">Última foja del PDF firmado: certifica igual que la presencial.</div>${hojaCert(r)}</div>`; }); }});

/* ---------- Organismos: funcionarios habilitados por ministerio (CUIT) ---------- */
VISTAS.organismos=()=>{ const sel=S.orgSel||S.organismos[0].cuit; const o=S.organismos.find(x=>x.cuit===sel)||S.organismos[0]; const pedidas=S.tramites.filter(t=>esAltaT(t)&&["enviado","revision","observado"].includes(t.estado));
  const main=`${cab("n","Organismos","Quiénes pueden pedir certificaciones por cada ministerio u organismo, con qué resolución y hasta cuándo. Dos caminos: el funcionario pide la habilitación desde el portal (llega a Pedidos y la Escribanía habilita, observa o rechaza), o la Escribanía da el alta directo acá. Desde ese momento el funcionario entra con su CiDi y ve las tres tarjetas. Sin resolución se puede habilitar igual.","Gestión interna")}
    ${pedidas.length?`<div class="box b-warn" style="margin-bottom:12px"><b>${pedidas.length} ${pedidas.length===1?"habilitación pedida":"habilitaciones pedidas"} por el portal</b> ${pedidas.length===1?"espera":"esperan"} revisión: ${pedidas.map(t=>esc(t.org)+" ("+esc(t.solicitante||"")+")").join(" · ")}. <button class="link" type="button" data-ir="pedidos" onclick="S.filtroPed='altas'">Ver en Pedidos</button></div>`:""}
    <div class="g2" style="grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)"><div class="card stack"><div class="spread"><b>Organismos</b><button class="btn sm" type="button" id="altaOrg">Nuevo organismo</button></div>
      ${S.organismos.map(x=>`<button class="opc" type="button" data-org="${x.cuit}" aria-pressed="${sel===x.cuit}"><span><b>${esc(x.n)}</b><span class="d">CUIT ${x.cuit} · ${x.tipo} · ${x.func.filter(f=>f.vig).length} habilitados</span></span></button>`).join("")}</div>
    <div class="card stack"><div><h2 class="t">${esc(o.n)}</h2><div class="sub">CUIT ${o.cuit}</div></div>
      <div class="tablewrap"><table><thead><tr><th>Funcionario</th><th>CUIL</th><th>Cargo</th><th>Resolución</th><th>Vigencia</th><th></th></tr></thead><tbody>${o.func.map((f,i)=>`<tr><td><b>${esc(f.n)}</b></td><td class="mono" style="font-size:12px">${f.cuil}</td><td>${esc(f.cargo)}</td><td class="sub">${esc(f.res||"sin resolución")}</td><td class="num">${f.hasta}</td><td style="text-align:right">${f.vig?`<span class="chip c-ok">vigente</span> <button class="btn sm" type="button" data-baja="${i}">Dar de baja</button>`:`<span class="chip c-bad">vencida</span> <button class="btn sm" type="button" data-renov="${i}">Renovar</button>`}</td></tr>`).join("")}</tbody></table></div>
      <div class="g4" style="align-items:end;grid-template-columns:1.4fr 1fr 1fr auto"><div><label class="f" for="of">Dar de alta un funcionario</label><input type="text" id="of" placeholder="Nombre y apellido · cargo"></div><div><label class="f" for="oc">CUIL</label><input type="text" id="oc" placeholder="20-00000000-0"></div><div><label class="f" for="or">Resolución <span class="sub">(opcional)</span></label><input type="text" id="or" placeholder="Res. 000/2026"></div><button class="btn pri" type="button" id="altaF">Dar de alta</button></div>
      <p class="legend">El sistema controla la vigencia. Vencida o dada de baja, el funcionario deja de ver las tarjetas de certificación hasta renovar.</p></div></div>`;
  return {main, after(){ document.querySelectorAll("[data-org]").forEach(b=>b.onclick=()=>{ S.orgSel=b.dataset.org; render(); }); document.querySelectorAll("[data-renov]").forEach(b=>b.onclick=()=>{ const f=o.func[+b.dataset.renov]; f.vig=true; f.hasta="31/12/2027"; toast("Vigencia renovada: vuelve a ver las tarjetas."); render(); }); document.querySelectorAll("[data-baja]").forEach(b=>b.onclick=()=>{ const f=o.func[+b.dataset.baja]; f.vig=false; toast(`${f.n} dado de baja: ya no ve las tarjetas de certificación.`); render(); });
    $("#altaF").onclick=()=>{ const v=$("#of").value.trim(); if(!v){ toast("Escribí nombre y cargo."); return; } const [n,cg]=v.split("·").map(s=>s.trim()); o.func.push({n,cuil:$("#oc").value.trim()||"20-00000000-0",cargo:cg||"(cargo)",res:$("#or").value.trim(),hasta:"31/12/2027",vig:true}); toast("Funcionario dado de alta. Con su CiDi ya ve las tres tarjetas."); render(); };
    $("#altaOrg").onclick=()=>{ const cuit=`30-7${String(1000000+S.organismos.length).slice(1)}-${S.organismos.length}`; S.organismos.push({cuit,n:"Organismo nuevo "+(S.organismos.length-3),tipo:"descentralizado",func:[]}); S.orgSel=cuit; toast("Organismo creado. Ahora dale de alta a sus funcionarios."); render(); }; }};
};

/* ---------- Buscador de escrituras (herramienta interna) ---------- */
VISTAS.buscador=()=>{ const q=S.busqQ; const hay=Object.values(q).some(v=>String(v||"").trim()); const res=hay?buscarEsc(q):[]; const e=S.escSel!=null?ESCRITURAS.find(x=>x.n===S.escSel):null;
  const main=`${cab("n","Buscador de escrituras","Para encontrar en el archivo digitalizado la escritura que piden: una copia, un testimonio, un estudio de título. Busca por cualquier dato o como lo dirías, también en las observaciones. Corre sobre la base del archivo digital (Ypsilon), que entra a SIIGENO como producto nuevo; es interno. Las fojas salen de acá y alimentan la tasación.","Gestión interna")}
    <div class="card stack"><div><b>Buscar por</b><div class="sub">Completá uno o varios campos: cada uno que agregues afina el resultado. El último campo entiende frases: «compraventa en Colonia Tirolesa alrededor de 2012», «donación entre hermanos», «hipoteca cancelada».</div></div>${camposB("bq",q,false)}
      <div class="g4" style="align-items:end"><div><label class="f" for="bqsec">Protocolo</label><select id="bqsec" data-q="sec"><option value="">Cualquiera</option><option value="A" ${q.sec==="A"?"selected":""}>Sección A</option><option value="B" ${q.sec==="B"?"selected":""}>Sección B · Protocolo B</option></select></div><div></div><div></div><div class="acciones" style="margin:0"><button class="btn" type="button" id="bqLimpiar">Limpiar</button><button class="btn pri" type="button" id="bqBuscar">Buscar</button></div></div>
      <p class="legend">Probá: número 62 · año 2026 · cuenta 1301 2345678 9 · matrícula 1.845.221 · apellido GÓMEZ · fecha 09/06/2011.</p></div>
    <div class="g2" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);margin-top:12px"><div class="card stack"><div class="spread"><b>${hay?res.length+" escrituras":"Resultados"}</b><span class="sub">${hay?"de la más reciente a la más antigua":"completá un campo y buscá"}</span></div>
        ${hay?(res.slice().sort((a,b)=>b.anio-a.anio).map(x=>resultadoEsc(x,`data-esc="${x.n}" aria-pressed="${S.escSel===x.n}"`)).join("")||`<p class="sub">Sin resultados con esos datos.</p>`):`<div class="kpis"><div class="kpi"><b>48.312</b><span>escrituras indexadas</span></div><div class="kpi"><b>1908 – 2026</b><span>período cubierto</span></div><div class="kpi"><b>8</b><span>campos de búsqueda</span></div><div class="kpi"><b>0,4 s</b><span>tiempo de respuesta</span></div></div>`}</div>
    <div class="card stack">${e?`<div><span class="eyebrow" style="color:var(--naranja)">Escritura ${e.n} · ${e.sec==="B"?"Protocolo B":"Sección "+e.sec} · ${e.anio}</span><h2 class="t">${esc(e.acto)}</h2><div class="sub">${e.fecha} · ${esc(e.escribana)}</div></div><div class="kv"><div><div class="l">Partes</div><div class="v">${esc(e.partes)}</div></div><div><div class="l">Inmueble</div><div class="v">${esc(e.loc)}</div></div><div><div class="l">Cuenta</div><div class="v mono">${e.cuenta}</div></div><div><div class="l">Nomenclatura</div><div class="v mono">${e.nom}</div></div><div><div class="l">Matrícula</div><div class="v mono">${e.matricula}</div></div><div><div class="l">Fojas</div><div class="v">${e.fojas} — contadas del protocolo</div></div><div><div class="l">Observaciones</div><div class="v">${esc(OBS_ESC[e.n]||"—")}</div></div></div><div class="box b-ok">Una copia certificada de esta escritura sale ${pesos((40+e.fojas*6)*UT)} para un particular (valores de ejemplo).</div><div class="acciones"><button class="btn" type="button" id="verEsc">Ver la escritura · archivo digital</button></div>`:`<p class="sub">Elegí una escritura de la lista para ver la ficha completa y las fojas.</p>`}</div></div>`;
  return {main, after(){ const ve=$("#verEsc"); if(ve) ve.onclick=()=>verArchivo({id:"Esc. "+e.n+" · "+e.anio},{n:"",doc:`Escritura N° ${e.n} · Sección ${e.sec} · ${e.anio} · ${e.acto}`,quien:"Archivo digital (Ypsilon)",fecha:e.fecha,formato:"imagen digitalizada · "+e.fojas+" fojas"}); document.querySelectorAll("main [data-q]").forEach(i=>{ i.oninput=()=>{ S.busqQ[i.dataset.q]=i.value; }; i.onchange=()=>{ S.busqQ[i.dataset.q]=i.value; }; i.onkeydown=e=>{ if(e.key==="Enter") render(); }; }); $("#bqBuscar").onclick=()=>render(); $("#bqLimpiar").onclick=()=>{ S.busqQ={}; S.escSel=null; render(); }; document.querySelectorAll("[data-esc]").forEach(r=>r.onclick=()=>{ S.escSel=+r.dataset.esc; render(); }); }}; };

/* ---------- Escrituración social: carga (auxiliar) ---------- */
VISTAS["mapa-carga"]=()=>{ const sel=S.mapaSel; const bs=BARRIOS.filter(b=>b.dep===sel);
  const main=`${cab("n","Escrituración social · carga del avance","Lo carga un auxiliar, por barrio: nombre, localidad, familias, expediente, etapa. El departamento toma el color de la etapa más avanzada. Afuera, en el portal, se ve al instante.","Gestión interna · auxiliar")}
    <div class="mapa"><div class="card" style="padding:10px">${mapaSVG(sel)}${leyenda()}</div>
    <div class="stack"><div class="card stack"><div><h2 class="t">${esc(sel||"Tocá un departamento")}</h2><div class="sub">${bs.length} barrios cargados</div></div>${bs.map(b=>`<div class="spread" style="border-top:1px solid var(--line);padding-top:8px"><div><b>${esc(b.n)} — ${esc(b.loc)}</b><div class="sub">${b.fam} familias · exp. ${esc(b.exp)}</div></div><select data-nivel="${BARRIOS.indexOf(b)}" style="width:auto">${NIVELES.map((n,k)=>`<option value="${k}" ${b.nivel===k?"selected":""}>${n[0]}</option>`).join("")}</select></div>`).join("")}
      <div class="g3" style="align-items:end;grid-template-columns:1.3fr 1fr auto"><div><label class="f" for="nb">Nuevo barrio</label><input type="text" id="nb" placeholder="Barrio — localidad"></div><div><label class="f" for="nfam">Familias</label><input type="number" id="nfam" value="10" min="1"></div><button class="btn" type="button" id="addB" ${sel?"":"disabled"}>Agregar</button></div></div>
      <div class="card"><b>La escala</b><ul style="margin:6px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:12.5px">${NIVELES.map((n,i)=>`<li class="row" style="gap:8px;flex-wrap:nowrap"><i style="width:22px;height:16px;border-radius:3px;background:${n[1]};border:1px solid rgba(0,0,0,.12);flex:0 0 auto"></i><span><b>${i+1} · ${n[0]}</b> <span class="sub">${n[2]}</span></span></li>`).join("")}</ul></div></div></div>`;
  return {main, after(){ document.querySelectorAll("[data-dep]").forEach(p=>p.onclick=()=>{ S.mapaSel=p.dataset.dep; render(); }); document.querySelectorAll("[data-nivel]").forEach(s=>s.onchange=()=>{ BARRIOS[+s.dataset.nivel].nivel=+s.value; toast("Etapa actualizada. El portal ya lo muestra."); render(); });
    $("#addB").onclick=()=>{ const v=$("#nb").value.trim(); if(!v){ toast("Escribí barrio y localidad."); return; } const [n,loc]=v.split("—").map(s=>s.trim()); BARRIOS.push({dep:sel,loc:loc||"",n,fam:+$("#nfam").value||1,exp:"0716-0"+(16800+BARRIOS.length)+"/2026",nivel:1}); toast("Barrio agregado como relevado."); render(); }; }};
};

/* ---------- Para la reunión ---------- */
VISTAS.definir=()=>({main:`${cab("x","Lo que falta definir","Lo que el equipo de desarrollo tiene que decir. Ordenado por cuánto frena.","Para la reunión")}
  <div class="box b-ok" style="margin-bottom:14px"><b>Reunión del 8/10 con desarrollo (Fran y Diego):</b> toman los ocho productos. Orden de prioridad acordado: Pedidos y la ficha · Armador · Agenda · Certificaciones y habilitación · Buscador sobre el archivo digital · Validar documento · Mapa · Tasas (estimador).</div>
  <div class="g3"><div class="card"><span class="chip c-warn">Importante</span><ul style="margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px"><li>Agenda: días y horarios por tipo de trámite, qué escribana atiende cada uno, y cómo convive con el Turnero Digital de la Provincia.</li><li>Qué trae la base del archivo digital (Ypsilon): índice, imágenes, texto buscable; quién carga las observaciones.</li><li>Dónde se guarda el archivo certificado (certificación de copia) y por cuánto tiempo.</li><li>Qué código llevan los documentos y quién lo genera; qué pasa con los ya emitidos.</li></ul></div>
  <div class="card"><span class="chip c-info">Abierto</span><ul style="margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px"><li>Sin canal SISCAE → SIIGENO por ahora: la escritura de DDJJ se arma en la Escribanía con lo que trae el obligado.</li><li>Descentralizados sin CiDi institucional: hoy, alta manual.</li><li>Sello del sistema y fórmula del recibo de DDJJ; cuántos obligados hay.</li><li>Si el archivo original queda disponible para comparar en el verificador.</li></ul></div>
  <div class="card"><span class="chip c-ok">Resuelto en la reunión</span><ul style="margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px"><li>La firma digital de la escribana ya está en SIIGENO.</li><li>Valores de la Ley 11.090 y de la UT, CiDi y padrón de CUIT: de una base de datos fija.</li><li>Tasas queda como estimador: orientativo, sujeto a cambio.</li><li>Mapa sin puntos por escritura (dato sensible): por departamento y localidad, carga manual, consulta pública.</li></ul></div></div>
  <div class="card" style="margin-top:14px"><b>Lo que ya se decidió</b><div class="g2" style="margin-top:8px;font-size:13px"><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px"><li>Un solo portal, el de hoy, con tres cuadros más. CiDi identifica: nadie se da de alta.</li><li>«Iniciar trámite» abre el armador de cuatro pasos, no el wizard de siete.</li><li>Las certificaciones de funcionarios son trámites externos: tres tarjetas más en Nuevos Trámites para quien está habilitado en Organismos.</li><li>Pedidos (portal) y Expedientes (SUAC) son dos módulos distintos. En Pedidos, tres tonos de fila; lo terminado solo en su filtro.</li><li>El Turnero pasa a ser la Agenda: un calendario para todos los trámites con turno, con el de DDJJ integrado.</li></ul><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px"><li>Buscador de escrituras solo interno, sobre el archivo digital (Ypsilon), con búsqueda libre y observaciones. El archivo digital entra como producto nuevo.</li><li>Simulador de costos adentro de Tasas. Mapa adentro de SIIGENO, sin consulta por DNI.</li><li>Borrar: el requirente mientras está Pendiente; después cancela con aviso. La Escribanía, con motivo y registro.</li><li>Cert. de copia → registro de certificaciones. Cert. de firma: presencial, queda en el libro de intervenciones físico; el sistema no lleva libro.</li><li>El funcionario pide la habilitación de su organismo desde el portal; la Escribanía habilita, observa o rechaza (o lo da de alta directo).</li></ul></div></div>`});
const RESP_K="siigeno-respuesta-equipo"; try{ Object.assign(S.resp, JSON.parse(localStorage.getItem(RESP_K)||"{}")); }catch(_){}
const PRODS=[["pedidos","Pedidos y la ficha","n"],["armador","Armador de solicitudes (4 pasos)","r"],["turnero","Agenda (turnos de todos los trámites + DDJJ)","r"],["cert","Certificaciones para funcionarios y habilitación","n"],["buscador","Buscador de escrituras sobre el archivo digital","n"],["verif","Validar documento (código y QR)","r"],["mapa","Mapa de escrituración social","n"],["tasas","Tasas y simulador (estimador)","n"]];
VISTAS.respuesta=()=>{ const R=S.resp; const f=(k,c)=>(R[k]||{})[c]||"";
  return {main:`${cab("x","Hoja de respuesta del equipo","Para completar en la reunión: si lo toman, en cuánto tiempo y con qué prioridad. Se guarda en este navegador y se exporta.","Para la reunión")}
    <div class="tablewrap resp"><table><thead><tr><th>Producto</th><th>¿Lo toman?</th><th>Tiempo</th><th>Prioridad</th><th>Qué necesitan / notas</th></tr></thead><tbody>${PRODS.map(([k,n,t],i)=>`<tr><td><b>${i+1} · ${esc(n)}</b><div>${etiqueta(t)}</div></td><td><select data-r="${k}|toman"><option value="">—</option>${["Sí","Sí, con cambios","A evaluar","No"].map(o=>`<option ${f(k,"toman")===o?"selected":""}>${o}</option>`).join("")}</select></td><td><input type="text" data-r="${k}|tiempo" value="${esc(f(k,"tiempo"))}" placeholder="semanas / sprint"></td><td><select data-r="${k}|prio"><option value="">—</option>${[1,2,3,4,5,6,7].map(o=>`<option ${String(f(k,"prio"))===String(o)?"selected":""}>${o}</option>`).join("")}</select></td><td><textarea data-r="${k}|notas" rows="2">${esc(f(k,"notas"))}</textarea></td></tr>`).join("")}</tbody></table></div>
    <div class="card" style="margin-top:12px"><label class="f" for="rgen">Acuerdos generales</label><textarea id="rgen" rows="3" data-r="general|notas" placeholder="Agenda, archivo digital, valores de la Ley 11.090, próxima reunión…">${esc(f("general","notas"))}</textarea></div>
    <div class="acciones"><button class="btn" type="button" id="limpiar">Limpiar</button><button class="btn" type="button" id="copiar">Copiar como texto</button><button class="btn pri" type="button" id="bajar">Descargar .txt</button></div>`,
  after(){ const guardar=()=>{ try{ localStorage.setItem(RESP_K,JSON.stringify(S.resp)); }catch(_){} }; document.querySelectorAll("[data-r]").forEach(el=>el.addEventListener("input",()=>{ const [k,c]=el.dataset.r.split("|"); (S.resp[k]=S.resp[k]||{})[c]=el.value; guardar(); }));
    const texto=()=>`SIIGENO · productos nuevos — respuesta del equipo de desarrollo (${fF(new Date())})\n\n`+PRODS.map(([k,n],i)=>`${i+1}. ${n}\n   Lo toman: ${f(k,"toman")||"—"} · Tiempo: ${f(k,"tiempo")||"—"} · Prioridad: ${f(k,"prio")||"—"}\n   Notas: ${f(k,"notas")||"—"}`).join("\n\n")+`\n\nAcuerdos generales:\n${f("general","notas")||"—"}\n`;
    $("#copiar").onclick=()=>{ navigator.clipboard?.writeText(texto()).then(()=>toast("Copiado.")).catch(()=>toast("No se pudo copiar; usá Descargar.")); }; $("#bajar").onclick=()=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([texto()],{type:"text/plain;charset=utf-8"})); a.download="respuesta-equipo-siigeno.txt"; document.body.appendChild(a); a.click(); a.remove(); }; $("#limpiar").onclick=()=>{ if(confirm("¿Borrar lo cargado?")){ S.resp={}; guardar(); render(); } }; }}; };

/* arranque: #vista o #rol/vista */
(function(){ const h=location.hash.replace("#",""); const [a,b]=h.split("/"); if(b&&ROLES[a]){ S.rol=a; if(VISTAS[b]) S.vista=b; } else if(VISTAS[a]) S.vista=a; render(); })();
</script>
</body>
</html>
