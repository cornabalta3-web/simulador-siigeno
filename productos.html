<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIIGENO · Productos nuevos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Demo navegable de SIIGENO con los productos nuevos, para el equipo de desarrollo.
   Arriba se elige quién sos (público, requirente, obligado, organismo, Escribanía) y el menú
   reproduce el de SIIGENO real: inicio con cuadros, módulos a la izquierda, producto al centro,
   panel «Para desarrollo» a la derecha. Modo presentación: recorrido guiado con guion. */
:root{
  --navy:#1B2F5E; --navy-d:#0F1C3A; --gold:#C9A84C; --cel:#A8C8E8; --cel-s:#E8F0F9; --bone:#EEF2F5;
  --bg:#EEF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB; --fg:#1E2634; --muted:#5F6E85; --line:#D8E0EA;
  --accent:#1B2F5E; --on-accent:#FFFFFF;
  --ok:#1F6B3C; --ok-bg:#E4F2E9; --warn:#8A6A12; --warn-bg:#FBF3DC; --bad:#A3271F; --bad-bg:#FBEAE8; --info:#2E5C8A; --info-bg:#E8F0F9;
  --nuevo:#C9A84C; --reest:#7FA6CF;
  --font:Montserrat,"Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1524; --surface:#162036; --surface-2:#1A2640; --fg:#E4EAF3; --muted:#9AA9C0; --line:#2A3854; --cel-s:#1E2D4B;
    --accent:#9FBDE6; --on-accent:#0E1524; --ok:#7FCB9C; --ok-bg:#16301F; --warn:#E3C26A; --warn-bg:#33290F; --bad:#F0928A; --bad-bg:#3A1A18; --info:#9FBDE6; --info-bg:#1E2D4B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1524; --surface:#162036; --surface-2:#1A2640; --fg:#E4EAF3; --muted:#9AA9C0; --line:#2A3854; --cel-s:#1E2D4B;
  --accent:#9FBDE6; --on-accent:#0E1524; --ok:#7FCB9C; --ok-bg:#16301F; --warn:#E3C26A; --warn-bg:#33290F; --bad:#F0928A; --bad-bg:#3A1A18; --info:#9FBDE6; --info-bg:#1E2D4B; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--fg);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* barra superior */
.top{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:40}
.top .in{display:flex;align-items:center;gap:14px;padding:9px 18px;flex-wrap:wrap}
.marca{display:flex;align-items:baseline;gap:10px;margin-right:6px}
.marca b{letter-spacing:.22em;font-size:17px}
.marca span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
.quien{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#C9D7EA;white-space:nowrap}
.quien select{background:#fff;color:var(--navy);border:0;border-radius:8px;padding:7px 10px;font-weight:600;font-size:13px;min-width:230px}
.top .der{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#C9D7EA;cursor:pointer;user-select:none}
.toggle input{width:15px;height:15px;accent-color:var(--gold)}
.tbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:600;font-size:12.5px;padding:6px 12px;border-radius:8px;cursor:pointer}
.tbtn[aria-pressed=true]{background:var(--gold);color:var(--navy);border-color:var(--gold)}

/* cuerpo */
.cuerpo{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 56px)}
.cuerpo.dev{grid-template-columns:236px minmax(0,1fr) 320px}
.cuerpo.pres{grid-template-columns:236px minmax(0,1fr) 360px}
@media(max-width:1100px){.cuerpo.dev,.cuerpo.pres{grid-template-columns:210px minmax(0,1fr)} .cuerpo.dev aside.dev,.cuerpo.pres aside.pres{grid-column:1/-1}}
@media(max-width:760px){.cuerpo,.cuerpo.dev,.cuerpo.pres{grid-template-columns:1fr}}
nav.menu{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
nav.menu .grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:14px 10px 6px}
nav.menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:13.5px;color:var(--fg)}
nav.menu button:hover:not(:disabled){background:var(--surface-2)}
nav.menu button[aria-current=true]{background:var(--cel-s);color:var(--accent);font-weight:600}
nav.menu button:disabled{opacity:.45;cursor:default}
nav.menu .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--line)}
nav.menu .dot.n{background:var(--nuevo)} nav.menu .dot.r{background:var(--reest)}
nav.menu .leg{padding:16px 10px 0;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
nav.menu .leg span{display:flex;align-items:center;gap:7px}
main{padding:20px 24px 70px;min-width:0}
aside.dev,aside.pres{background:var(--surface);border-left:1px solid var(--line);padding:18px 18px 40px;min-width:0}
aside.pres{position:sticky;top:56px;align-self:start;max-height:calc(100vh - 56px);overflow:auto}

.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1.t{font-size:23px;font-weight:700;color:var(--accent);letter-spacing:-.01em}
h2.t{font-size:16.5px;font-weight:700;color:var(--accent)}
.hint{color:var(--muted);font-size:13px}
.lead{font-size:14.5px;max-width:76ch}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 17px;min-width:0}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:8px;cursor:pointer;text-decoration:none}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1B2F5E}
.btn.sm{font-size:12.5px;padding:5px 10px}
.btn.lg{font-size:15px;padding:12px 22px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.acciones{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
label.f{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
input[type=text],input[type=number],select,textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:7px;background:var(--surface);color:var(--fg)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)} .c-bad{background:var(--bad-bg);color:var(--bad)} .c-info{background:var(--info-bg);color:var(--info)} .c-mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)} .c-gold{background:var(--gold);color:#1B2F5E}
.box{border-radius:8px;padding:11px 14px;font-size:13.5px}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)} .b-bad{background:var(--bad-bg);color:var(--bad)} .b-info{background:var(--info-bg);color:var(--info)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.pick{cursor:pointer} tr.pick:hover td{background:var(--surface-2)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{font-size:12px;color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;letter-spacing:.04em}
.legend{font-size:12px;color:var(--muted)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.kpi b{display:block;font-size:22px;color:var(--accent);line-height:1.2}
.kpis.dos{grid-template-columns:1fr 1fr}
.kpi b.w{color:var(--warn)} .kpi b.g{color:var(--ok)} .kpi b.b{color:var(--bad)}
.kpi span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--gold)}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.filtros button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.filtros button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}

/* inicio tipo SIIGENO: banda y cuadros */
.banda{background:var(--navy);color:#fff;border-radius:10px;padding:16px 20px;position:relative;overflow:hidden}
.banda::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,#7B3FA0,#D9262C,#F28C28,#F2C230,#2A8F4E,#1F77B4)}
.banda h1{font-size:18px;color:#fff;font-weight:600}
.banda .sub{color:#C9D7EA}
.cuadros{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:16px}
.cuadro{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:118px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.cuadro:hover:not(:disabled){border-color:var(--accent);box-shadow:0 3px 10px rgba(27,47,94,.12)}
.cuadro:disabled{cursor:default;opacity:.55}
.cuadro b{font-size:14px;font-weight:600;color:var(--fg)}
.cuadro .ic{align-self:flex-end;font-size:26px;color:var(--cel);line-height:1}
.cuadro .et{display:block;margin-bottom:6px}
.cuadro.n{border-top:4px solid var(--nuevo)} .cuadro.r{border-top:4px solid var(--reest)}
.cuadro .d{font-size:11.5px;color:var(--muted);margin-top:4px}

/* pasos (trámite) */
.pasos{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.pasos div{flex:1;padding:9px 12px;font-size:12px;border-right:1px solid var(--line);color:var(--muted)}
.pasos div:last-child{border-right:0}
.pasos div b{display:block;font-size:12.5px;color:var(--fg)}
.pasos div.on{background:var(--cel-s)} .pasos div.on b{color:var(--accent)}
.pasos div.ok{color:var(--ok)} .pasos div.ok b{color:var(--ok)}
.opc{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:11px 13px;cursor:pointer}
.opc:hover{border-color:var(--accent)}
.opc[aria-pressed=true]{border-color:var(--accent);background:var(--cel-s)}
.opc b{display:block;font-size:13.5px} .opc .d{display:block;font-size:12px;color:var(--muted)}
.tarjeta{border:1.5px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px;min-height:100%}
.tarjeta.toca{border-color:var(--accent)}
.hoja{border:1px solid var(--line);border-radius:6px;padding:16px 18px;background:var(--surface);font-family:Cambria,Georgia,serif;font-size:13px;line-height:1.7;max-width:62ch}
.hoja .qr{display:inline-block;width:46px;height:46px;background:repeating-linear-gradient(90deg,#1E2634 0 3px,transparent 3px 6px),repeating-linear-gradient(0deg,#1E2634 0 3px,transparent 3px 6px);background-blend-mode:multiply;opacity:.85;vertical-align:middle;margin-right:10px}

/* flujo de estados */
.flujo{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flujo span{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.flujo span.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.flujo i{font-style:normal;color:var(--muted);font-size:11px}
.dev h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.dev h3:first-of-type{margin-top:6px}
.dev ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13px}
.dev .blk{border-left:3px solid var(--bad);padding:6px 10px;background:var(--bad-bg);color:var(--bad);border-radius:0 6px 6px 0;font-size:12.5px;margin-top:6px}
.etiq{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:6px}
.etiq.n{background:var(--nuevo);color:#1B2F5E} .etiq.r{background:var(--reest);color:#0F1C3A} .etiq.x{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* turnero */
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cal .h{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center}
.cal button{border:1.5px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 4px;text-align:center;cursor:pointer;min-height:52px}
.cal button:disabled{opacity:.4;cursor:default;background:var(--surface-2)}
.cal button b{display:block;font-size:14px}
.cal button small{font-size:10.5px;color:var(--muted)}
.cal button.pocos{border-color:var(--gold);background:var(--warn-bg)}
.cal button[aria-pressed=true]{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy) inset}
.horas{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.horas button{border:1.5px solid var(--line);border-radius:7px;background:var(--surface);padding:8px 0;font-weight:600;cursor:pointer}
.horas button:disabled{opacity:.4;cursor:default;background:var(--surface-2);font-weight:400}
.horas button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.cita{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:10px 12px;background:var(--surface)}
.cita.ok{border-left-color:var(--ok);background:var(--ok-bg)} .cita.no{border-left-color:var(--bad);background:var(--bad-bg)} .cita.pasa{border-left-color:var(--gold)} .cita.esp{border-left-color:var(--cel)}
.cita .h{font-weight:700;color:var(--accent)}
.barra{height:8px;border-radius:999px;background:var(--line);overflow:hidden} .barra i{display:block;height:100%;background:var(--ok)}

/* mapa de cobertura */
.mapa{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(280px,1fr);gap:16px;align-items:start}
@media(max-width:900px){.mapa{grid-template-columns:1fr}}
.mapa svg{width:100%;height:auto;max-height:74vh;display:block}
.mapa path{stroke:var(--surface);stroke-width:1.2;cursor:pointer;transition:opacity .15s}
.mapa path:hover{opacity:.8}
.mapa path.sel{stroke:var(--fg);stroke-width:2.4}
.leyenda{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;margin-top:8px}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:16px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.12)}
.esc{display:flex;flex-direction:column;gap:5px}
.esc button{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px;cursor:pointer;font-size:12.5px;text-align:left}
.esc button[aria-pressed=true]{border-color:var(--fg);font-weight:700}
.esc i{width:18px;height:14px;border-radius:3px;flex:0 0 auto;border:1px solid rgba(0,0,0,.12)}
.etapas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.etapas li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:13px}
.etapas li i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:10px}
.etapas li.ok i{border-color:var(--ok);background:var(--ok);color:#fff} .etapas li.on i{border-color:var(--gold);background:var(--gold)} .etapas li.off{color:var(--muted)}

/* verificador */
.verif{max-width:640px}
.resultado{border-radius:12px;padding:16px 18px;border:2px solid}
.resultado.ok{border-color:var(--ok);background:var(--ok-bg)}
.resultado.anu{border-color:var(--warn);background:var(--warn-bg)}
.resultado.no{border-color:var(--bad);background:var(--bad-bg)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;margin-top:10px}
.kv .l{font-size:11.5px;color:var(--muted)} .kv .v{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.costline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.costline .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px}
.total .v{font-size:26px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:66px;z-index:70;background:var(--navy-d);color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;font-weight:600;max-width:calc(100% - 32px)}
iframe.sim{width:100%;height:calc(100vh - 150px);min-height:560px;border:1px solid var(--line);border-radius:10px;background:#fff}

/* presentación */
.pres .paso{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.pres h2{font-size:17px;color:var(--accent);margin:4px 0 10px}
.pres .guion{font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.pres .nav{display:flex;gap:8px;margin-top:14px}
.pres ol.indice{margin:14px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.pres ol.indice button{background:none;border:0;padding:4px 6px;border-radius:6px;cursor:pointer;text-align:left;width:100%;color:var(--muted)}
.pres ol.indice button[aria-current=true]{background:var(--cel-s);color:var(--accent);font-weight:600}
.resp td input,.resp td select{padding:6px 8px;font-size:13px}
.resp td{vertical-align:top}
@media print{.top,nav.menu,aside.dev,aside.pres{display:none} .cuerpo{display:block} main{padding:0}}
</style>
</head>
<body>
<header class="top"><div class="in">

  const c=cod.trim().toUpperCase().replace(/\s/g,""); if(!c) return null;
  const todos=[...S.registro.map(r=>({...r,tipo:"Certificación de copia",asiento:"Registro de certificaciones de copia"})),...S.libro.map(l=>({...l,tipo:"Certificación de firma",doc:l.doc,para:l.org,asiento:"Libro de intervenciones",estado:"valido"})),...S.testimonios.map(t=>({...t,tipo:"Testimonio",org:"Escribanía General de Gobierno",asiento:"Protocolo · Sección A",estado:"valido"})),...S.constancias.map(k=>({n:k.n,fecha:k.firmado,tipo:"Constancia de declaración jurada",doc:`Constancia de cumplimiento · período ${k.periodo}`,org:"Obligado Ley 8198",para:"Repartición / organismo de control",escribana:"FELICIOTTI, E. M.",codigo:k.codigo,asiento:"Protocolo B · acta",estado:"valido"}))];
  const r=todos.find(x=>x.codigo===c); if(r) return {tipo:r.estado==="anulado"?"anu":"ok", r};
  const casi=todos.find(x=>x.codigo===c.replace(/0/g,"O")||x.codigo===c.replace(/O/g,"0")); return {tipo:"no", casi};
}

function cotizar(e){ const c=S.costo, T=TRAM_COSTO[c.tramite], Q=QUIEN[c.quien]; const L=[]; if(!T) return {L,total:0};
  if(T.gratis){ L.push(["Sin tasa",T.gratis,0]); return {L,total:0}; }
  L.push(["Derecho fijo del trámite",`${T.fijo} unidades tributarias`,T.fijo*UT]);
  if(T.foja){ const f=e?e.fojas:4; L.push(["Por foja",`${f} fojas × ${T.foja} UT${e?" — contadas del protocolo":" — estimadas"}`,f*T.foja*UT]); }
  if(c.anios) L.push(["Por año de búsqueda",`${c.anios} × 2 UT`,c.anios*2*UT]);
  let sub=L.reduce((a,l)=>a+l[2],0); if(c.ej>1) L.push(["Ejemplares adicionales",`${c.ej-1} al 50 %`,sub*0.5*(c.ej-1)]);
  sub=L.reduce((a,l)=>a+l[2],0); if(c.urgente) L.push(["Recargo por urgencia","50 %",sub*0.5]);
  L.push(["Emisión digital","Se descarga del portal",0]);
  let total=L.reduce((a,l)=>a+l[2],0); if(Q.ex){ L.push([Q.ex,"Sin la exención habría salido "+pesos(total),-total]); total=0; }
  return {L,total}; }
const panelCosto=(e,titulo)=>{ const c=S.costo, {L,total}=cotizar(e); return `<div class="card stack"><div><span class="eyebrow" style="color:var(--gold)">Costo estimado del trámite</span><h2 class="t">${esc(titulo||"Elegí un trámite")}</h2></div>
  <div class="g2"><div><label class="f" for="cT">Qué trámite</label><select id="cT">${Object.entries(TRAM_COSTO).map(([k,t])=>`<option value="${k}" ${c.tramite===k?"selected":""}>${t.n}</option>`).join("")}</select></div><div><label class="f" for="cQ">Quién lo pide</label><select id="cQ">${Object.entries(QUIEN).map(([k,q])=>`<option value="${k}" ${c.quien===k?"selected":""}>${q.n}</option>`).join("")}</select></div>
    <div><label class="f" for="cEj">Ejemplares</label><select id="cEj">${[1,2,3].map(n=>`<option ${c.ej===n?"selected":""}>${n}</option>`).join("")}</select></div><div><label class="f" for="cAn">Años de búsqueda</label><select id="cAn">${[0,1,2,5,10].map(n=>`<option ${c.anios===n?"selected":""}>${n}</option>`).join("")}</select></div></div>
  <label class="row" style="gap:7px;cursor:pointer"><input type="checkbox" id="cUr" ${c.urgente?"checked":""}> Urgente</label>
  <div>${L.map(l=>`<div class="costline"><span>${esc(l[0])}${l[1]?`<div class="sub">${esc(l[1])}</div>`:""}</span><span class="v">${l[2]<0?"− "+pesos(-l[2]):l[2]===0?"sin cargo":pesos(l[2])}</span></div>`).join("")}
    <div class="total"><span class="eyebrow">Total estimado</span><span class="v">${pesos(total)}</span></div><div class="sub">Equivale a ${Math.round(total/UT)} unidades tributarias · UT de ejemplo: ${pesos(UT)}</div></div>
  <div class="acciones"><button class="btn" type="button" onclick="window.print()">Imprimir presupuesto</button><button class="btn gold" type="button" data-ir="sim">Iniciar el trámite</button></div>
  <div class="box b-warn"><b>Valores de ejemplo.</b> Antes de publicar hay que cargar los valores vigentes de la Ley 11.090 y el valor actual de la Unidad Tributaria.</div></div>`; };
function costoAfter(){ const on=(id,k,f)=>{ const el=$(id); if(el) el.onchange=()=>{ S.costo[k]=f(el); render(); }; }; on("#cT","tramite",el=>el.value); on("#cQ","quien",el=>el.value); on("#cEj","ej",el=>+el.value); on("#cAn","anios",el=>+el.value); on("#cUr","urgente",el=>el.checked); }

      <p class="legend">Si la vigencia está vencida, el pedido se frena acá. La renovación se pide desde el legajo del organismo.</p>`
    :`<div><b>Enviar</b><div class="sub">Revisá y mandalo. Entra directo a la bandeja de la Escribanía.</div></div>

const quienChip=q=>`<span class="chip ${q.includes("organismo")?"c-gold":q.includes("escriban")?"c-info":"c-mute"}">${esc(q)}</span>`;
VISTAS.bandeja=()=>{
  const F=S.filtroExt||"todos";
  const filas=[...S.pedidos.map(p=>({id:p.id,tipo:p.tipo,inic:p.inic||(p.firmante||"Pereyra, Marcela").split("·")[0].trim(),quien:"organismo"+(p.desc?" descentralizado":""),org:p.org,esc:p.docs.length+" doc.",ingreso:p.fecha,estado:p.estado,sigue:p.estado==="enviado"?"Abrir y revisar":p.estado==="en revisión"?"Certificar u observar":p.estado==="observado"?"Esperando al organismo":p.estado==="turno asignado"?"Confrontar / firma el "+(p.turno||""):p.estado==="listo"?"Nada: el organismo descarga":"—",asig:p.estado==="enviado"?"":"Micucci, G.",vip:p})),...S.externos.map(t=>({...t,org:""}))]
    .sort((a,b)=>b.ingreso.split("/").reverse().join("")-a.ingreso.split("/").reverse().join(""))
    .filter(f=>F==="todos"||(F==="nuevos"&&["enviado","nuevo"].includes(f.estado))||(F==="organismos"&&f.vip)||(F==="portal"&&!f.vip)||(F==="turno"&&f.estado==="turno asignado")||(F==="observados"&&["observado","falta algo"].includes(f.estado)));
  const n=e=>S.pedidos.filter(p=>p.estado===e).length;
  const main=`${cab("vip","Bandeja externa","Lo que inicia alguien de afuera por el portal: ciudadanos, escribanos y organismos públicos. Lo que antes llegaba por expediente digital, mail o teléfono ahora tiene una sola puerta. Los expedientes internos van en otra bandeja.","Gestión interna")}
    <div class="kpis"><div class="kpi"><b>${n("enviado")+S.externos.filter(x=>x.estado==="nuevo").length}</b><span>sin abrir</span></div><div class="kpi"><b>${n("en revisión")+S.externos.filter(x=>x.estado==="en revisión").length}</b><span>en revisión</span></div><div class="kpi"><b class="w">${n("observado")+S.externos.filter(x=>x.estado==="falta algo").length}</b><span>observados</span></div><div class="kpi"><b>${S.pedidos.reduce((a,p)=>a+(["enviado","en revisión"].includes(p.estado)?p.docs.length:0),0)}</b><span>documentos en cola</span></div></div>
    <div class="spread" style="margin:14px 0 8px"><div class="filtros">${[["todos","Todos"],["nuevos","Nuevos"],["portal","Ciudadanos y escribanos"],["organismos","Organismos"],["observados","Observados"],["turno","Con turno"]].map(f=>`<button type="button" data-fe="${f[0]}" aria-pressed="${F===f[0]}">${f[1]}</button>`).join("")}</div><button class="btn sm" type="button" data-ir="sim">Abrir la bandeja completa en el simulador ↗</button></div>
    <div class="tablewrap"><table><thead><tr><th>Trámite</th><th>Iniciador</th><th>Ingresó</th><th>Estado</th><th>Qué sigue</th><th>Asignado</th><th></th></tr></thead><tbody>

        <td style="text-align:right">${f.vip?`<button class="btn sm pri" type="button" data-abrir="${f.id}">Abrir</button>`:`<span class="sub">en el simulador</span>`}</td></tr>`).join("")}</tbody></table></div>
    ${S.pedidoAbierto?fichaPedido(S.pedidos.find(p=>p.id===S.pedidoAbierto)):""}`;
  return {main, dev:devPanel({p:"vip",estados:flujo(["enviado","en revisión","observado","turno asignado","listo","entregado"],"en revisión"),reglas:["Dos bandejas, sí o sí: externa (portal) e interna (expedientes SUAC). Cada fila dice quién inició, con nombre y apellido, y cuándo.","Misma ficha para todos los pedidos externos: asignar, controlar, observar, hoja de ruta. Para organismos, la observación es por documento y no hay pago.","La escribana asigna; el auxiliar trabaja lo asignado."]}),
    after(){ document.querySelectorAll("[data-fe]").forEach(b=>b.onclick=()=>{ S.filtroExt=b.dataset.fe; render(); }); document.querySelectorAll("[data-abrir]").forEach(b=>b.onclick=()=>{ S.pedidoAbierto=b.dataset.abrir; render(); $("#ficha")?.scrollIntoView({behavior:"smooth"}); }); fichaAfter(); }};
};
const fichaPedido=p=>`<div class="card stack" id="ficha" style="margin-top:14px;border-color:var(--navy)"><div class="spread"><div><span class="eyebrow">Pedido ${p.id} · ${esc(p.org)}${p.desc?" · descentralizado":""}</span><h2 class="t">${esc(p.tipo)}</h2><div class="sub">Para ${esc(p.para)} · ingresó ${p.fecha}${p.firmante?" · firma "+esc(p.firmante):""}${p.turno?" · turno "+esc(p.turno):""}</div></div><div class="row">${chipEstado(p.estado)}<button class="btn sm" type="button" id="cerrarFicha">Cerrar</button></div></div>
  <div class="tablewrap"><table><thead><tr><th>Documento</th><th>Origen</th><th>Control</th><th></th></tr></thead><tbody>${p.docs.map((d,i)=>`<tr><td><b>${esc(d.n)}</b></td><td>${d.o==="papel"?`<span class="chip c-warn">papel · confrontar</span>`:`<span class="chip c-info">nació digital</span>`}</td><td>${d.obs?`<span class="chip c-warn">observado</span> <span class="sub">${esc(d.obs)}</span>`:d.ok?`<span class="chip c-ok">controlado</span>`:`<span class="sub">sin controlar</span>`}</td><td style="text-align:right;white-space:nowrap">${["listo","entregado"].includes(p.estado)?"":`<button class="btn sm" type="button" data-okdoc="${i}">Está bien</button> <button class="btn sm" type="button" data-obsdoc="${i}">Observar</button>`}</td></tr>`).join("")}</tbody></table></div>
  ${["listo","entregado"].includes(p.estado)?`<div class="box b-ok">Certificado y asentado: ${(p.registro||[]).join(", ")}. El organismo ya lo puede descargar desde «Mis certificaciones».</div>`:
    `<div class="acciones"><button class="btn" type="button" id="asignar">${p.asig?"Reasignar":"Asignar a Micucci, G."}</button><button class="btn gold" type="button" id="certificar" ${p.docs.every(d=>d.ok)&&S.eggComo==="esc"?"":"disabled"} title="${S.eggComo==="esc"?"Todos los documentos controlados → certificar":"Solo la escribana certifica"}">${p.tipo==="Certificación de firma"?"Firmó ante mí: asentar en el libro":"Certificar y asentar"}</button></div>
    <p class="legend">${S.eggComo==="esc"?"Para certificar, cada documento tiene que estar controlado.":"Como auxiliar podés controlar y observar; certifica la escribana."}</p>`}</div>`;
function fichaAfter(){ const p=S.pedidos.find(x=>x.id===S.pedidoAbierto); if(!p) return; const c=$("#cerrarFicha"); if(c) c.onclick=()=>{ S.pedidoAbierto=null; render(); };
  document.querySelectorAll("[data-okdoc]").forEach(b=>b.onclick=()=>{ const d=p.docs[+b.dataset.okdoc]; d.ok=true; delete d.obs; if(p.estado==="enviado") p.estado="en revisión"; render(); });
  document.querySelectorAll("[data-obsdoc]").forEach(b=>b.onclick=()=>{ const d=p.docs[+b.dataset.obsdoc]; d.obs="No se lee completo: reemplazar el archivo"; d.ok=false; p.estado="observado"; toast("Observado solo ese documento. El organismo lo ve en Mis pedidos y lo reemplaza."); render(); });
  const a=$("#asignar"); if(a) a.onclick=()=>{ p.asig="Micucci, G."; if(p.estado==="enviado") p.estado="en revisión"; toast("Asignado a Micucci, G."); render(); };
  const z=$("#certificar"); if(z) z.onclick=()=>{ certificarPedido(p); render(); }; }
function certificarPedido(p){ const f=fF(hoy); p.registro=[];
  if(p.tipo==="Certificación de firma"){ const n=`${413+S.libro.length-1}/2026`; const codigo=codigoNuevo(); S.libro.unshift({n,fecha:f,escribana:"ASSAAD, M. A.",org:p.org,comp:p.firmante||"—",doc:p.docs.map(d=>d.n).join(" · "),codigo}); p.registro.push("libro "+n); }
  else p.docs.forEach(d=>{ const n=`2026-${++seq}`; S.registro.unshift({n,fecha:f,org:p.org,doc:d.n,origen:d.o==="papel"?"Papel":"Digital",para:p.para,escribana:"ASSAAD, M. A.",codigo:codigoNuevo(),estado:"valido",fojas:3+(d.n.length%5)}); p.registro.push(n); });
  p.estado="listo"; toast(`Asentado: ${p.registro.join(", ")}. Ya se puede verificar con el código.`); }

  <p class="legend" style="margin-top:8px">El alta de escrituras sociales (Documentación → Actos → Partes → Objetos → Relación y minuta de protocolo) queda como está hoy: se rediseña más adelante. Lo que se termina ahora es la certificación de firma de funcionarios y la de copia.</p>`,

    :(esFirma&&P===4)||(esCopia&&P===3)?`<div><b>Documentos</b><div class="sub">${esFirma?"Lo que firma el funcionario ante la escribana.":"De cada uno: si nació digital se resuelve entero acá; si está en papel hay que confrontarlo con el original."}</div></div>

      <div><button class="btn sm" type="button" id="tmas">Agregar otro documento</button></div>`
    :esCopia&&P===2?`<div><b>Organismo o solicitante</b><div class="sub">Quién pide la certificación. Si es un organismo, se elige por CUIT y queda vinculado a su legajo.</div></div>
      <div class="g2"><div><label class="f" for="orgSel">Organismo</label><select id="orgSel"><option value="">Un particular o una repartición sin legajo</option>${S.organismos.map(x=>`<option value="${x.cuit}" ${T.cuit===x.cuit?"selected":""}>${esc(x.n)} · ${x.cuit}</option>`).join("")}</select></div><div><label class="f" for="tpara">Se expide para</label><input type="text" id="tpara" value="${esc(T.para||"")}" placeholder="IPJ, ARCA, Registro General…"></div></div>`
    :esFirma&&P===5?`<div><b>Firma presencial</b><div class="sub">El funcionario firma frente a la escribana. Si no está en la Escribanía, se le asigna turno y el trámite queda esperando sin volver a la bandeja.</div></div>
      <div class="kv"><div><div class="l">Firma</div><div class="v">${esc(func?func.n:"—")}</div></div><div><div class="l">Cargo</div><div class="v">${esc(func?func.cargo:"—")}</div></div><div><div class="l">Acredita con</div><div class="v">${esc(func?(func.res||"alta confirmada por la Escribanía"):"—")}</div></div><div><div class="l">Documentos</div><div class="v">${T.docs.filter(d=>d.n).map(d=>esc(d.n)).join(" · ")||"—"}</div></div></div>
      <div class="row"><button class="opc" type="button" id="firmoAhora" aria-pressed="${T.firmo}"><span><b>Firmó ante mí, ahora</b><span class="d">La escribana da fe de la firma puesta en su presencia.</span></span></button><button class="opc" type="button" id="turnoLuego" aria-pressed="${T.turnoLuego||false}"><span><b>Asignar turno</b><span class="d">Viernes 9 · 11:00. El trámite queda «turno asignado».</span></span></button></div>`
    :esCopia&&P===4?`<div><b>Confrontar y certificar</b><div class="sub">Los que están en papel se confrontan con el original. Después la escribana certifica con firma digital: el sistema arma la hoja de certificación, que funciona igual que la presencial.</div></div>
      ${T.docs.filter(d=>d.n).map((d,i)=>`<div class="spread" style="border-top:1px solid var(--line);padding-top:8px"><div><b>${esc(d.n)}</b><div class="sub">${d.o==="papel"?"En papel: confrontado con el original":"Nació digital: se verificó la firma del archivo"}</div></div>${d.o==="papel"?`<button class="btn sm" type="button" data-conf="${i}" aria-pressed="${d.conf||false}">${d.conf?"✓ Confrontado":"Confrontar con el original"}</button>`:`<span class="chip c-ok">verificado</span>`}</div>`).join("")}
      <div class="box b-info"><b>Disclaimer de la certificación.</b> Se certifica que la copia es fiel al original, no el contenido ni la validez del documento.</div>`
    :`<div><b>Asiento y entrega</b></div>${T.hecho?`<div class="box b-ok"><b>Listo.</b> ${esFirma?`Asentado en el libro de intervenciones con el N° <b>${esc(T.hecho.n)}</b>.`:`Asentado en el registro de certificaciones: <b>${T.hecho.map(h=>h.n).join(", ")}</b>.`} Documento emitido con código de verificación. El trámite queda finalizado en la bandeja interna.</div>
      ${esFirma?`<div class="hoja"><b>ESCRIBANÍA GENERAL DE GOBIERNO · CERTIFICACIÓN DE FIRMA</b><br>CERTIFICO que la firma que antecede, puesta en mi presencia en <b>${T.docs.filter(d=>d.n).map(d=>esc(d.n)).join(" · ")}</b>, pertenece a <b>${esc(func.n)}</b>, ${esc(func.cargo)} de ${esc(o.n)}, quien acredita el cargo con ${esc(func.res||"la designación confirmada en el legajo del organismo")}. Libro de intervenciones N° ${esc(T.hecho.n)}.<br>Córdoba, ${fF(hoy)}. Esc. María Amelia ASSAAD · Escribana General de Gobierno.<br><span class="qr"></span><span class="sub">Verificación <b class="mono">${esc(T.hecho.codigo)}</b> · siigeno.cba.gov.ar/verificar</span></div>`:T.hecho.map(h=>hojaCert(h)).join("<br>")}
      <div class="acciones"><button class="btn" type="button" data-ir="registros">Ver el asiento</button><button class="btn" type="button" id="verCod">Verificar el código</button><button class="btn pri" type="button" data-ir="bandeja-int">Volver a la bandeja interna</button></div>`
      :`<div class="kv"><div><div class="l">Trámite</div><div class="v">${esc(LINEAS_INTERNAS[T.linea])}</div></div><div><div class="l">${esFirma?"Firma":"Para"}</div><div class="v">${esc(esFirma?(func?func.n:"—"):(o?o.n:"particular")+" → "+(T.para||"—"))}</div></div><div><div class="l">Documentos</div><div class="v">${T.docs.filter(d=>d.n).map(d=>esc(d.n)).join(" · ")}</div></div><div><div class="l">Escribana</div><div class="v">ASSAAD, M. A.</div></div></div>
      <div class="acciones"><button class="btn gold lg" type="button" id="asentar" ${S.eggComo==="esc"?"":"disabled"} title="${S.eggComo==="esc"?"":"Solo la escribana asienta y firma"}">${esFirma?"Asentar en el libro y emitir":"Certificar con firma digital y asentar"}</button></div>${S.eggComo==="esc"?"":`<p class="legend">Como auxiliar preparás todo; la escribana firma y asienta.</p>`}`}`}
    <div class="acciones">${P>1&&!T.hecho?`<button class="btn" type="button" id="tAtras">Anterior</button>`:""}${P<pasos.length&&!T.hecho?`<button class="btn pri" type="button" id="tSig" ${(P===1&&!T.asunto.trim())||(esFirma&&P===2&&!o)||(esFirma&&P===3&&T.func==null)||(esFirma&&P===5&&!T.firmo&&!T.turnoLuego)||(esCopia&&P===4&&T.docs.some(d=>d.n&&d.o==="papel"&&!d.conf))?"disabled":""}>${P===pasos.length-1?"Continuar al asiento":"Continuar"}</button>`:""}${otro&&P===2?`<button class="btn pri" type="button" data-ir="bandeja-int">Cargar y seguir en SIIGENO actual</button>`:""}</div></div>`;
  return {main, dev:devPanel({p:"vip",estados:flujo(esFirma?["cargado","firmante elegido","documentos","firma presencial / turno","asentado y emitido"]:["cargado","documentos","confrontado","certificado y asentado"],"documentos"),reglas:["La pestaña del ministerio por CUIT vive de los dos lados: el organismo la ve como legajo; la Escribanía la confirma.","Alta de funcionario: con resolución si la hay; si no, igual.","Cert. de firma → libro de intervenciones (N°/año, por escribana). Cert. de copia → registro de certificaciones (2026-NNNN) con la hoja de certificación digital y el archivo guardado.","«Cargar trámite» no vuelve a la bandeja: se termina todo."]}),
    after(){ const a=$("#asu"); if(a) a.oninput=()=>{ T.asunto=a.value; const sg=$("#tSig"); if(sg) sg.disabled=!a.value.trim(); }; const l=$("#lin"); if(l) l.onchange=()=>{ T.linea=+l.value; T.paso=1; render(); };
      const c=$("#cuit"); if(c) c.oninput=()=>{ T.cuit=c.value.trim(); if(S.organismos.some(x=>x.cuit===T.cuit)){ T.func=null; render(); } }; const os=$("#orgSel"); if(os) os.onchange=()=>{ T.cuit=os.value; T.func=null; render(); }; const tp=$("#tpara"); if(tp) tp.oninput=()=>T.para=tp.value;
      document.querySelectorAll("[data-func]").forEach(b=>b.onclick=()=>{ T.func=+b.dataset.func; render(); }); const af=$("#altaFunc"); if(af) af.onclick=()=>{ const v=$("#nfn").value.trim(); if(!v){ toast("Escribí nombre y cargo."); return; } const [n,cg]=v.split("·").map(s=>s.trim()); o.func.push({n,cargo:cg||"(cargo)",res:$("#nfr").value.trim(),hasta:"31/12/2027",vig:true}); T.func=o.func.length-1; toast("Funcionario dado de alta en el legajo del organismo."); render(); };
      document.querySelectorAll("[data-tdoc]").forEach(i=>i.oninput=()=>{ T.docs[+i.dataset.tdoc].n=i.value; }); document.querySelectorAll("[data-torig]").forEach(s=>s.onchange=()=>{ T.docs[+s.dataset.torig].o=s.value; }); document.querySelectorAll("[data-tq]").forEach(b=>b.onclick=()=>{ T.docs.splice(+b.dataset.tq,1); render(); }); const m=$("#tmas"); if(m) m.onclick=()=>{ T.docs.push({n:"",o:"digital"}); render(); };
      const fa=$("#firmoAhora"); if(fa) fa.onclick=()=>{ T.firmo=true; T.turnoLuego=false; render(); }; const tl=$("#turnoLuego"); if(tl) tl.onclick=()=>{ T.turnoLuego=true; T.firmo=false; render(); };
      document.querySelectorAll("[data-conf]").forEach(b=>b.onclick=()=>{ const d=T.docs.filter(x=>x.n)[+b.dataset.conf]; d.conf=!d.conf; render(); });
      const at=$("#tAtras"); if(at) at.onclick=()=>{ T.paso--; render(); }; const sg=$("#tSig"); if(sg) sg.onclick=()=>{ if(esFirma&&P===5&&T.turnoLuego){ S.internos.unshift({id:String(20261600+S.internos.length),nota:"0045-00"+(3400+S.internos.length)+"/2026",tipo:LINEAS_INTERNAS[0],asunto:T.asunto,inic:o.n,ingreso:fF(hoy),estado:"turno asignado",asig:"Micucci, G.",prioridad:"media",nuevo:true}); toast("Turno asignado: viernes 9 · 11:00. El trámite espera la firma sin volver a la bandeja."); S.tramite=null; ir("bandeja-int"); return; } T.paso++; render(); };
      const z=$("#asentar"); if(z) z.onclick=()=>{ const f=fF(hoy); const docs=T.docs.filter(d=>d.n.trim());
        if(esFirma){ const n=`${413+S.libro.length-1}/2026`, codigo=codigoNuevo(); S.libro.unshift({n,fecha:f,escribana:"ASSAAD, M. A.",org:o.n,comp:func.n,doc:docs.map(d=>d.n).join(" · "),codigo}); T.hecho={n,codigo}; }
        else { T.hecho=docs.map(d=>{ const n=`2026-${++seq}`; const r={n,fecha:f,org:o?o.n:"Particular",doc:d.n,origen:d.o==="papel"?"Papel":"Digital",para:T.para||"—",escribana:"ASSAAD, M. A.",codigo:codigoNuevo(),estado:"valido",fojas:3+(d.n.length%5)}; S.registro.unshift(r); return r; }); }
        S.internos.unshift({id:String(20261600+S.internos.length),nota:"0045-00"+(3400+S.internos.length)+"/2026",tipo:LINEAS_INTERNAS[T.linea],asunto:T.asunto,inic:o?o.n:"Particular",ingreso:f,estado:"finalizado",asig:"Micucci, G.",prioridad:"media",nuevo:true}); render(); };
      const vc=$("#verCod"); if(vc) vc.onclick=()=>{ const cod=esFirma?T.hecho.codigo:T.hecho[0].codigo; S.verCodigo=cod; S.verRes=verificar(cod); S.tramite=null; ir("verif"); }; }};
};

/* ==================================================================
   ESCRIBANÍA · 1 · DDJJ: bandeja de actas y día de firmas
   ================================================================== */
const EST_ACTA=["recibida","armada","revisada","impresa","citada","firmada"];
const ddjjTabs=k=>`<div class="tabs">${[["ddjj-int","Bandeja de actas"],["ddjj-firmas","Día de firmas · martes 6"]].map(t=>`<button type="button" role="tab" data-ir="${t[0]}" aria-selected="${k===t[0]}">${t[1]}</button>`).join("")}</div>`;
VISTAS["ddjj-int"]=()=>{ const F=S.filtroActa||"todas"; const A=S.actas.filter(a=>F==="todas"||(F==="sin"&&!a.turno)||(F==="martes"&&a.turno.startsWith("Mar 6"))||(F==="anular"&&a.estado==="no se presentó"));
  const main=`${cab("turnero","Declaraciones juradas — Ley 8198 · Protocolo B","Vista interna. Es un ACTA, no una escritura: art. 6 de la Ley 8198, numeración propia. Hay un equipo que controla el acta antes de imprimir; imprimen Patricia y Ariel, que rotan.","Gestión interna · "+(S.eggComo==="esc"?"escribana":"auxiliar"))}${ddjjTabs("ddjj-int")}
    <div class="kpis"><div class="kpi"><b>${S.actas.length+5}</b><span>llegaron de SISCAE</span></div><div class="kpi"><b>${S.actas.filter(a=>["recibida","armada"].includes(a.estado)).length}</b><span>por revisar</span></div><div class="kpi"><b>${S.actas.filter(a=>a.turno.startsWith("Mar 6")).length}</b><span>citadas al martes</span></div><div class="kpi"><b class="g">128</b><span>firmadas este año</span></div><div class="kpi"><b class="b">${S.actas.filter(a=>a.estado==="no se presentó").length}</b><span>por anular</span></div></div>
    <div class="box b-warn" style="margin:12px 0"><b>Para el martes 6 hay que tener ${S.actas.filter(a=>a.turno.startsWith("Mar 6")).length} actas impresas.</b> ${S.actas.filter(a=>a.estado==="impresa"&&a.turno.startsWith("Mar 6")).length} ya están listas, ${S.actas.filter(a=>["revisada","armada"].includes(a.estado)&&a.turno.startsWith("Mar 6")).length} esperan revisión o impresión. Patricia y Ariel imprimen el lunes a la tarde.</div>
    <div class="spread" style="margin-bottom:8px"><b>En curso</b><div class="row"><div class="filtros">${[["todas","Todas"],["sin","Sin turno"],["martes","Citadas al martes"],["anular","Por anular"]].map(f=>`<button type="button" data-fa="${f[0]}" aria-pressed="${F===f[0]}">${f[1]}</button>`).join("")}</div><button class="btn sm" type="button" id="extra">Abrir día extra</button></div></div>
    <div class="tablewrap"><table><thead><tr><th>Obligado</th><th>Llegó de SISCAE</th><th>Estado del acta</th><th>Turno</th><th style="text-align:right">Acción</th></tr></thead><tbody>
      ${A.map(a=>`<tr ${a.nuevo?'style="background:var(--warn-bg)"':""}><td><b>${esc(a.nombre)}</b><div class="sub">${esc(a.cargo)}</div></td><td class="num">${a.llego}</td><td>${a.estado==="no se presentó"?chipEstado("no se presentó"):a.estado==="firmada"?chipEstado("firmada"):`<span class="chip ${a.estado==="impresa"?"c-ok":"c-info"}">${a.estado==="armada"?"acta armada":esc(a.estado)}</span>`}</td><td class="${a.turno?"num":""}">${a.turno?esc(a.turno):`<span style="color:var(--warn);font-weight:600">sin turno</span>`}${a.estado==="no se presentó"?"":""}</td>
        <td style="text-align:right">${a.estado==="no se presentó"?`<button class="btn sm" type="button" data-anular="${a.id}" ${S.eggComo==="esc"?"":"disabled"} style="color:var(--bad)">Anular</button>`:a.estado==="impresa"||a.estado==="citada"?`<button class="btn sm" type="button">Ver acta</button>`:a.estado==="firmada"?`<span class="sub">constancia disponible</span>`:`<button class="btn sm pri" type="button" data-av="${a.id}">${a.estado==="recibida"?"Armar acta":a.estado==="armada"?"Revisar":"Imprimir"}</button>${a.turno?"":` <button class="btn sm" type="button" data-turnoMano="${a.id}">Dar turno</button>`}`}</td></tr>`).join("")}</tbody></table></div>`;
  return {main, dev:devPanel({p:"turnero",estados:flujo(EST_ACTA,"impresa")+`<p class="legend">Ramal: anulada (no se presentó; la anula la escribana).</p>`,reglas:["Recibida → armada → revisada → impresa → citada → firmada o anulada.","El auxiliar arma, revisa e imprime; la escribana marca la firma y anula.","La Escribanía puede dar o mover un turno a mano, y abrir días extra para noviembre y diciembre (art. 4)."]}),
    after(){ document.querySelectorAll("[data-fa]").forEach(b=>b.onclick=()=>{ S.filtroActa=b.dataset.fa; render(); }); document.querySelectorAll("[data-av]").forEach(b=>b.onclick=()=>{ const a=S.actas.find(x=>String(x.id)===b.dataset.av); a.estado=EST_ACTA[EST_ACTA.indexOf(a.estado)+1]; render(); });
      document.querySelectorAll("[data-anular]").forEach(b=>b.onclick=()=>{ const a=S.actas.find(x=>String(x.id)===b.dataset.anular); a.estado="anulada"; a.turno=""; toast("Acta anulada: no cumplimentó el trámite. Tiene que sacar turno de nuevo."); render(); });
      document.querySelectorAll("[data-turnoMano]").forEach(b=>b.onclick=()=>{ const a=S.actas.find(x=>String(x.id)===b.dataset.turnoMano); a.turno="Vie 9 · 12:30"; toast("Turno cargado a mano por la Escribanía. El obligado lo ve en su página."); render(); });
      $("#extra").onclick=()=>{ const d="14/10/2026"; if(!S.extras.includes(d)) S.extras.push(d); toast("Día extra abierto: miércoles 14 de octubre. Ya se ofrece en el turnero."); }; }};
};
VISTAS["ddjj-firmas"]=()=>{ const cit=S.actas.filter(a=>a.turno.startsWith("Mar 6")); const J=S.jornada; const firm=cit.filter(a=>J[a.id]==="firmó").length, nov=cit.filter(a=>J[a.id]==="no vino").length; const pasando=cit.find(a=>!J[a.id]);
  const main=`${cab("turnero","Martes 6 de octubre · día de firmas","El personal marca a cada uno cuando pasa. Al marcar la firma, la constancia queda disponible para el obligado automáticamente. El que no viene: el acta se anula, lo hace la escribana.","Gestión interna · "+(S.eggComo==="esc"?"Esc. FELICIOTTI, Estela María":"auxiliar"))}${ddjjTabs("ddjj-firmas")}
    <div class="g2" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)"><div class="stack">
      <div class="kpis" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><b>${cit.length}</b><span>citados</span></div><div class="kpi"><b class="g">${firm}</b><span>firmaron</span></div><div class="kpi"><b>${cit.length-firm-nov}</b><span>por venir</span></div></div>
      <div class="card stack"><div class="spread"><b>Los citados de hoy</b><span class="sub">Marcá a cada uno cuando pasa</span></div>
        ${cit.map(a=>{ const st=J[a.id]; const cls=st==="firmó"?"ok":st==="no vino"?"no":a===pasando?"pasa":"esp"; return `<div class="cita ${cls}"><span class="h">${esc(a.turno.split("· ")[1]||"")}</span><div><b>${esc(a.nombre)}</b><div class="sub">Acta ${a.acta||"—"} · ${esc(a.cargo.split("·").pop().trim())} · período 2026</div></div><div class="row">${st==="firmó"?`<span class="chip c-ok">firmó</span><span class="sub">constancia mañana</span>`:st==="no vino"?`<span class="chip c-bad">no vino</span><span class="sub">acta a anular</span>`:a===pasando?`<span class="chip c-warn">pasando</span><button class="btn sm pri" type="button" data-firmo="${a.id}" ${S.eggComo==="esc"?"":"disabled"}>Firmó</button><button class="btn sm" type="button" data-novino="${a.id}" ${S.eggComo==="esc"?"":"disabled"}>No vino</button>`:`<span class="chip c-info">esperando</span>`}</div></div>`; }).join("")}
        <div class="spread" style="border-top:1px solid var(--line);padding-top:10px"><span class="sub">Al cerrar la jornada, las constancias quedan disponibles para los que firmaron y las actas de los ausentes pasan a anulación.</span><button class="btn" type="button" id="cerrarJ" ${pasando||S.jornadaCerrada?"disabled":""}>${S.jornadaCerrada?"Jornada cerrada":"Cerrar la jornada"}</button></div></div></div>
    <div class="stack"><div class="card"><b>Lo que falta hoy</b><div class="sub">Faltan ${cit.length-firm-nov} por pasar. El último turno es a las 13:00.</div><div class="barra" style="margin-top:8px"><i style="width:${Math.round(firm/cit.length*100)}%"></i></div><div class="sub">${firm} de ${cit.length} firmados</div></div>
      <div class="card"><b>Próximo día de firmas</b><div class="sub">Viernes 9 de octubre · ${S.actas.filter(a=>a.turno.startsWith("Vie 9")).length} citados hasta ahora, ${10-S.actas.filter(a=>a.turno.startsWith("Vie 9")).length} lugares libres.</div><button class="btn sm" type="button" data-ir="ddjj-int" style="margin-top:8px">Ver el turnero completo</button></div>
      <div class="card"><b>Cupo del año</b><div class="sub">Con martes y viernes a 10 por día hay unos 1.040 turnos al año. Llevan 128 firmadas.</div><div class="box b-warn" style="margin-top:8px;padding:8px 10px">En noviembre y diciembre se junta el cierre anual del artículo 4. Conviene abrir días extra antes de que se llene.</div></div></div></div>`;
  return {main, dev:devPanel({p:"turnero",reglas:["Se marca durante la jornada, uno por uno. «Firmó» dispara la constancia; «no vino» manda el acta a anulación.","Atiende generalmente Estela; Amelia en casos importantes. La agenda tiene dos escribanas.","Solo la escribana marca la firma y anula."]}),
    after(){ document.querySelectorAll("[data-firmo]").forEach(b=>b.onclick=()=>{ S.jornada[b.dataset.firmo]="firmó"; const a=S.actas.find(x=>String(x.id)===b.dataset.firmo); a.estado="firmada"; toast("Firmó. La constancia ya queda disponible para el obligado."); render(); }); document.querySelectorAll("[data-novino]").forEach(b=>b.onclick=()=>{ S.jornada[b.dataset.novino]="no vino"; const a=S.actas.find(x=>String(x.id)===b.dataset.novino); a.estado="no se presentó"; render(); });
      $("#cerrarJ").onclick=()=>{ S.jornadaCerrada=true; cit.forEach(a=>{ if(S.jornada[a.id]==="firmó"&&!S.constancias.some(c=>c.id===a.id)) S.constancias.unshift({id:a.id,periodo:2026,n:"2026-0"+(430+a.id),cargada:a.llego,firmado:"06/10/2026",codigo:"EGG7-2026-0"+(430+a.id)+"-C1"}); }); toast("Jornada cerrada. Constancias disponibles; actas de ausentes a anulación."); render(); }; }};
};

/* ==================================================================
   ESCRIBANÍA · 2 · Registros y Organismos
   ================================================================== */
VISTAS.registros=()=>({main:`${cab("vip","Registros de la Escribanía","El libro de intervenciones, que espeja el físico, y el registro de certificaciones de copia, que hoy no existe. Lo que se asienta acá es lo que responde el verificador.","Gestión interna")}

VISTAS.buscador=()=>{

  const e=S.escSel!=null?ESCRITURAS.find(x=>x.n===S.escSel):null;
  const main=`${cab("buscador","Buscar en el protocolo digitalizado","Corre en la red interna: el protocolo no sale a internet. Busca por lo que uno tiene a mano y estima el costo: las fojas salen del protocolo, no hay que contarlas a mano.","Gestión interna · protocolo de la Escribanía")}
    <div class="kpis"><div class="kpi"><b>48.312</b><span>escrituras indexadas</span></div><div class="kpi"><b>1908 – 2026</b><span>período cubierto</span></div><div class="kpi"><b>6</b><span>campos de búsqueda</span></div><div class="kpi"><b>0,4 s</b><span>tiempo de respuesta</span></div></div>

      <div class="card stack"><div><b>Buscar</b><div class="sub">Alcanza con un dato. Si tenés varios, el resultado se afina solo.</div></div><div class="filtros">${[["cuenta","Cuenta tributaria"],["nom","Nomenclatura catastral"],["mat","Matrícula"],["ape","Apellido y nombre"],["num","N° de escritura"],["txt","Texto libre"]].map(c=>`<button type="button" data-campo="${c[0]}" aria-pressed="${S.campo===c[0]}">${c[1]}</button>`).join("")}</div>
        <div class="row" style="flex-wrap:nowrap"><input type="text" id="bq" value="${esc(S.busq)}" placeholder="Probá: 1301 2345678 9 · GÓMEZ · 1.845.221 · 402" autocomplete="off"><button class="btn pri" type="button">Buscar</button></div></div>
      <div class="card stack"><div class="spread"><b>${res.length} escrituras encontradas</b><span class="sub">Ordenadas de la más reciente a la más antigua</span></div>
        ${res.slice().sort((a,b)=>b.anio-a.anio).map(x=>`<button class="opc" type="button" data-esc="${x.n}" aria-pressed="${S.escSel===x.n}"><span style="min-width:64px"><b style="font-size:17px;color:var(--accent)">${x.n}</b><span class="d">${x.sec==="B"?"PROTOCOLO B":"SECCIÓN "+x.sec}</span></span><span style="flex:1"><b>${esc(x.acto)}</b><span class="d">${x.fecha} · ${esc(x.escribana)} · ${esc(x.loc)}</span><span class="d">Cuenta ${x.cuenta} · Matrícula ${x.matricula} · ${x.nom} · ${esc(x.partes)}</span></span><span class="chip ${x.tag==="INSCRIPTA"?"c-ok":x.tag==="PROTOCOLO B"?"c-warn":"c-info"}">${x.tag}</span></button>`).join("")||`<p class="sub">Sin resultados.</p>`}
        <div class="box b-info"><b>Por qué sirve.</b> Hoy, para encontrar una escritura por cuenta o nomenclatura hay que ir al archivo y revisar a mano. Todo el protocolo está digitalizado: esto lo convierte en algo consultable.</div></div></div>
    <div class="stack">${panelCosto(e,e?`Escritura ${e.n}, ${e.sec==="B"?"Protocolo B":"Sección "+e.sec}`:"Elegí una escritura")}${e?`<div class="box b-ok">Las fojas salen del protocolo: ${e.fojas} fojas, contadas. <button class="link" type="button" style="color:inherit">Ver la escritura</button></div>`:""}</div></div>`;
  return {main, dev:devPanel({p:"buscador",reglas:["Interno: todo el protocolo, con el contenido. Externo: solo si existe y cuánto sale.","Busca por cuenta tributaria, nomenclatura catastral, matrícula, apellido y nombre, número de escritura y texto libre; con año desde/hasta.","Base: el protocolo digitalizado y su relevamiento, sin exposición externa."]}),
    after(){ const bq=$("#bq"); bq.oninput=()=>{ S.busq=bq.value; const p=bq.selectionStart; render(); const n=$("#bq"); n.focus(); try{ n.setSelectionRange(p,p);}catch(_){} }; document.querySelectorAll("[data-campo]").forEach(b=>b.onclick=()=>{ S.campo=b.dataset.campo; render(); }); document.querySelectorAll("[data-esc]").forEach(r=>r.onclick=()=>{ S.escSel=+r.dataset.esc; render(); }); costoAfter(); }};
};

  {t:"6 · La consulta del vecino", rol:"pub", v:"mapa-dni", g:["El vecino pone su DNI (probá 33.456.789) y ve en qué etapa está su escritura, en lenguaje de persona.","Elige cómo quiere que le avisen. Hoy llama o va a preguntar."]},
  {t:"4 · Verificador (reestructuración)", rol:"pub", v:"verif", g:["Ya existe. Se reordena: código o QR al pie, tres respuestas: válido, anulado con motivo, inexistente.","Probá los cuatro casos. Responde con lo que la Escribanía registró al emitir.","Todo lo que sale de SIIGENO lleva código: certificaciones, testimonios, constancias."]},
  {t:"3 · Simulador de costos (público)", rol:"pub", v:"costos", g:["Cuánto sale antes de iniciar. Valores de ejemplo: faltan los de la Ley 11.090 y la UT vigente.","Las exenciones van a cero mostrando cuánto habría salido. Una sola pantalla, enlazada desde el armador y el superbuscador.","«Iniciar el trámite» pide CiDi y lleva al armador."]},
  {t:"Requirente: el inicio real", rol:"ciu", v:"inicio", g:["Los cinco cuadros de siempre quedan. Según el perfil se suma uno más.","Nuevos trámites y Mis trámites son el armador: ya está desarrollado en SIGEC y probado con Gina."]},
  {t:"5 · Armador (ya en SIGEC)", rol:"ciu", v:"sim", g:["Adentro está el simulador real: cuatro pasos, documentación dentro del carácter, costo antes de enviar.","Entrá como «ana» (clave 1234) y cargá una copia certificada. Del otro lado, «suarez» o «molina» la ven en la bandeja.","Cada trámite tiene su guía; el segundo testimonio precarga la solicitud para imprimir, firmar y subir."]},
  {t:"3 · Buscar mi escritura (externo)", rol:"ciu", v:"buscar-req", g:["El superbuscador sirve afuera también, pero sin el contenido: dice si existe y cuánto sale.","Busca por cuenta, matrícula, apellido, número, año. Probá 1301 2345678 9.","Si no la encuentra, el armador sigue igual: búsqueda asistida por la Escribanía."]},
  {t:"1 · Turnero DDJJ: el obligado", rol:"obl", v:"ddjj", g:["Prioridad principal. Enlace desde la página de declaraciones juradas.","Tres tarjetas: hacer la declaración (SISCAE), sacar turno, bajar la constancia.","Nunca turno sin acta: se habilita solo con la declaración completa, dos días después."]},
  {t:"1 · Martes y viernes, de 8 a 13", rol:"obl", v:"ddjj-turno", g:["Franjas de 30 minutos, diez por día, se atiende de a uno. ~1.040 turnos al año contra ~700 actas.","Elegí el martes 6 a las 10:30 y confirmá: aparece en la bandeja interna de actas.","Recordatorio el día anterior. El pico de noviembre y diciembre se absorbe abriendo días extra."]},
  {t:"1 · La constancia, automática", rol:"obl", v:"ddjj-mis", g:["Una fila por período. La constancia se habilita cuando el circuito está completo y se descarga sin pedirla.","Sello del sistema más código de verificación: se valida en el verificador público."]},
  {t:"2 · Perfil VIP: un perfil, no un portal", rol:"vip", v:"vip", g:["El organismo entra por CiDi y el sistema lo reconoce. Ve lo de siempre más tres certificaciones propias. Siempre exento.","Cada pedido lleva varios documentos, como los archivos de un mail. Se observa por documento, no el pedido entero."]},
  {t:"2 · Nuevo pedido en cuatro pasos", rol:"vip", v:"vip-nuevo", g:["Qué necesitás, los documentos, quién firma, enviar.","De cada documento: nació digital o está en papel. Eso es lo único que define si hay que acercarse.","Quién firma: solo con vigencia al día. Vencida, se frena."]},
  {t:"2 · Legajo del organismo", rol:"vip", v:"vip-legajo", g:["La pestaña del ministerio por CUIT, del lado del organismo: quiénes firman, resolución, vigencia.","El organismo pide el alta; la Escribanía la confirma. Con resolución si la hay; si no, igual."]},
  {t:"Escribanía: el inicio real", rol:"egg", v:"inicio", g:["Los cuadros de SIIGENO tal cual. Los nuevos se suman: bandeja externa, DDJJ, registros, organismos, superbuscador, escrituración social.","Lo apagado existe y no cambia. El alta de escrituras sociales y la minuta de protocolo se rediseñan más adelante."]},
  {t:"Dos bandejas, sí o sí", rol:"egg", v:"bandeja", g:["Externa: lo que inicia alguien de afuera por el portal, incluidos los organismos. Iniciador con nombre y apellido, fecha de ingreso, qué sigue.","Interna: expedientes SUAC, aparte.","Abrí un pedido de organismo: controlás documento por documento, observás uno solo, certificás y asentás."]},
  {t:"Lo más importante: certificación de firma de funcionarios", rol:"egg", v:"bandeja-int", g:["Cargar trámite por interno, siempre. Y se termina de corrido: nunca vuelve a la bandeja a mitad de camino.","Tocá «Cargar trámite»: ministerio por CUIT → funcionario vigente → documentos → firma presencial → asiento en el libro → documento con código.","La certificación de copia, igual: documentos, confrontar, hoja de certificación digital, asiento en el registro."]},
  {t:"2 · Los dos registros", rol:"egg", v:"registros", g:["El libro de intervenciones, que espeja el físico. Y el registro de certificaciones de copia, que hoy no existe: se pidió varias veces.","Tocá un código: es lo que responde el verificador. Descargar muestra la hoja de certificación digital."]},
  {t:"2 · Organismos por CUIT", rol:"egg", v:"organismos", g:["La misma pestaña, del lado de la Escribanía: confirma las altas, renueva vigencias, da de alta a mano a los descentralizados sin CiDi."]},
  {t:"1 · La bandeja interna de actas", rol:"egg", v:"ddjj-int", g:["Recibida → armada → revisada → impresa → citada → firmada o anulada. Protocolo B.","El turno que confirmó el obligado está acá, resaltado. Se puede dar turno a mano y abrir días extra."]},
  {t:"1 · El personal marca la firma", rol:"egg", v:"ddjj-firmas", g:["Uno por uno: firmó o no vino. Firmó dispara la constancia; no vino manda el acta a anulación, que hace la escribana.","Cerrar la jornada deja las constancias disponibles."]},
  {t:"3 · Superbuscador interno", rol:"egg", v:"buscador", g:["Local y hermético: el protocolo no sale a internet. Seis campos de búsqueda.","Probá la cuenta 1301 2345678 9: la escritura 62 y sus antecedentes. Las fojas salen del protocolo: el costo se calcula solo."]},
  {t:"6 · Carga del mapa", rol:"egg", v:"mapa-carga", g:["Un auxiliar cambia la etapa de un barrio y el mapa público lo muestra al instante."]},
  {t:"Lo que falta definir", rol:"egg", v:"definir", g:["Bloqueante: el canal SISCAE → SIIGENO con datos estructurados. Conviene pedirlo ya.","Importante: firma digital de la escribana, asientos, códigos, valores de la Ley 11.090.","Orden propuesto: turnero, perfil VIP, superbuscador y simulador, verificador, armador, mapa."]},
  {t:"Lo que necesitamos de ustedes", rol:"egg", v:"respuesta", g:["Por cada producto: ¿lo toman?, ¿en cuánto tiempo?, ¿con qué prioridad?","Se anota acá mismo y se exporta al terminar."]}
];
function presIr(i){ S.presIdx=Math.max(0,Math.min(GUION.length-1,i)); const p=GUION[S.presIdx]; S.rol=p.rol; S.vista=p.v; render(); window.scrollTo({top:0}); }
const presPanel=()=>{ const i=S.presIdx, p=GUION[i]; return `<div class="paso">Presentación · ${i+1} de ${GUION.length}</div><h2>${esc(p.t)}</h2><div class="guion">${p.g.map(x=>`<p>${esc(x)}</p>`).join("")}</div>
  <div class="nav"><button class="btn sm" type="button" id="pAnt" ${i===0?"disabled":""}>← Anterior</button><button class="btn sm pri" type="button" id="pSig" ${i===GUION.length-1?"disabled":""}>Siguiente →</button><button class="btn sm" type="button" id="pSalir" style="margin-left:auto">Salir</button></div><p class="legend" style="margin-top:8px">También con las flechas del teclado.</p>
  <ol class="indice">${GUION.map((x,k)=>`<li><button type="button" data-pres="${k}" aria-current="${k===i}">${k+1}. ${esc(x.t)}</button></li>`).join("")}</ol>`; };
document.addEventListener("click",e=>{ const b=e.target.closest("#pAnt,#pSig,#pSalir,[data-pres]"); if(!b) return; if(b.id==="pAnt") presIr(S.presIdx-1); else if(b.id==="pSig") presIr(S.presIdx+1); else if(b.id==="pSalir"){ S.pres=false; render(); } else presIr(+b.dataset.pres); });

/* arranque */
(function(){ const h=location.hash.replace("#",""); if(h==="presentacion"){ S.pres=true; presIr(0); return; } if(VISTAS[h]){ S.vista=h; if(ROL_DE[h]) S.rol=ROL_DE[h]; } render(); })();
</script>
