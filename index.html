<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulador SIIGENO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: barra de portal arriba (azul para Requirentes, grafito y oro para la gestión interna),
   contenido en una columna con panel lateral fijo; botón "Anotar problema" abajo a la derecha.
   Tomado del recorrido final del armador y la bandeja. */
:root{
  --req-head:#0A4467; --req-acc:#C25A1E; --egg-head:#16222E; --egg-acc:#E0B04C;
  --bg:#F5F3EE; --surface:#FFFFFF; --surface-2:#F7F6F2; --fg:#1D2530; --muted:#69717E; --line:#DEDCD5;
  --link:#0A4467; --acc:var(--req-acc); --head:var(--req-head);
  --ok:#1D6B3F; --ok-bg:#E3F0E7; --warn:#8A6410; --warn-bg:#FBF1DA; --bad:#9E2A1E; --bad-bg:#FBE9E6;
  --info:#24527A; --info-bg:#E6EEF6; --orange:#A84A12; --orange-bg:#FBE8DA; --mute-bg:#ECEAE4;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
body.egg{ --bg:#ECEEF1; --surface-2:#F4F5F7; --line:#D9DDE3; --acc:var(--egg-acc); --head:var(--egg-head); --link:#0F4468; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161D; --surface:#19212B; --surface-2:#1E2733; --fg:#E3E7EC; --muted:#9AA4B1; --line:#2C3644; --link:#8DB8DE;
    --ok:#7FCB9C; --ok-bg:#16301F; --warn:#E3C26A; --warn-bg:#33290F; --bad:#F0928A; --bad-bg:#3A1A18;
    --info:#9DC0E2; --info-bg:#1B2C40; --orange:#F0A577; --orange-bg:#3A2416; --mute-bg:#26303C; color-scheme:dark;
  }
  :root:not([data-theme="light"]) body.egg{ --bg:#0F1319; --surface-2:#1C242F; --line:#2B3441; --link:#8DB8DE; }
}
:root[data-theme="dark"]{
  --bg:#11161D; --surface:#19212B; --surface-2:#1E2733; --fg:#E3E7EC; --muted:#9AA4B1; --line:#2C3644; --link:#8DB8DE;
  --ok:#7FCB9C; --ok-bg:#16301F; --warn:#E3C26A; --warn-bg:#33290F; --bad:#F0928A; --bad-bg:#3A1A18;
  --info:#9DC0E2; --info-bg:#1B2C40; --orange:#F0A577; --orange-bg:#3A2416; --mute-bg:#26303C; color-scheme:dark;
}
:root[data-theme="dark"] body.egg{ --bg:#0F1319; --surface-2:#1C242F; --line:#2B3441; --link:#8DB8DE; }
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--fg);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.flag{background:#0B1118;color:#B9C6D6;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:6px 16px;font-weight:600}
.flag b{color:#E7C26A}
header.top{background:var(--head);color:#fff;border-bottom:3px solid var(--acc)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
.topin{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand .n{font-weight:700;letter-spacing:.22em;font-size:17px}
.brand .k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#C7D3E0;font-weight:600}
body.egg .brand .k{color:var(--egg-acc)}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}
nav.tabs button{background:none;border:0;color:#C7D3E0;font-weight:600;font-size:13px;padding:7px 12px;border-radius:6px;cursor:pointer}
nav.tabs button:hover{background:rgba(255,255,255,.08);color:#fff}
nav.tabs button[aria-current=true]{background:rgba(255,255,255,.14);color:#fff}
.badge{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--acc);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
body.egg .badge{color:#18222F}
.me{margin-left:auto;display:flex;align-items:center;gap:10px}
.me .who{text-align:right;line-height:1.25;font-size:13px}
.me .who span{display:block;font-size:11.5px;color:#AFC0D2}
.av{width:32px;height:32px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-weight:700;font-size:12px;background:#2E6A99;color:#fff}
body.egg .av.top{background:var(--egg-acc);color:#18222F}
.ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);color:#fff;font-weight:600;font-size:12px;padding:6px 11px;border-radius:999px;cursor:pointer}
.ghost:hover{background:rgba(255,255,255,.16)}

main.page{padding-block:20px 110px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
@media(max-width:960px){.cols{grid-template-columns:1fr}}
.cols > *{min-width:0}
h1.t{font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:-.01em}
h2.t{font-family:var(--serif);font-weight:600;font-size:22px}
h3.t{font-family:var(--serif);font-weight:600;font-size:17px}
.hint{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.eyebrow.acc{color:var(--acc)}
.legend{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.link{background:none;border:0;padding:0;color:var(--link);font-weight:600;cursor:pointer;text-decoration:none}
.link:hover{text-decoration:underline}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);
  font-weight:500;font-size:14px;padding:9px 16px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--fg)}
.btn.pri{background:var(--req-head);border-color:var(--req-head);color:#fff;font-weight:600}
.btn.hot{background:var(--req-acc);border-color:var(--req-acc);color:#fff;font-weight:600}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.btn.sm{font-size:12.5px;padding:5px 10px}
.btn:disabled{background:var(--surface-2);color:var(--muted);border-color:var(--line);cursor:not-allowed}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.acts .a{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.acts .why{font-size:11.5px;color:var(--muted);max-width:200px}

label.f{display:block;font-size:12.5px;color:var(--fg);font-weight:600;margin-bottom:5px}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:7px;background:var(--surface);color:var(--fg)}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--link)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}
.g4{display:grid;grid-template-columns:1fr 1.4fr 2fr 1.2fr;gap:12px 14px}
@media(max-width:680px){.g2,.g3,.g4{grid-template-columns:1fr}}
.field{min-width:0}

.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
@media(max-width:600px){.opts.two{grid-template-columns:1fr}}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);border-radius:8px;padding:13px 15px;cursor:pointer;background:var(--surface)}
.opt::before{content:"";flex:0 0 auto;width:16px;height:16px;margin-top:2px;border-radius:50%;border:1.5px solid var(--muted);box-sizing:border-box}
.opt[aria-pressed=true]{border-color:var(--req-head);box-shadow:0 0 0 1px var(--req-head) inset}
.opt[aria-pressed=true]::before{border:5px solid var(--req-head)}
.opt .ot{font-weight:600;display:block}
.opt .od{color:var(--muted);font-size:13px;display:block;margin-top:1px}
.opt:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed}
.opt:disabled .ot{color:var(--muted)}

.box{border-radius:8px;padding:12px 15px;font-size:13.5px}
.box b{font-weight:600}
.b-info{background:var(--info-bg);color:var(--info)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-orange{background:var(--orange-bg);color:var(--orange)}
.b-mute{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.dash{border:1.5px dashed var(--warn);border-radius:8px;padding:14px 15px;background:var(--surface)}
.big{border-radius:10px;padding:20px 22px;border:1px solid var(--line)}
.big h3{font-family:var(--sans);font-size:18px;font-weight:700;margin-bottom:6px}

.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.c-info{background:var(--info-bg);color:var(--info)}
.c-warn{background:var(--warn-bg);color:var(--warn)}
.c-ok{background:var(--ok-bg);color:var(--ok)}
.c-bad{background:var(--bad-bg);color:var(--bad)}
.c-orange{background:var(--orange-bg);color:var(--orange)}
.c-mute{background:var(--mute-bg);color:var(--muted)}
.tag{display:inline-block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:2px 6px;border-radius:4px}

/* pasos del armador */
.steps{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;overflow-x:auto}
.steps .s{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.steps .s i{font-style:normal;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:11px;border:1.5px solid var(--line);color:var(--muted)}
.steps .s.done{color:var(--fg)}.steps .s.done i{background:var(--req-head);border-color:var(--req-head);color:#fff}
.steps .s.cur{color:var(--req-acc)}.steps .s.cur i{background:var(--req-acc);border-color:var(--req-acc);color:#fff}
.steps .ln{flex:1 1 30px;min-width:20px;height:1px;background:var(--line)}

.tabsline{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabsline button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 13px;font-weight:500;font-size:14px;color:var(--muted);cursor:pointer}
.tabsline button[aria-selected=true]{color:var(--fg);font-weight:600;border-bottom-color:var(--acc)}
.tabsline button:disabled{opacity:.55;cursor:not-allowed}
.tabsline .n{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;background:var(--mute-bg);color:var(--muted);border-radius:99px;padding:1px 7px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:11px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.nuevo td{background:var(--warn-bg)}
tr.nuevo td:first-child{box-shadow:inset 3px 0 0 var(--req-acc)}
.sub{font-size:12px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.nro{font-weight:700;color:var(--link);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:30px 14px;font-size:13.5px}
.tfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:var(--surface-2)}

.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px}
.kv .l{font-size:12px;color:var(--muted)}
.kv .v{font-weight:600;overflow-wrap:anywhere}
.kv .s2{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:680px){.tiles{grid-template-columns:1fr 1fr}}
.tile{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.tile .l{font-size:12px;color:var(--muted)}
.tile .v{font-weight:700;font-size:13.5px;overflow-wrap:anywhere}

.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 18px}
@media(max-width:820px){.checks{grid-template-columns:1fr}}
.ck{display:flex;gap:9px;align-items:flex-start;min-width:0}
.ico{flex:0 0 auto;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--line);margin-top:1px}
.ico.ok{background:var(--ok)}.ico.bad{background:var(--bad)}.ico.warn{background:#C79A2E}.ico.pend{background:var(--muted)}
.ck b{font-size:13.5px;font-weight:600;display:block}
.ck span{font-size:12px;color:var(--muted)}
.ckctl{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.ckctl button{border:1px solid var(--line);background:var(--surface);border-radius:5px;font-size:11.5px;padding:3px 7px;cursor:pointer;color:var(--muted)}
.ckctl button[aria-pressed=true].o{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.ckctl button[aria-pressed=true].c{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.ckctl button[aria-pressed=true].i{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.ck input{margin-top:5px;padding:5px 8px;font-size:12.5px}

.miss{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.miss li{display:flex;gap:9px;align-items:center;font-size:13.5px}
.miss li .ico{width:17px;height:17px;font-size:10px}
.miss li.p .ico{background:transparent;border:2px solid var(--req-acc)}
.miss li.p{font-weight:600}

.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hist li{position:relative;padding-left:18px}
.hist li::before{content:"";position:absolute;left:2px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--fg)}
.hist li.w::before{background:#C79A2E}
.hist b{font-size:13px;font-weight:600;display:block}
.hist span{font-size:12px;color:var(--muted)}
.notes{display:flex;flex-direction:column;gap:12px}
.note{display:flex;gap:9px}
.note .av{width:24px;height:24px;font-size:9.5px;background:#5D4B8C}
.note .t{font-size:12px;color:var(--muted)}
.note .t b{color:var(--fg)}
.note p{margin:2px 0 0;font-size:13px}
.side{display:flex;flex-direction:column;gap:14px}
.side hr{border:0;border-top:1px solid var(--line);margin:0}

.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 11px;font-size:13px;cursor:pointer}
.pills button:hover{border-color:var(--fg)}
.pills .on{background:var(--fg);color:var(--surface);border-color:var(--fg);font-weight:600}

.who-opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer}
.who-opt[aria-pressed=true]{border-color:var(--req-head);box-shadow:0 0 0 1px var(--req-head) inset}
.who-opt b{display:block;font-size:13.5px}
.who-opt span{font-size:12px;color:var(--muted)}
.asign{border:1.5px solid var(--egg-acc);border-radius:9px;padding:14px;display:flex;flex-direction:column;gap:8px}

.login{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.login{grid-template-columns:1fr}}
.portal{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.portal .ph{color:#fff;padding:14px 18px;border-bottom:3px solid}
.portal .ph.r{background:var(--req-head);border-color:var(--req-acc)}
.portal .ph.e{background:var(--egg-head);border-color:var(--egg-acc)}
.portal .ph .k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.8;font-weight:600}
.portal .ph .n{font-weight:700;font-size:16px;letter-spacing:.04em}
.portal .pb{padding:14px 18px;display:flex;flex-direction:column;gap:8px}

.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;background:#E7C26A;color:#1D2530;border:0;border-radius:999px;
  padding:12px 18px;font-weight:700;font-size:13.5px;cursor:pointer;box-shadow:0 6px 22px rgba(15,28,58,.3)}
.drawer{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(10,16,24,.45)}
.drawer .in{width:min(520px,100%);height:100%;background:var(--surface);overflow-y:auto;padding:20px 22px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:13px}
.ctx{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.ctx b{color:var(--muted);font-weight:600}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,16,24,.55);display:grid;place-items:center;padding:16px}
.modal .in{background:var(--surface);border-radius:12px;width:min(900px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.modal .mh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.modal .mh b{flex:1 1 200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal .mb{padding:16px;overflow:auto}
.modal iframe{width:100%;height:68vh;border:1px solid var(--line);border-radius:8px;background:#fff}
.modal img{display:block;margin:0 auto;border:1px solid var(--line);border-radius:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:70;background:#0B1118;color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;font-weight:600;max-width:calc(100% - 32px)}
.docrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface-2);border-radius:8px;padding:11px 13px}
.docrow.pend{background:var(--warn-bg)}
.docrow .dn{flex:1 1 220px;min-width:0}
.docrow .dn b{display:block;font-size:14px;font-weight:600}
.docrow .dn span{font-size:12px;color:var(--muted)}
.foot{font-size:11.5px;color:var(--muted);text-align:right;margin-top:6px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;position:relative;width:96px;height:72px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface-2)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumbs button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(10,16,24,.7);color:#fff;font-size:12px;cursor:pointer;line-height:1}
.drop{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:13px}
.drop.on{border-color:var(--req-acc);background:var(--orange-bg)}
.acc{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.acc[open]{border-color:var(--req-head);box-shadow:0 0 0 1px var(--req-head) inset}
.acc .opt{border:0;border-radius:0}
.acc .in{padding:4px 16px 16px 44px;display:flex;flex-direction:column;gap:10px}
.login.l3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:900px){.login.l3{grid-template-columns:1fr}}
header.top{border-bottom:0}
.topin{justify-content:space-between;padding-block:10px}

/* PDF de ejemplo, armado en el momento */
function pdfBlob(titulo, lineas){
  const enc = s => String(s).replace(/[^\x20-\xFF]/g,"-").replace(/([\\()])/g,"\\$1");
  let y=780; const ops=["BT","/F1 15 Tf",`50 ${y} Td`,`(${enc(titulo)}) Tj`,"ET"]; y-=12; ops.push("0.6 w",`50 ${y} m 545 ${y} l S`); y-=26;
  lineas.forEach(l=>{ (String(l).match(/.{1,88}(\s|$)|.{1,88}/g)||[""]).forEach(p=>{ ops.push("BT","/F1 11 Tf",`50 ${y} Td`,`(${enc(p.trim())}) Tj`,"ET"); y-=17; }); });
  ops.push("BT","/F1 8.5 Tf","50 50 Td",`(${enc("DOCUMENTO DE EJEMPLO - Simulador SIIGENO - Escribanía General de Gobierno de Córdoba - sin valor legal")}) Tj`,"ET");
  const st=ops.join("\n");
  const objs=["<< /Type /Catalog /Pages 2 0 R >>","<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
    "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>",
    `<< /Length ${st.length} >>\nstream\n${st}\nendstream`,"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>"];
  let out="%PDF-1.4\n"; const offs=[];
  objs.forEach((o,i)=>{ offs.push(out.length); out+=`${i+1} 0 obj\n${o}\nendobj\n`; });
  const x=out.length; out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
  const b=new Uint8Array(out.length); for(let i=0;i<out.length;i++) b[i]=out.charCodeAt(i)&255;
  return new Blob([b],{type:"application/pdf"});
}

/* Achica una captura antes de guardarla, para que entre cómoda en la base */
async function achicarImagen(file, max=1400){
  try{
    const url=URL.createObjectURL(file); const img=new Image();
    await new Promise((ok,no)=>{ img.onload=ok; img.onerror=no; img.src=url; });
    const k=Math.min(1, max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
    c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise(ok=>c.toBlob(ok,"image/jpeg",0.82)); URL.revokeObjectURL(url);
    return blob ? new File([blob], (file.name||"captura").replace(/\.\w+$/,"")+".jpg", {type:"image/jpeg"}) : file;
  }catch(e){ return file; }
}

async function firebaseDb(cfg){
  const V="12.7.0";
  const A=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const F=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const app=A.initializeApp(cfg);
  const fs=F.initializeFirestore(app,{ignoreUndefinedProperties:true});
  const snap=d=>({id:d.id, exists:d.exists(), data:()=>d.data()});
  return {
    collection:c=>({ onSnapshot:(next,err)=>F.onSnapshot(F.collection(fs,c),s=>next({docs:s.docs.map(snap)}),err) }),
    doc:p=>{ const [c,id]=p.split("/"); const r=F.doc(fs,c,id);
      return { get:async()=>snap(await F.getDoc(r)), set:d=>F.setDoc(r,d), update:d=>F.updateDoc(r,d), delete:()=>F.deleteDoc(r) }; }
  };
}
const COLS=["usuarios","tramites","problemas"];

    else { this.modo="local"; window.addEventListener("storage",e=>COLS.forEach(c=>{ if(e.key==="simsig_"+c) this._emit(c); })); }
  },
  _read(c){ try{ return JSON.parse(lsGet("simsig_"+c)||"{}"); }catch(e){ return {}; } },
  _emit(c){ const m=this._read(c); (this.subs[c]||[]).forEach(fn=>fn(Object.entries(m).map(([id,d])=>({...d,id})))); },
  subscribe(c,fn,onErr){
    if(this.modo==="compartido") return this.db.collection(c).onSnapshot(s=>fn(s.docs.map(d=>({...d.data(),id:d.id}))),e=>onErr&&onErr(e));
    (this.subs[c]=this.subs[c]||[]).push(fn); this._emit(c); return ()=>{};
  },
  async set(c,id,data){ if(this.modo==="compartido") return this.db.doc(c+"/"+id).set(data);
    const m=this._read(c); m[id]=data; lsSet("simsig_"+c,JSON.stringify(m)); this._emit(c); },
  async update(c,id,patch){ if(this.modo==="compartido") return this.db.doc(c+"/"+id).update(patch);
    const m=this._read(c); m[id]={...(m[id]||{}),...patch}; lsSet("simsig_"+c,JSON.stringify(m)); this._emit(c); },
  async del(c,id){ if(this.modo==="compartido") return this.db.doc(c+"/"+id).delete();
    const m=this._read(c); delete m[id]; lsSet("simsig_"+c,JSON.stringify(m)); this._emit(c); },
  async subir(file){
    if(this.modo==="compartido" && this.assets){
      try{ const r=await this.assets.upload(file,{type:file.type||"application/pdf"}); return {ref:"a:"+r.id,nombre:file.name}; }
      catch(e){ if(!["not_granted","capability_disabled","capability_removed","quota_or_state"].includes(e&&e.code)) throw e; }
    }
    if(file.size>this.limite) throw {message:`El archivo pesa más de ${Math.round(this.limite/1024)} KB. Para la prueba usá «PDF de ejemplo» o un archivo más chico.`};
    const id=nuevoId("f"), data=await blobADataUrl(file);
    if(this.modo==="compartido") await this.db.doc("archivos/"+id).set({nombre:file.name,tipo:file.type,data});
    else { try{ localStorage.setItem("simsig_f_"+id,JSON.stringify({nombre:file.name,tipo:file.type,data})); }
           catch(e){ throw {message:"El navegador no tiene más lugar para archivos. Usá «PDF de ejemplo»."}; } }
    return {ref:"d:"+id,nombre:file.name};
  },
  async blobDe(ref){
    if(ref.startsWith("a:")){ const r=await fetch("/_blob/"+ref.slice(2)); return r.ok?r.blob():null; }
    const id=ref.slice(2); let d=null;
    if(this.modo==="compartido"){ const s=await this.db.doc("archivos/"+id).get(); d=s.exists?s.data():null; }
    else { try{ d=JSON.parse(lsGet("simsig_f_"+id)||"null"); }catch(e){} }
    return d ? dataUrlABlob(d.data) : null;
  }
};

/* documentos que pide cada caso: todos se adjuntan en el paso Carácter, salvo la nota firmada, que va al final */
function docsDe(w){
  if(!w||!w.tipo||!w.caracter) return [];
  const C=CARACTERES[w.caracter];
  const l=(C.docs||[]).map(d=>({k:d[0],n:d[1],d:d[2],grupo:C.unaDe?"rep":null}));
  if(w.tipo==="testimonio"){
    l.push({k:"denuncia",n:"Denuncia policial por robo, hurto o extravío",d:"La exposición, con la mayor cantidad de datos posibles",extra:true});
    if(w.extra?.obligaciones==="si") l.push({k:"conformidad",n:"Conformidad del acreedor o autorización judicial",d:"Porque la escritura tiene obligaciones pendientes",extra:true});
    l.push({k:"nota",n:"Nota de solicitud con firma certificada ante escribano",d:"La genera el sistema en el paso 4. La imprimís, la firman ante escribano y la subís.",nota:true});
  }
  return l;
}
const docsOk = (w,filtro) => { const ds=docsDe(w).filter(filtro||(()=>true)); const g=ds.filter(d=>d.grupo); return ds.filter(d=>!d.grupo).every(d=>w.adj?.[d.k]) && (!g.length||g.some(d=>w.adj?.[d.k])); };
function itemsControl(t){
  const w=t.w, l=[];
  docsDe(w).forEach(d=>{ if(d.grupo){ if(!l.some(x=>x.k===d.grupo)) l.push({k:d.grupo,n:"Poder o autorización",docs:docsDe(w).filter(x=>x.grupo).map(x=>x.k)}); }
    else l.push({k:d.k,n:d.k==="nota"?"Nota con firma certificada":d.n,docs:[d.k]}); });
  if(w.caracter==="interes") l.push({k:"fundamento",n:"Fundamento del interés",docs:[]});
  if(t.tipo==="testimonio") l.push({k:"obligaciones",n:"Obligaciones pendientes",docs:[]});
  if(!l.length) l.push({k:"parte",n:w.caracter==="escribano"?"Matrícula y registro vigentes":"Coincide con la parte del protocolo",docs:[]});
  return l;
}
function protocolo(w){ const n=parseInt(w.esc?.n||"0",10)||7;
  return {acto:["Compraventa","Donación","Adjudicación — Ley 9811","Cesión de derechos"][n%4], comprador:["Roberto Gómez","Ana Gómez","Luis Ferreyra","Marta Ríos"][n%4],
    vendedor:["Inmobiliaria del Centro S.A.","Provincia de Córdoba","Héctor Ledesma","Juan Pérez"][n%4], matricula:(1204156+n).toLocaleString("es-AR"),
    domicilio:"Deán Funes "+(1000+n%400), fojas:(n*7)%12+4, obligaciones:"No consta"}; }
/* cotización: fojas × tasa (copias), monto fijo (testimonio); ejemplares adicionales al 50 % */
function cotizar(w){
  if(!w.tipo||w.tipo==="antecedentes") return {sinCosto:true, total:0, lineas:[]};
  const ej=Math.max(1,+w.pedido?.ejemplares||1), C=w.caracter&&CARACTERES[w.caracter];
  let base, det;
  if(w.tipo==="testimonio"){ if(!w.soporte) return null; base=TASAS["testimonio_"+w.soporte]; det=`Monto fijo · ${w.soporte==="papel"?"en papel":"digital firmado"}`; }
  else { const u=TASAS[(w.modo==="cert"?"cert":"simple")+"_"+w.soporte]; const f=protocolo(w).fojas; base=u*f; det=`${f} hojas autenticadas × ${pesos(u)}`; }
  const lineas=[[nombreW(w),det,base]];
  if(ej>1) lineas.push(["Ejemplar adicional",`${ej-1} ejemplar${ej>2?"es":""} al 50 %`,Math.round(base*0.5*(ej-1))]);
  let total=lineas.reduce((a,l)=>a+l[2],0);
  if(C?.exento){ lineas.push(["Exención aplicada","Juez u organismo público · legitimación inciso 2",-total]); total=0; }
  return {total, lineas, exento:!!C?.exento};
}
/* el carácter decide cuándo se cotiza: parte → ahora y paga al enviar; los demás → al dar el alta */
const carrilDirecto = w => w.caracter==="parte" && w.tipo!=="antecedentes";
const tasaAlAlta = t => { const c=cotizar(t.w); return c?c.total:0; };

  pedido:{ejemplares:"1",motivo:"",para:"",objeto:"",destino:""}, adj:{}, dj:false, tabC:"falta", enviando:false}; }
function okPaso(n){
  const w=W;
  if(n===1) return !!w.tipo && (w.esc.identificada || (w.esc.anio.length===4 && !!w.esc.n && fechaOk(w.esc.fecha)));
  if(n===2){ if(w.tipo==="antecedentes") return true;

function porqueNo(n){ const w=W;

function textoNota(w,u){ u=u||(w.para?usuario(w.para):yo()); if(!w.tipo) return "Elegí el trámite para ver la nota.";

  return `Sra. Escribana General de Gobierno: ${u.nombre}${u.doc?`, ${u.doc}`:""}, con domicilio en ${u.domicilio||"—"}, en carácter de ${C?C.corto.toLowerCase():"—"}${w.acred.autos?` (autos «${w.acred.autos}»)`:""}, solicita ${nombreW(w).toLowerCase()} de la escritura N.º ${w.esc.n||"—"} del año ${w.esc.anio||"—"} (${w.esc.protocolo}), en ${w.pedido.ejemplares||1} ejemplar(es)${w.pedido.motivo?`. Motivo: ${w.pedido.motivo.toLowerCase()}`:""}${w.extra?.denuncia?.nro?`, denuncia N.º ${w.extra.denuncia.nro} ante ${w.extra.denuncia.lugar} del ${w.extra.denuncia.fecha}`:""}${w.pedido.para?`. Destino: ${w.pedido.para}`:w.pedido.objeto?`. Objeto: ${w.pedido.objeto.toLowerCase()}`:""}.`; }

async function enviarW(){
  const w=W; if(w.enviando) return; w.enviando=true; vArmador();
  const u=titular(), quien=yo(), ahora=Date.now(), ds=docsDe(w), prev=w.id?tramite(w.id):null;
  const directo=carrilDirecto(w), c=cotizar(w);
  const max=S.tramites.map(t=>parseInt(t.nro,10)||0).reduce((a,b)=>Math.max(a,b),4900);
  const nro=prev?.nro||String(max+1).padStart(5,"0");
  const ordenes=[...(prev?.ordenes||[])]; const add=o=>ordenes.push({...o,n:ordenes.length+1,t:ahora});
  add(w.adj.nota? {nombre:"Nota de solicitud con firma certificada",origen:"req",por:u.nombre,archivos:[{...w.adj.nota,n:"Nota firmada"}]}
                : {nombre:"Nota de solicitud",origen:"req",por:u.nombre,gen:{titulo:TRAMITES[w.tipo].form,lineas:[textoNota(w,u)]}});
  const ad=ds.filter(d=>!d.nota&&w.adj[d.k]).map(d=>({...w.adj[d.k],n:d.n,k:d.k}));
  if(ad.length) add({nombre:`Documentación del carácter${ad.length>1?` (${ad.length} archivos)`:""}`,origen:"req",por:u.nombre,archivos:ad});
  add({nombre:"Constancia de inicio",origen:"auto",por:"SIIGENO",gen:{titulo:"Constancia de inicio — Solicitud "+nro,lineas:[`Trámite: ${nombreW(w)}`,`Requirente: ${u.nombre} (${u.doc||""})`,`Ingreso: ${fFecha(ahora)} ${fHora(ahora)}`]}});
  const hist=[...(prev?.historial||[]), {t:ahora,nombre:W.para?quien.nombre:u.nombre,accion:W.para?"Cargado por mesa de entradas":"Enviado desde el portal"}];
  let etapa="sin_asignar", tasa=null;
  if(directo){
    etapa="en_preparacion";
    if(c.total>0){ tasa={monto:c.total,t:ahora,pagada:true,pagadaEn:ahora};
      add({nombre:"Comprobante de pago",origen:"auto",por:"SIIGENO",gen:{titulo:"Comprobante de pago — Trámite "+nro,lineas:[`Tasa Retributiva de Servicios: ${pesos(c.total)}`,`Pagado el ${fFecha(ahora)} a las ${fHora(ahora)} (simulado)`]}});
      hist.push({t:ahora,nombre:"SIIGENO",accion:"Pago acreditado"}); }
    hist.push({t:ahora,nombre:"SIIGENO",accion:"Carril directo: figura como parte en el protocolo"});
  }
  const doc={nro, tipo:w.tipo, solicitante:u.id, solicitanteNombre:u.nombre, solicitanteDoc:u.doc||"", origen:W.para?"mesa":"portal", carril:directo?"directo":"control",
    w:clon({...w,enviando:false,dj:false,_directo:undefined}), adj:clon(w.adj), etapa, responsable:null, control:{}, tasa, turno:null, ordenes, historial:hist,
    notas:prev?.notas||[], busqueda:prev?.busqueda||null, creado:prev?.creado||ahora, ingreso:ahora, actualizado:ahora};
  const id=w.id||nuevoId("t");
  try{ await Store.set("tramites",id,doc); W=null;
    if(lado(quien)==="egg"){ toast("Trámite "+nro+" cargado"); ir("ficha",id); }
    else { S.aviso=directo&&tasa?`Pagaste y enviamos tu solicitud. Número ${nro}. Entra a la Escribanía ya abonada.`:`Enviamos tu solicitud. Número ${nro}. Te avisamos acá cuando haya novedades.`; ir("mis"); } }
  catch(e){ w.enviando=false; vArmador(); toast("No se pudo enviar: "+(e.message||e.code||"error")); }
}

function vDetReq(){
  const t=tramite(S.sel), u=yo(), app=$("#app");

  const flag=t.etapa==="falta_algo"?Object.entries(t.control||{}).filter(([k,v])=>v.e&&v.e!=="ok").map(([k])=>k):[];
  let cur=5;
  if(t.etapa==="falta_algo") cur=flag.includes("nota")&&flag.length===1?4:2; else if(t.etapa==="a_pagar"&&!pagada) cur=3; else if(t.etapa==="no_corresponde") cur=2.5; else if(t.tipo==="busqueda") cur=1;

        ${S.conf==="corregir"?`<div class="card stack"><h3 class="t">Corregí lo observado · paso ${cur} (${PASOS[cur-1]})</h3>${corregibles.flatMap(i=>i.docs.map(k=>{ const d=docsDe(w).find(x=>x.k===k); return filaAdj(d,(t.corr||{})[k],"c"); })).join("")||`<p class="hint">Lo observado no es un archivo. Contá qué hiciste y reenviá.</p>`}

      } else {

      } break;
    case "entregado":
      main=`<div class="big b-mute"><h3>${w.soporte==="papel"?"Lo retiraste":"Lo descargaste"} el ${fCorta(t.entregado)} a las ${fHora(t.entregado)}</h3>El trámite está cerrado. Vas a poder seguir viendo siempre lo que presentaste y lo que se te entregó.</div>${chips}`;
      btns=`<button class="btn" type="button" data-act="verDocs">Ver mis documentos</button><button class="btn" type="button" data-act="verOrdenNom" data-arg="${t.id}" data-n="Constancia de entrega">Descargar la constancia</button>`; break;
    case "no_corresponde":
      main=`<div class="big b-bad"><h3>No pudimos darle curso</h3>${esc(t.resolucion||"")}</div>

function tasaCol(t){
  if(t.tipo==="busqueda") return `<span class="tag c-mute">Sin tasa</span><div class="sub">búsqueda</div>`;
  if(t.tipo==="antecedentes") return `<span class="tag c-mute">Sin costo</span><div class="sub">solo escribanos</div>`;
  if(CARACTERES[t.w.caracter]?.exento) return `<span class="tag c-mute">Exenta</span><div class="sub">organismo público</div>`;
  if(!t.tasa) return `<span class="tag c-mute">Sin tasar</span><div class="sub">falta el alta</div>`;
  return t.tasa.pagada?`<span class="tag c-ok">Paga</span><div class="sub">${pesos(t.tasa.monto)}</div>`:`<span class="tag c-orange">A pagar</span><div class="sub">${pesos(t.tasa.monto)}</div>`;
}
const nArchivos = t => (t.ordenes||[]).length;
const sinDueno = t => !t.responsable && !CERRADOS.includes(t.etapa) && t.etapa!=="encontrada";
const grupoEgg = t => sinDueno(t)?"nuevo":CERRADOS.includes(t.etapa)?"cerrado":(ETAPAS[t.etapa].req[0]&&["falta_algo","encontrada"].includes(t.etapa)||t.etapa==="a_pagar"&&!t.tasa?.pagada||t.etapa==="listo")?"req":"curso";
const GRUPOS=[["todos","Todos",null],["nuevo","Sin asignar","var(--req-acc)"],["curso","En curso","var(--info)"],["req","Esperan al requirente","#8E6BBF"],["cerrado","Terminados","var(--ok)"]];
function vBandeja(){
  const u=yo(), ext=activos(), base=S.tabB==="mios"?ext.filter(t=>t.responsable===u.id):ext; if(!S.fB) S.fB="todos";
  const orden={nuevo:0,curso:1,req:2,cerrado:3};
  const l=base.filter(t=>S.fB==="todos"||grupoEgg(t)===S.fB).sort((a,b)=>orden[grupoEgg(a)]-orden[grupoEgg(b)]||b.ingreso-a.ingreso);
  const nuevos=ext.filter(sinDueno).length;
  const estadoSub=t=>{ const tc=tasaCol(t).replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim(); return `${t.responsable?esc(nombreDe(t.responsable)):"Nadie a cargo"} · ${esc(tc)}`; };
  $("#app").innerHTML=`<div class="stack">
    <div class="spread" style="align-items:flex-end"><div><h1 class="t">Bandeja de entrada</h1>

function puede(t,a){
  const u=yo(); if(!u||lado(u)!=="egg") return false;
  const e=esEsc(), mio=t.responsable===u.id, trabaja=e||mio, et=t.etapa, cerrado=CERRADOS.includes(et);
  switch(a){
    case "asignar": return e && !cerrado;
    case "tomarYo": return e && et==="sin_asignar";
    case "tomar": return mio && et==="asignado";
    case "controlar": case "observar": case "alta": return trabaja && et==="en_revision";
    case "noCorresponde": return e && ["sin_asignar","asignado","en_revision","falta_algo"].includes(et);
    case "reenviarAviso": return trabaja && et==="falta_algo";
    case "empezar": return trabaja && et==="a_pagar";
    case "producto": case "listo": return trabaja && et==="en_preparacion";
    case "entrega": return trabaja && et==="listo" && t.w.soporte==="papel";
    case "reabrir": return e && et==="no_corresponde";
    case "buscar": return et==="buscando";
  }
  return false;
}
async function mover(id, accion, etapa, extra={}, opts={}){
  const t=tramite(id), u=yo(), ahora=Date.now();
  const patch={...extra, actualizado:ahora, historial:[...(t.historial||[]), {t:ahora, nombre:opts.por||u.nombre, accion, w:!!opts.warn}]};
  if(opts.orden) patch.ordenes=[...(t.ordenes||[]), {...opts.orden, n:(t.ordenes||[]).length+1, t:ahora}];
  if(etapa) patch.etapa=etapa;
  try{ await Store.update("tramites",id,patch); if(opts.toast!==false) toast(accion); }
  catch(e){ toast("No se pudo guardar: "+(e.message||e.code||"error")); }
}
const ck=(e,b,s)=>`<div class="ck"><span class="ico ${e}">${e==="ok"?"✓":e==="bad"?"×":e==="warn"?"!":""}</span><div><b>${esc(b)}</b><span>${esc(s||"")}</span></div></div>`;

  const l=itemsControl(t).filter(i=>c[i.k]?.e&&c[i.k].e!=="ok").map(i=>`${i.n}: ${c[i.k].nota||(c[i.k].e==="impide"?"impide dar el alta":"hay que corregirlo")}.`);
  return l.join(" ") + (l.length?" Devuelto al requirente para corregir.":""); }

    ${conf}

function hojaRuta(t,egg){
  let l=(t.ordenes||[]).filter(o=>egg||o.origen==="req"||o.env);
  if(egg&&S.filtroDoc!=="todos") l=l.filter(o=>S.filtroDoc==="env"?o.env:S.filtroDoc==="egg"?(o.origen==="egg"||o.origen==="auto"):o.origen==="req");
  if(!l.length) return `<div class="empty">Sin documentos en este filtro.</div>`;
  return `<div class="tablewrap" style="border:0;border-radius:0"><table><thead><tr><th>Orden</th><th>Fecha y hora</th><th>Documento</th><th>Formato</th><th>Incorporado por</th><th></th></tr></thead><tbody>
    ${l.map(o=>`<tr class="${o.emitido?"emit":""}" ${!o.emitido&&o.env&&egg?'style="background:var(--warn-bg)"':""}><td class="nro" style="color:var(--muted)">${pad(o.n)}</td><td class="num">${fCorta(o.t)} ${fHora(o.t)}</td>
      <td><b>${esc(o.nombre)}</b>${o.emitido?` <span class="tag c-ok">Emitido</span>`:""}${o.reemplaza?`<div class="sub">Reemplaza la orden ${pad(o.reemplaza)}</div>`:""}${o.archivos&&o.archivos.length>1?`<div class="sub">${o.archivos.map(a=>esc(a.n||a.nombre)).join(" · ")}</div>`:""}</td>
      <td class="sub">PDF${o.archivos?` · ${o.archivos.length} archivo${o.archivos.length===1?"":"s"}`:" · 1 f."}</td>
      <td>${esc(o.por)}<div class="sub">${o.origen==="req"?"Requirente":o.origen==="auto"?"Automático":"Escribanía"}</div></td>
      <td class="row" style="flex-wrap:nowrap">${o.archivos?o.archivos.map((a,i)=>`<button class="link" type="button" data-ver="${esc(a.ref)}" data-nom="${esc(a.nombre)}">Ver${o.archivos.length>1?" "+(i+1):""}</button>`).join(" "):`<button class="link" type="button" data-act="verOrden" data-arg="${t.id}" data-n="${o.n}">Ver</button>`}</td></tr>`).join("")}
  </tbody></table></div>`;
}

function contextoProblema(){
  const u=yo(); let t=null;
  if(["ficha","det"].includes(S.vista)) t=tramite(S.sel);
  return {pantalla:pantalla(), tramite:t?nombreT(t):(["armador","busqueda"].includes(S.vista)&&W?.tipo?nombreW(W):""), nro:t?.nro||"",
    etapa:t?(lado(u)==="egg"?ETAPAS[t.etapa].egg[0]:ETAPAS[t.etapa].req[0]):"", quien:u?.nombre||"Sin ingresar", rol:u?ROLES[u.rol].n:"", lado:lado(u)||""};
}
function abrirProblema(){ if(!P) P={texto:"",capturas:[]}; P.ctx=contextoProblema(); dibujarP(); setTimeout(()=>$("#pTxt")?.focus(),30); }
function dibujarP(){
  const c=P.ctx;
  $("#layer").innerHTML=`<div class="drawer" id="dw" role="dialog" aria-modal="true" aria-label="Anotar problema"><form class="in" id="fp">
    <div class="spread"><div><div class="eyebrow">Relevamiento de SIIGENO</div><h2 class="t" style="margin-top:4px">Anotar problema</h2></div><button class="btn sm" type="button" id="pX">Cerrar</button></div>
    <div class="ctx"><b>Dónde</b><span>${esc(c.pantalla)}</span>${c.nro?`<b>Trámite</b><span>${esc(c.nro)} · ${esc(c.tramite)}</span><b>Estado</b><span>${esc(c.etapa)}</span>`:c.tramite?`<b>Trámite</b><span>${esc(c.tramite)}</span>`:""}<b>Quién</b><span>${esc(c.quien)}${c.rol?" · "+esc(c.rol):""}</span></div>
    <p class="legend" style="margin-top:-6px">Esto se guarda solo con el problema.</p>
    <div class="field"><label class="f" for="pTxt">¿Qué pasó?</label><textarea id="pTxt" rows="6" placeholder="Contalo como te salga: qué hiciste, qué pasó y qué esperabas.">${esc(P.texto)}</textarea></div>
    <div class="drop" id="pDrop">Pegá una captura con <b>Ctrl+V</b> (recortá con Win+Shift+S), arrastrala acá, o <label class="link" for="pCap" style="cursor:pointer">elegí una imagen</label>.<input type="file" id="pCap" accept="image/*" multiple hidden></div>
    ${P.capturas.length?`<div class="thumbs">${P.capturas.map((x,i)=>`<figure><img src="${esc(x.url)}" alt="Captura ${i+1}" data-verimg="${i}"><button type="button" data-quitar="${i}" aria-label="Quitar captura ${i+1}">×</button></figure>`).join("")}</div>`:""}
    <div class="acts"><button class="btn pri" type="submit" ${P.subiendo?"disabled":""}>${P.subiendo?"Subiendo…":"Guardar"}</button><button class="btn" type="button" id="pVer">Ver todos los problemas</button></div></form></div>`;
  $("#pTxt").addEventListener("input",e=>{ P.texto=e.target.value; });
  const cerrar=()=>{ $("#layer").innerHTML=""; };
  $("#pX").onclick=cerrar; $("#dw").onclick=e=>{ if(e.target.id==="dw") cerrar(); };
  $("#pVer").onclick=()=>{ cerrar(); ir("problemas"); };
  $("#pCap").onchange=()=>{ [...$("#pCap").files].forEach(captura); };
  const d=$("#pDrop");
  d.ondragover=e=>{ e.preventDefault(); d.classList.add("on"); }; d.ondragleave=()=>d.classList.remove("on");
  d.ondrop=e=>{ e.preventDefault(); d.classList.remove("on"); [...(e.dataTransfer?.files||[])].filter(f=>f.type.startsWith("image/")).forEach(captura); };
  $("#fp").querySelectorAll("[data-quitar]").forEach(b=>b.onclick=()=>{ P.capturas.splice(+b.dataset.quitar,1); dibujarP(); });
  $("#fp").querySelectorAll("[data-verimg]").forEach(im=>im.onclick=()=>window.open(im.src,"_blank"));
  $("#fp").onsubmit=async e=>{ e.preventDefault();
    if(!P.texto.trim()&&!P.capturas.length){ toast("Escribí qué pasó o pegá una captura."); $("#pTxt").focus(); return; }
    if(P.subiendo) return;
    const num=S.problemas.map(p=>p.num||0).reduce((a,b)=>Math.max(a,b),0)+1, codigo="P-"+String(num).padStart(3,"0");
    const doc={...P.ctx, texto:P.texto.trim(), capturas:P.capturas.map(x=>({ref:x.ref,nombre:x.nombre})), num, codigo, uid:S.me, fecha:Date.now(), estado:"Nuevo"};
    try{ await Store.set("problemas",nuevoId("p"),doc); toast(`Problema ${codigo} guardado`); P=null; cerrar(); }
    catch(err){ toast("No se pudo guardar: "+(err.message||err.code||"error")); } };
}
async function captura(f){
  if(!P) return;
  try{ P.subiendo=true; if($("#dw")) dibujarP();
    const chica=await achicarImagen(f), nombre=`captura-${Date.now()}.jpg`;
    const r=await Store.subir(new File([chica],nombre,{type:chica.type||"image/jpeg"}));
    P.capturas.push({...r, url:URL.createObjectURL(chica)}); }
  catch(e){ toast(e.message||"No se pudo subir la captura."); }
  finally{ if(P){ P.subiendo=false; if($("#dw")) dibujarP(); } }
}
document.addEventListener("paste",e=>{ const its=[...(e.clipboardData?.items||[])].filter(i=>i.type.startsWith("image/")); if(!its.length) return;
  if(!$("#dw")) abrirProblema();   // pegar una captura en cualquier pantalla abre el anotador
  e.preventDefault(); its.forEach(i=>captura(i.getAsFile())); });

async function exportarCSV(){
  const cols=[["codigo","ID"],["fecha","Fecha"],["quien","Quién"],["rol","Rol"],["pantalla","Pantalla"],["nro","Trámite N.º"],["tramite","Trámite"],["etapa","Estado del trámite"],["texto","Qué pasó"],["capturas","Capturas"],["estado","Estado del problema"]];
  const val=(p,k)=>k==="fecha"?`${fFecha(p.fecha)} ${fHora(p.fecha)}`:k==="capturas"?(p.capturas||[]).map(c=>c.nombre).join(", "):k==="texto"?(p.texto||p.paso||""):(p[k]??"");
  const q=s=>'"'+String(s).replace(/"/g,'""').replace(/\r?\n/g," ")+'"';
  const txt="﻿"+[cols.map(c=>q(c[1])).join(";"),...S.problemas.slice().sort((a,b)=>(a.num||0)-(b.num||0)).map(p=>cols.map(c=>q(val(p,c[0]))).join(";"))].join("\r\n");
  await guardarArchivo(new Blob([txt],{type:"text/csv"}), `problemas-siigeno-${fFecha(Date.now()).replace(/\//g,"-")}.csv`);

async function guardarArchivo(blob,nombre){
  if(Store.downloads){ try{ await Store.downloads.save({filename:nombre,data:blob}); return; }catch(e){ if(e&&/cancel|declin/i.test(e.code||"")) return; } }
  try{ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nombre; document.body.appendChild(a); a.click(); a.remove(); }catch(e){ toast("No se pudo descargar."); }
}

async function abrirVisor(blob,nombre){
  if(!blob){ toast("No se encontró el archivo."); return; }
  const url=URL.createObjectURL(blob), img=(blob.type||"").startsWith("image/");
  $("#layer").innerHTML=`<div class="modal" id="visor" role="dialog" aria-modal="true" aria-label="Ver archivo"><div class="in">
    <div class="mh"><b>${esc(nombre)}</b><button class="btn sm" type="button" id="vDesc">Descargar</button><a class="btn sm" href="${url}" target="_blank" rel="noopener">Abrir en otra pestaña</a><button class="btn sm" type="button" id="vX">Cerrar</button></div>
    <div class="mb">${img?`<img src="${url}" alt="${esc(nombre)}">`:`<iframe src="${url}" title="${esc(nombre)}"></iframe>`}</div></div></div>`;
  $("#vX").onclick=()=>{ $("#layer").innerHTML=""; }; $("#visor").onclick=e=>{ if(e.target.id==="visor") $("#layer").innerHTML=""; };
  $("#vDesc").onclick=()=>guardarArchivo(blob,nombre);
}
async function verRef(ref,nombre){ try{ abrirVisor(await Store.blobDe(ref),nombre); }catch(e){ toast("No se pudo abrir el archivo."); } }
function verOrden(t,o){

}

  const t=ctx==="w"?null:tramite(S.sel), w=ctx==="w"?W:t.w, u=ctx==="w"?titular():usuario(t.solicitante);
  const lin = ctx==="p" ? [`${TRAMITES[t.tipo].form}`,`Trámite ${t.nro}`,`Requirente: ${t.solicitanteNombre}`,`Escritura N.º ${w.esc.n||"—"} del año ${w.esc.anio||"—"} — ${protocolo(w).acto}`,`Matrícula ${protocolo(w).matricula}`,`Fecha de emisión: ${fFecha(Date.now())}`]
    : k==="nota" ? [textoNota(w,u),"","Firmado por el/los requirente/s.","Certifico que la/s firma/s que antecede/n fue/ron puesta/s en mi presencia. (Certificación simulada)"]
    : [`Presentado por: ${u.nombre} (${u.doc||""})`,`Trámite: ${nombreW(w)}`,`Escritura N.º ${w.esc.n||"—"} del año ${w.esc.anio||"—"}`,`Fecha: ${fFecha(Date.now())}`];
  subirAdj(ctx,k,pdfFile(n,lin));
}

/* ==================================================================
   ARRANQUE
   ================================================================== */
(async function(){
  render();
  await Store.init();
  S.me=lsGet("simsig_me");
  const onErr=e=>{ toast("Se perdió la conexión con la base. Recargá la página."); console.error(e); };
  Store.subscribe("usuarios",l=>{ S.usuarios=l; S.listo.usuarios=true;
    if(S.me&&!yo()&&l.length) S.me=null;
    if(yo()?.activo===false){ S.me=null; lsSet("simsig_me",null); toast("Tu usuario fue dado de baja."); }
    if(S.vista==="login"&&yo()) S.vista=lado(yo())==="egg"?"bandeja":"mis";
    if(yo()&&["bandeja","ficha","usuarios"].includes(S.vista)&&lado(yo())!=="egg") S.vista="mis";
    if(yo()&&["mis","det"].includes(S.vista)&&lado(yo())==="egg") S.vista="bandeja";
    if(S.vista==="usuarios"&&!esEsc()) S.vista="bandeja";
    refrescar(); },onErr);
  Store.subscribe("tramites",l=>{ S.tramites=l; S.listo.tramites=true; refrescar(); },onErr);
  Store.subscribe("problemas",l=>{ S.problemas=l; refrescar(); },onErr);
})();
/* Redibuja sin romper lo que se está escribiendo */
function refrescar(){
  if((S.vista==="armador"&&W)||S.vista==="busqueda"){ renderTop(); return; }
  const a=document.activeElement;
  if(a&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&a.type!=="file"&&a.type!=="checkbox"))&&$("#app").contains(a)){ renderTop(); return; }
  render();
}
</script>
